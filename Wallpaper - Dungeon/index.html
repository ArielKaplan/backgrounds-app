<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Pixel Dungeon Wallpaper</title>
<script type="application/json" id="wallpaper-settings">
{
 "about": "Settings panel for the Backgrounds app. Each param is one #key=value option of this page.",
 "name": "Dungeon",
 "description": "A hero crawls a procedural dungeon on its own.",
 "params": [
  {"key": "pixels", "label": "Pixel size", "type": "range", "min": 100, "max": 400, "step": 10, "default": 240, "help": "Rows of big pixels on screen. Smaller = chunkier, bigger characters."},
  {"key": "floor", "label": "Start floor", "type": "range", "min": 0, "max": 9, "step": 1, "default": 0, "help": "Later floors change the theme."},
  {"key": "boss", "label": "Boss", "type": "select", "default": "", "options": [["", "Random"], ["king", "king"], ["slime", "slime"], ["eye", "eye"], ["knight", "knight"], ["lich", "lich"]]},
  {"key": "event", "label": "Force a rare event", "type": "select", "group": "testing", "default": "", "options": [["", "Off (normal)"], ["mimic", "mimic"], ["shop", "shop"], ["dog", "dog"], ["rat", "rat"], ["golden", "golden"]], "help": "Test mode: makes one rare event happen often."},
  {"key": "speed", "label": "Time speed", "type": "range", "min": 0.25, "max": 10, "step": 0.25, "default": 1, "group": "testing", "help": "Runs time faster (for testing)."},
  {"key": "debug", "label": "Debug overlay", "type": "toggle", "default": false, "group": "testing"}
 ]
}
</script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0c0a12; }
  canvas { width: 100vw; height: 100vh; display: block; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* =====================================================================
   PIXEL DUNGEON — a hero crawls a procedurally generated dungeon on its own
   Options (add to the end of the address):
     #pixels=240        vertical resolution in big pixels
     #boss=king         force a boss: king slime eye knight lich
     #event=mimic       force a rare event: mimic shop dog rat golden
     #floor=2           start on a later floor (changes the theme)
     #speed=3           run time faster (for testing)
     #debug             show debug info
   ===================================================================== */
const params = new URLSearchParams(location.hash.slice(1));
const ROWS = parseInt(params.get('pixels')) || 240;
const FORCE = params.get('event');
const FORCE_BOSS = params.get('boss');
const START_FLOOR = parseInt(params.get('floor')) || 0;
const TIME_SCALE = parseFloat(params.get('speed')) || 1;
const DEBUG = params.has('debug');
const FPS = 30, T = 8, HUD = 16;

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;

// ---------------------------------------------------------------- utils
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const chance = p => Math.random() < p;
const coin = () => (Math.random() < 0.5 ? 1 : -1);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function weighted(obj) {
  const e = Object.entries(obj).filter(([, w]) => w > 0);
  let r = Math.random() * e.reduce((a, [, w]) => a + w, 0);
  for (const [k, w] of e) if ((r -= w) < 0) return k;
  return e[0][0];
}
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v + 0.5) / 16);
const bayer = (x, y) => BAYER[((y & 3) * 4) + (x & 3)];
const hash = (x, y, s = 0) => { let h = (x * 374761393 + y * 668265263 + s * 982451653) | 0; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function px(x, y, c) { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), 1, 1); }
function rect(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }
const hexRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
function mixHex(a, b, t) { const A = hexRgb(a), B = hexRgb(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * t))})`; }

// ---------------------------------------------------------------- tiny pixel font (3x5)
const FONT = {
  A: '.X.X.XXXXX.XX.X', B: 'XX.X.XXX.X.XXX.', C: '.XXX..X..X...XX', D: 'XX.X.XX.XX.XXX.', E: 'XXXX..XX.X..XXX',
  F: 'XXXX..XX.X..X..', G: '.XXX..X.XX.X.XX', H: 'X.XX.XXXXX.XX.X', I: 'XXX.X..X..X.XXX', J: '..X..X..XX.X.X.',
  K: 'X.XX.XXX.X.XX.X', L: 'X..X..X..X..XXX', M: 'X.XXXXXXXX.XX.X', N: 'XX.X.XX.XX.XX.X', O: '.X.X.XX.XX.X.X.',
  P: 'XX.X.XXX.X..X..', Q: '.X.X.XX.XXX..XX', R: 'XX.X.XXX.X.XX.X', S: '.XXX...X...XXX.', T: 'XXX.X..X..X..X.',
  U: 'X.XX.XX.XX.XXXX', V: 'X.XX.XX.XX.X.X.', W: 'X.XX.XXXXXXXX.X', X: 'X.XX.X.X.X.XX.X', Y: 'X.XX.X.X..X..X.',
  Z: 'XXX..X.X.X..XXX', 0: 'XXXX.XX.XX.XXXX', 1: '.X.XX..X..X.XXX', 2: 'XX...X.X.X..XXX', 3: 'XX...X.X...XXX.',
  4: 'X.XX.XXXX..X..X', 5: 'XXXX..XX...XXX.', 6: '.XXX..XXXX.XXXX', 7: 'XXX..X.X..X..X.', 8: 'XXXX.XXXXX.XXXX',
  9: 'XXXX.XXXX..XXX.', '!': '.X..X..X.....X.', '-': '......XXX......', x: '...X.X.X.X.X...', ':': '....X.....X....',
  '.': '.............X.', "'": '.X..X..........', '?': 'XX...X.X.....X.', ' ': '...............', '+': '....X.XXX.X....',
};
const textW = (s, sc = 1) => (s.length * 4 - 1) * sc;
function text(str, x, y, col = '#ffffff', sc = 1, shadow = '#0c0a12') {
  str = String(str).toUpperCase();
  const draw = (ox, oy, c) => {
    ctx.fillStyle = c;
    for (let i = 0; i < str.length; i++) {
      const g = FONT[str[i]] || FONT['?'];
      for (let k = 0; k < 15; k++) if (g[k] === 'X') ctx.fillRect(Math.round(x + ox + (i * 4 + (k % 3)) * sc), Math.round(y + oy + Math.floor(k / 3) * sc), sc, sc);
    }
  };
  if (shadow) draw(sc, sc, shadow);
  draw(0, 0, col);
}

// ---------------------------------------------------------------- themes
const THEMES = [
  { name: 'DUNGEON', bg: '#0c0a12', floor: ['#3b3548', '#37314a', '#403a50'], grout: '#2c2838', crack: '#29253a', moss: '#4a6048',
    top: '#1b1824', edge: '#5f5875', face: '#4d4660', brick: '#3a3449', pit: '#06050a', pitEdge: '#1c1826', torch: ['#ffe08a', '#ff9a3a', '#e0482a'] },
  { name: 'CRYPT', bg: '#0e0814', floor: ['#3a2c46', '#35283f', '#41324e'], grout: '#2a2034', crack: '#261c30', moss: '#5a4a6a',
    top: '#1a1122', edge: '#6a5680', face: '#52406a', brick: '#3e2f52', pit: '#050308', pitEdge: '#1e1428', torch: ['#e8d8ff', '#b88aff', '#6a3ad0'] },
  { name: 'MAGMA', bg: '#140806', floor: ['#4a3430', '#44302c', '#523a34'], grout: '#34221e', crack: '#2e1c18', moss: '#6a3a2a',
    top: '#1e0e0a', edge: '#7a524a', face: '#5e3e36', brick: '#462c26', pit: '#3a0a02', pitEdge: '#ff6a1a', torch: ['#fff0a0', '#ffb030', '#ff4a1a'], lava: true },
  { name: 'ICE CAVES', bg: '#081018', floor: ['#3a5068', '#364a62', '#40586e'], grout: '#2a3a4e', crack: '#26344a', moss: '#6a90a8',
    top: '#141e2a', edge: '#8ab4d0', face: '#5a7a96', brick: '#44607a', pit: '#04080e', pitEdge: '#1a2a3a', torch: ['#f0ffff', '#8ae4ff', '#3a8ad0'] },
];

// ---------------------------------------------------------------- map
const FLOOR = 0, WALL = 1, PIT = 2, DOOR = 3, SPIKE = 4;
const map = { cols: 3, rows: 2, IW: 13, IH: 11, GW: 47, GH: 28, OX: 0, OY: HUD, tiles: null, doorAt: null, rooms: [], doors: [], torches: [], floorNo: 0, theme: THEMES[0], canvas: null, decals: null };
const getT = (tx, ty) => (tx < 0 || ty < 0 || tx >= map.GW || ty >= map.GH ? WALL : map.tiles[ty * map.GW + tx]);
const setT = (tx, ty, t) => { if (tx >= 0 && ty >= 0 && tx < map.GW && ty < map.GH) map.tiles[ty * map.GW + tx] = t; };
const tcx = tx => map.OX + tx * T + T / 2, tcy = ty => map.OY + ty * T + T / 2;
const txOf = x => Math.floor((x - map.OX) / T), tyOf = y => Math.floor((y - map.OY) / T);
function doorOpenAt(tx, ty) { const d = map.doors[map.doorAt[ty * map.GW + tx] - 1]; return !d || d.open; }
function roomAtTile(tx, ty) {
  const s = map.IW + 2, v = map.IH + 2, c = Math.floor((tx - 2) / s), r = Math.floor((ty - 2) / v);
  if (c < 0 || r < 0 || c >= map.cols || r >= map.rows) return null;
  if ((tx - 2) % s >= map.IW || (ty - 2) % v >= map.IH) return null;
  return map.rooms[r * map.cols + c];
}
const roomAtPx = (x, y) => roomAtTile(txOf(x), tyOf(y));

function layout() {
  const tw = Math.floor(W / T), th = Math.floor((H - HUD) / T);
  map.cols = clamp(Math.round((tw - 2) / 16), 2, 5);
  map.rows = clamp(Math.round((th - 2) / 14), 2, 3);
  map.IW = clamp(Math.floor((tw - 2) / map.cols) - 2, 9, 19);
  map.IH = clamp(Math.floor((th - 2) / map.rows) - 2, 8, 15);
  map.GW = map.cols * (map.IW + 2) + 2;
  map.GH = map.rows * (map.IH + 2) + 2;
  map.OX = Math.floor((W - map.GW * T) / 2);
  map.OY = HUD + Math.floor((H - HUD - map.GH * T) / 2);
}

function genFloor(n) {
  map.floorNo = n;
  map.theme = THEMES[n % THEMES.length];
  const { cols, rows, IW, IH, GW, GH } = map;
  map.tiles = new Uint8Array(GW * GH).fill(WALL);
  map.doorAt = new Uint16Array(GW * GH);
  map.rooms = []; map.doors = [];
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const x0 = 2 + c * (IW + 2), y0 = 2 + r * (IH + 2);
    map.rooms.push({ i: r * cols + c, c, r, x0, y0, cx: map.OX + (x0 + IW / 2) * T, cy: map.OY + (y0 + IH / 2) * T,
      type: 'fight', visited: false, cleared: false, locked: false, fog: 1, doors: [], nbr: [] });
    for (let y = 0; y < IH; y++) for (let x = 0; x < IW; x++) setT(x0 + x, y0 + y, FLOOR);
  }
  // spanning tree (random DFS) + a loop or two
  const seen = new Set(), edges = [], stack = [randi(0, map.rooms.length - 1)];
  const neighbors = i => { const R = map.rooms[i], out = []; if (R.c > 0) out.push(i - 1); if (R.c < cols - 1) out.push(i + 1); if (R.r > 0) out.push(i - cols); if (R.r < rows - 1) out.push(i + cols); return out; };
  seen.add(stack[0]);
  while (stack.length) {
    const cur = stack[stack.length - 1], opts = shuffle(neighbors(cur).filter(j => !seen.has(j)));
    if (!opts.length) { stack.pop(); continue; }
    seen.add(opts[0]); edges.push([cur, opts[0]]); stack.push(opts[0]);
  }
  const key = (a, b) => Math.min(a, b) + '_' + Math.max(a, b), has = new Set(edges.map(([a, b]) => key(a, b)));
  for (let k = 0; k < randi(1, 2); k++) {
    const a = randi(0, map.rooms.length - 1), b = pick(neighbors(a));
    if (!has.has(key(a, b))) { has.add(key(a, b)); edges.push([a, b]); }
  }
  for (let [a, b] of edges) {
    if (a > b) [a, b] = [b, a];
    const A = map.rooms[a], B = map.rooms[b], d = { a, b, i: map.doors.length, open: true, anim: 0, tiles: [], entry: {} };
    if (B.r === A.r) {   // side by side
      const m = A.y0 + Math.floor(IH / 2);
      for (const x of [A.x0 + IW, A.x0 + IW + 1]) for (const y of [m - 1, m]) d.tiles.push([x, y]);
      d.entry[a] = { x: tcx(A.x0 + IW - 1), y: map.OY + m * T }; d.entry[b] = { x: tcx(B.x0), y: map.OY + m * T };
      d.out = { [a]: { x: 1, y: 0 }, [b]: { x: -1, y: 0 } };
    } else {             // stacked
      const m = A.x0 + Math.floor(IW / 2);
      for (const y of [A.y0 + IH, A.y0 + IH + 1]) for (const x of [m - 1, m]) d.tiles.push([x, y]);
      d.entry[a] = { x: map.OX + m * T, y: tcy(A.y0 + IH - 1) }; d.entry[b] = { x: map.OX + m * T, y: tcy(B.y0) };
      d.out = { [a]: { x: 0, y: 1 }, [b]: { x: 0, y: -1 } };
    }
    for (const [x, y] of d.tiles) { setT(x, y, DOOR); map.doorAt[y * GW + x] = d.i + 1; }
    d.cx = d.tiles.reduce((s, t) => s + tcx(t[0]), 0) / 4; d.cy = d.tiles.reduce((s, t) => s + tcy(t[1]), 0) / 4;
    map.doors.push(d); A.doors.push(d); B.doors.push(d); A.nbr.push(b); B.nbr.push(a);
  }
  // room roles
  const start = pick(map.rooms), distTo = roomDistances(start.i);
  start.type = 'start'; start.visited = true; start.cleared = true; start.fog = 0;
  const boss = map.rooms.filter(r => r !== start).sort((p, q) => distTo[q.i] - distTo[p.i])[0];
  boss.type = 'boss';
  const rest = shuffle(map.rooms.filter(r => r.type === 'fight'));
  if (rest.length > 1) { const tr = rest.sort((p, q) => p.nbr.length - q.nbr.length)[0]; tr.type = 'treasure'; }
  const rest2 = shuffle(map.rooms.filter(r => r.type === 'fight'));
  if (rest2.length > 1 && (FORCE === 'shop' || chance(0.3))) rest2[0].type = 'shop';
  for (const R of map.rooms) decorate(R);
  bakeFloor();
  map.decals = mk(W, H);
}
function roomDistances(from) {
  const d = map.rooms.map(() => 1e9), q = [from];
  d[from] = 0;
  while (q.length) { const i = q.shift(); for (const j of map.rooms[i].nbr) if (d[j] > d[i] + 1) { d[j] = d[i] + 1; q.push(j); } }
  return d;
}

function decorate(R) {
  const { IW, IH } = map, set = (ix, iy, t) => { if (ix >= 0 && iy >= 0 && ix < IW && iy < IH) setT(R.x0 + ix, R.y0 + iy, t); };
  const tmpl = R.type === 'start' || R.type === 'shop' || R.type === 'treasure' ? pick(['none', 'pillars'])
    : R.type === 'boss' ? pick(['none', 'corners', 'pillars'])
    : weighted({ none: 1, center: 2, corners: 2, strips: 1.5, pillars: 2, checker: 1, moat: 1 });
  const mx = Math.floor(IW / 2), my = Math.floor(IH / 2);
  if (tmpl === 'center') { const w = randi(2, 3), h = randi(1, 2); for (let y = -h; y < h; y++) for (let x = -w; x < w; x++) set(mx + x, my + y, PIT); }
  if (tmpl === 'corners') for (const [x, y] of [[2, 2], [IW - 4, 2], [2, IH - 4], [IW - 4, IH - 4]]) { set(x, y, PIT); set(x + 1, y, PIT); set(x, y + 1, PIT); set(x + 1, y + 1, PIT); }
  if (tmpl === 'strips') for (const y of [my - 2, my + 2]) for (let x = 3; x < IW - 3; x++) if (Math.abs(x - mx) > 1) set(x, y, PIT);
  if (tmpl === 'pillars') for (let k = 0; k < randi(2, 4); k++) set(randi(2, IW - 3), randi(2, IH - 3), WALL);
  if (tmpl === 'checker') for (let y = 2; y < IH - 2; y += 3) for (let x = 2; x < IW - 2; x += 3) set(x, y, PIT);
  if (tmpl === 'moat') for (let y = my - 2; y <= my + 2; y++) for (let x = mx - 3; x <= mx + 3; x++)
    if ((y === my - 2 || y === my + 2 || x === mx - 3 || x === mx + 3) && x !== mx && y !== my) set(x, y, PIT);
  if (R.type === 'fight' && chance(0.45)) {
    const x = randi(2, IW - 5), y = randi(2, IH - 3), horiz = chance(0.5);
    for (let k = 0; k < 3; k++) if (getT(R.x0 + x + (horiz ? k : 0), R.y0 + y + (horiz ? 0 : k)) === FLOOR) set(x + (horiz ? k : 0), y + (horiz ? 0 : k), SPIKE);
  }
  // keep doorways clear
  for (const d of R.doors) {
    const e = d.entry[R.i], ex = txOf(e.x), ey = tyOf(e.y);
    for (let y = -2; y <= 2; y++) for (let x = -2; x <= 2; x++) {
      const t = getT(ex + x, ey + y);
      if ((t === PIT || t === SPIKE || t === WALL) && roomAtTile(ex + x, ey + y) === R) setT(ex + x, ey + y, FLOOR);
    }
  }
  // connectivity check: every doorway must be reachable from the first
  if (!R.doors.length) return;
  const e0 = R.doors[0].entry[R.i], seen = new Set([txOf(e0.x) + ',' + tyOf(e0.y)]), q = [[txOf(e0.x), tyOf(e0.y)]];
  while (q.length) {
    const [x, y] = q.pop();
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = x + dx, ny = y + dy, k = nx + ',' + ny, t = getT(nx, ny);
      if (seen.has(k) || roomAtTile(nx, ny) !== R || (t !== FLOOR && t !== SPIKE)) continue;
      seen.add(k); q.push([nx, ny]);
    }
  }
  const ok = R.doors.every(d => seen.has(txOf(d.entry[R.i].x) + ',' + tyOf(d.entry[R.i].y))) && seen.size > IW * IH * 0.45;
  if (!ok) for (let y = 0; y < IH; y++) for (let x = 0; x < IW; x++) { const t = getT(R.x0 + x, R.y0 + y); if (t === PIT || t === WALL) set(x, y, FLOOR); }
}

function bakeFloor() {
  const th = map.theme, c = mk(W, H), g = c.getContext('2d');
  const P = (x, y, w, h, col) => { g.fillStyle = col; g.fillRect(x, y, w, h); };
  P(0, 0, W, H, th.bg);
  map.torches = [];
  for (let ty = 0; ty < map.GH; ty++) for (let tx = 0; tx < map.GW; tx++) {
    const X = map.OX + tx * T, Y = map.OY + ty * T, t = getT(tx, ty), hs = hash(tx, ty, map.floorNo);
    if (t === FLOOR || t === SPIKE || t === DOOR) {
      P(X, Y, T, T, th.floor[Math.floor(hs * 3)]);
      P(X, Y + T - 1, T, 1, th.grout); P(X + T - 1, Y, 1, T, th.grout);
      if (hs < 0.12) { P(X + 2, Y + 3, 1, 1, th.crack); P(X + 3, Y + 4, 1, 1, th.crack); P(X + 4, Y + 4, 1, 1, th.crack); }
      if (hs > 0.93) { P(X + 1, Y + 1, 2, 1, th.moss); P(X + 2, Y + 2, 1, 1, th.moss); }
      if (getT(tx, ty - 1) === WALL) { g.globalAlpha = 0.35; P(X, Y, T, 2, '#000000'); g.globalAlpha = 1; }
    } else if (t === WALL) {
      const below = getT(tx, ty + 1);
      if (below !== WALL && ty + 1 < map.GH) {
        P(X, Y, T, T, th.face);
        for (let r = 0; r < 2; r++) {
          const yy = Y + 1 + r * 4, off = ((tx + r) % 2) * 4;
          P(X, yy + 3, T, 1, th.brick); P(X + off, yy, 1, 3, th.brick);
        }
        P(X, Y, T, 1, th.edge);
        if (hs < 0.22 && tx % 3 === 1 && below === FLOOR) map.torches.push({ x: X + 4, y: Y + 3, room: roomAtTile(tx, ty + 1) });
      } else {
        P(X, Y, T, T, th.top);
        if (getT(tx - 1, ty) !== WALL) P(X, Y, 1, T, th.edge);
        if (getT(tx + 1, ty) !== WALL) P(X + T - 1, Y, 1, T, th.edge);
        if (getT(tx, ty - 1) !== WALL && ty > 0) P(X, Y, T, 1, th.edge);
      }
    } else if (t === PIT) {
      P(X, Y, T, T, th.pit);
      if (getT(tx, ty - 1) !== PIT) for (let y = 0; y < 3; y++) for (let x = 0; x < T; x++) if (bayer(x, y) < 1 - y / 3) P(X + x, Y + y, 1, 1, th.pitEdge);
    }
  }
  for (const tq of map.torches) { P(tq.x - 1, tq.y + 1, 3, 1, '#2a2020'); P(tq.x, tq.y, 1, 2, '#6a4a2a'); }
  map.canvas = c;
}

// ---------------------------------------------------------------- pathfinding & collision
const walkHero = (tx, ty) => { const t = getT(tx, ty); return t === FLOOR || t === SPIKE || (t === DOOR && doorOpenAt(tx, ty)); };
function bfsPath(sx, sy, gx, gy, walk = walkHero) {
  const GW = map.GW, N = GW * map.GH, prev = new Int32Array(N).fill(-1), q = new Int32Array(N);
  const s = sy * GW + sx, goal = gy * GW + gx;
  if (s < 0 || s >= N || goal < 0 || goal >= N) return null;
  let head = 0, tail = 0; q[tail++] = s; prev[s] = s;
  while (head < tail) {
    const i = q[head++];
    if (i === goal) break;

// ---------------------------------------------------------------- shots
class Shot {
  constructor(o) {
    Object.assign(this, { x: 0, y: 0, vx: 0, vy: 0, team: 'enemy', dmg: 1, r: 2, life: 4, kind: 'orb', col: '#ff4a8a', pierce: false, dead: false, t: 0 }, o);
    this.hits = new Set();
    world.shots.push(this);
  }
  update(dt) {
    this.t += dt; this.life -= dt;
    if (this.kind === 'rocket') {
      const sp = Math.hypot(this.vx, this.vy), k = 1 + dt * 2.5;
      this.vx *= k; this.vy *= k;
      if (sp > 220) { this.vx *= 220 / sp; this.vy *= 220 / sp; }
      if (chance(0.8)) addPart(this.x, this.y, rand(-8, 8), rand(-8, 8), rand(0.3, 0.7), ['#ffe080', '#ff8a3a', '#8a8494', '#4a4456'], { drag: 0.2 });
    }
    if (this.kind === 'bubble') { this.vx += Math.sin(this.t * 9) * 40 * dt; this.vy += Math.cos(this.t * 9) * 40 * dt; }
    if (this.homing && hero && !hero.dead) {
      const a = Math.atan2(hero.y - this.y, hero.x - this.x), sp = Math.hypot(this.vx, this.vy), cur = Math.atan2(this.vy, this.vx);
      let dA = ((a - cur + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
      const na = cur + clamp(dA, -dt * this.homing, dt * this.homing);
      this.vx = Math.cos(na) * sp; this.vy = Math.sin(na) * sp;
    }
    const nx = this.x + this.vx * dt, ny = this.y + this.vy * dt;
    if (solidPx(nx, ny, {})) {
      if (this.kind === 'bubble' && this.life > 0.3) {
        if (solidPx(nx, this.y, {})) this.vx *= -1; else this.vy *= -1;
      } else { this.impact(); return; }
    } else { this.x = nx; this.y = ny; }
    if (this.life <= 0) { this.impact(true); return; }
    if (this.team === 'enemy') {
      if (hero && !hero.dead && !hero.rolling && !hero.falling && Math.hypot(hero.x - this.x, hero.y - 5 - this.y) < this.r + 3) {
        if (hero.hurt(1, this.x - this.vx * 0.05, this.y - this.vy * 0.05)) { this.impact(); return; }
      }
      if (dog && !dog.dead && Math.hypot(dog.x - this.x, dog.y - 4 - this.y) < this.r + 3) { this.impact(); return; }
    } else {
      for (const e of world.ents) {
        if (e.dead || this.hits.has(e) || !(e.team === 'enemy' || e.team === 'prop') || e.invuln || e.intangible) continue;
        const hr = (e.hitR || e.r + 2);
        if (Math.hypot(e.x - this.x, e.y - (e.hitY ?? 5) - this.y) < hr + this.r) {
          this.hits.add(e);
          e.hurt(this.dmg, this.x - this.vx * 0.05, this.y - this.vy * 0.05, this.kind === 'pellet' ? 45 : 70);
          if (!this.pierce) { this.impact(); return; }
          addPart(this.x, this.y, rand(-20, 20), rand(-20, 20), 0.3, '#ffffff');
        }
      }
    }
  }
  impact(fizzle) {
    this.dead = true;
    if (this.kind === 'rocket') { explode(this.x, this.y, 20, this.dmg, 'hero'); return; }
    const n = fizzle ? 2 : 5;
    for (let i = 0; i < n; i++) addPart(this.x, this.y, rand(-35, 35), rand(-35, 35), rand(0.15, 0.35), this.kind === 'bubble' ? '#d4f6ff' : [this.col, '#ffffff'], { drag: 0.1 });
  }
  draw() {
    const X = Math.round(this.x), Y = Math.round(this.y);
    switch (this.kind) {
      case 'orb':
        rect(X - 2, Y - 1, 5, 3, INK); rect(X - 1, Y - 2, 3, 5, INK);
        rect(X - 1, Y - 1, 3, 3, this.col); px(X - 1, Y - 1, '#ffffff');
        break;
      case 'bigorb':
        ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(X, Y, 4, 0, 6.283); ctx.fill();
        ctx.fillStyle = this.col; ctx.beginPath(); ctx.arc(X, Y, 3, 0, 6.283); ctx.fill();
        rect(X - 2, Y - 2, 2, 2, '#ffffff');
        break;
      case 'bubble': {
        const r = 2 + (Math.floor(this.t * 8) % 2);
        rect(X - 1, Y - r, 3, 1, this.col); rect(X - 1, Y + r, 3, 1, this.col); rect(X - r, Y - 1, 1, 3, this.col); rect(X + r, Y - 1, 1, 3, this.col);
        px(X - 1, Y - 1, '#ffffff');
        break;
      }
      case 'bolt': case 'bullet': case 'pellet': {
        const sp = Math.hypot(this.vx, this.vy) || 1, ux = this.vx / sp, uy = this.vy / sp, L = this.kind === 'bolt' ? 5 : this.kind === 'pellet' ? 1 : 3;
        for (let i = 0; i < L; i++) px(X - ux * i, Y - uy * i, i === 0 ? '#ffffff' : this.rainbow ? RAINBOW[(i + Math.floor(this.t * 20)) % 6] : this.col);
        break;
      }
      case 'rocket':
        rect(X - 1, Y - 1, 3, 3, '#5a7a4a'); px(X, Y, '#ffffff');
        px(X - Math.sign(this.vx) * 2, Y - Math.sign(this.vy) * 2, Math.floor(this.t * 20) % 2 ? '#ffe080' : '#ff6a3a');
        break;
    }
  }
}

// ---------------------------------------------------------------- effects
const FIRE = ['#ffffff', '#fff3b0', '#ffc94a', '#ff8a2a', '#e0482a', '#8a2438', '#3a1830'];
function boom(x, y, size) {
  addFx({
    dur: 0.35 + size * 0.03, draw(f) {
      const k = f.t / f.dur, r = size * (k < 0.25 ? 0.5 + k * 2 : 1 - (k - 0.25) * 0.5), R = Math.ceil(r), X = Math.round(x), Y = Math.round(y);
      for (let j = -R; j <= R; j++) for (let i = -R; i <= R; i++) {
        const d = Math.hypot(i, j) / r;
        if (d > 1) continue;
        const heat = (1 - d) * (1 - k * 1.1) + hash(X + i, Y + j, Math.floor(f.t * 12)) * 0.35;
        if (heat < 0.08 + bayer(X + i, Y + j) * 0.25) continue;
        ctx.fillStyle = FIRE[clamp(Math.floor((1 - heat) * FIRE.length), 0, FIRE.length - 1)];
        ctx.fillRect(X + i, Y + j, 1, 1);
      }
    },
  });
}
function explode(x, y, R, dmg, team) {
  boom(x, y, R * 0.6); shake(4); world.flash = Math.max(world.flash, 0.25); world.flashCol = '#ffe0a0';
  for (let i = 0; i < 24; i++) { const a = rand(0, 6.28), sp = rand(30, 90); addPart(x, y, Math.cos(a) * sp, Math.sin(a) * sp, rand(0.3, 0.8), FIRE.slice(1), { drag: 0.05 }); }
  for (let i = 0; i < 10; i++) addPart(x + rand(-6, 6), y + rand(-6, 6), rand(-10, 10), rand(-20, -5), rand(0.8, 1.5), ['#6a6474', '#4a4456', '#2a2630'], { drag: 0.3 });
  decal(g => { for (let i = 0; i < 40; i++) { const a = rand(0, 6.28), r = Math.sqrt(Math.random()) * R * 0.7; g.fillStyle = chance(0.5) ? 'rgba(10,6,8,0.5)' : 'rgba(30,20,20,0.35)'; g.fillRect(Math.round(x + Math.cos(a) * r), Math.round(y + Math.sin(a) * r * 0.8), 2, 1); } });
  for (const e of [...world.ents]) {
    if (e.dead || Math.hypot(e.x - x, e.y - y) > R) continue;
    if (e === hero) { if (team !== 'hero' && !hero.rolling) hero.hurt(1, x, y); }
    else if (e.team === 'enemy' || e.team === 'prop') e.hurt(dmg, x, y, 120);
  }
}
function splat(x, y, cols, n = 8) {
  for (let i = 0; i < n; i++) { const a = rand(0, 6.28), sp = rand(15, 50); addPart(x, y - 4, Math.cos(a) * sp, Math.sin(a) * sp * 0.6, rand(0.25, 0.5), cols, { drag: 0.05 }); }
  decal(g => {

    for (let i = 0; i < n + 4; i++) { const a = rand(0, 6.28), r = rand(0, 7); g.fillStyle = pick(cols); g.fillRect(Math.round(x + Math.cos(a) * r), Math.round(y + Math.sin(a) * r * 0.6), chance(0.3) ? 2 : 1, 1); }

}

class Pickup extends Actor {
  constructor(kind, x, y, o = {}) {
    super({ x, y, team: 'pickup', kind, r: 3, z: 2, vz: o.pop ?? 60, shadowW: 5, noGrab: o.noGrab ?? 0.5, ...o });
    this.vx = o.vx ?? rand(-25, 25); this.vy = o.vy ?? rand(-15, 15);
  }
  update(dt) {
    this.physics(dt);
    this.noGrab -= dt;
    if (this.z > 0) moveEnt(this, this.vx * dt, this.vy * dt); else { this.vx *= 0.8; this.vy *= 0.8; }
    if (this.kind !== 'weapon' && getT(txOf(this.x), tyOf(this.y)) === PIT && this.z === 0) { this.dead = true; poof(this.x, this.y, '#1a1620', 4); return; }
    if (!hero || hero.dead || hero.falling || this.noGrab > 0 || this.z > 0) return;
    const d = dist(this, hero);
    if (this.kind === 'coin' && d < 18) { this.x += (hero.x - this.x) * dt * 6; this.y += (hero.y - this.y) * dt * 6; }
    if (d < 7) {
      if (this.kind === 'coin') { hero.coins++; this.dead = true; for (let i = 0; i < 4; i++) addPart(this.x, this.y - 3, rand(-20, 20), rand(-30, -5), 0.4, '#fff4a0'); }
      if (this.kind === 'heart' && hero.hp < hero.maxHp) { hero.hp = Math.min(hero.maxHp, hero.hp + 2); this.dead = true; hero.emote('heart'); for (let i = 0; i < 6; i++) addPart(this.x, this.y - 3, rand(-20, 20), rand(-30, -5), 0.5, '#ff6a7a'); }
      if (this.kind === 'weapon' && hero.wantsWeapon(this.wep, this)) { hero.equip(this.wep, this); this.dead = true; }
    }
  }
  draw() {
    const X = Math.round(this.x), Y = Math.round(this.y - this.z - 2 - (this.z === 0 ? Math.sin(this.age * 4) * 1 : 0));
    if (this.kind === 'coin') {
      const f = Math.floor(this.age * 8) % 4, w = [3, 2, 1, 2][f];
      rect(X - w / 2 - 0.5, Y - 2, w + 1, 5, INK); rect(X - w / 2, Y - 1, w, 3, '#ffd040'); if (w > 1) px(X - 1, Y - 1, '#fff4b0');
    } else if (this.kind === 'heart') drawHeart(X - 3, Y - 4, 2);

      if (Math.floor(this.age * 3) % 2) { ctx.globalAlpha = 0.35; rect(X - 6, Y - 3, 12, 5, w.col); ctx.globalAlpha = 1; }
      drawGun(X - 4, Y, 0, w);
    }
  }
}

// ---------------------------------------------------------------- main loop
function update(dt) {

  updateMap(dt);
  updateFlow(dt);
  for (const e of [...world.ents]) if (!e.dead) e.update(dt);

  for (const p of world.parts) {
    p.life -= dt;
    if (p.drag !== 1) { const k = Math.pow(p.drag, dt); p.vx *= k; p.vy *= k; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.grav) { p.vz -= p.grav * dt; p.z += p.vz * dt; if (p.z < 0) { p.z = 0; p.vz = -p.vz * p.bounce; p.vx *= 0.6; p.vy *= 0.6; } }
  }

  const done = world.fx.filter(f => f.t > f.dur && f.done);
  world.ents = world.ents.filter(e => !e.dead);
  world.shots = world.shots.filter(s => !s.dead);
  world.parts = world.parts.filter(p => p.life > 0);
  world.fx = world.fx.filter(f => f.t <= f.dur);

}
function drawFx(layer) { for (const f of world.fx) if (f.layer === layer && f.t >= 0 && f.draw) f.draw(f); }
function render(dt) {

  ctx.drawImage(map.canvas, 0, 0);
  ctx.drawImage(map.decals, 0, 0);
  drawDynamicTiles();
  drawFx('floor');
  const list = world.ents.slice().sort((a, b) => (a.layer || 0) - (b.layer || 0) || a.y - b.y);
  for (const e of list) if (e.drawShadow) e.drawShadow();

    const k = p.life / p.max, X = Math.round(p.x), Y = Math.round(p.y - p.z);
    if (p.fade && k < 0.4 && bayer(X, Y) > k * 2.5) continue;
    ctx.fillStyle = Array.isArray(p.col) ? p.col[Math.min(p.col.length - 1, Math.floor((1 - k) * p.col.length))] : p.col;

function resize() {
  H = ROWS;
  W = Math.round((ROWS * innerWidth) / innerHeight);
  canvas.width = W; canvas.height = H;
  ctx.imageSmoothingEnabled = false;
  FOG_PAT.length = 0;
  layout();
  startRun(START_FLOOR);
}
addEventListener('resize', resize);
resize();

let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  if (now - last < 1000 / FPS - 1) return;
  const dt = Math.min(0.1, (now - last) / 1000) * TIME_SCALE;
  last = now;
  try { update(dt); render(dt); } catch (e) { console.error(e); }
}
requestAnimationFrame(frame);
</script>
</body>
</html>
