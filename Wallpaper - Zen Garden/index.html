  {"key": "event", "label": "Repeat one event", "type": "select", "group": "testing", "default": "", "options": [["", "Off (normal)"], ["feed", "feed"], ["rake", "rake"], ["deer", "deer"], ["heron", "heron"], ["cat", "cat"], ["rain", "rain"], ["tea", "tea"], ["wind", "wind"], ["tanuki", "tanuki"], ["visitor", "visitor"], ["cranes", "cranes"], ["kitsune", "kitsune"], ["dragon", "dragon"], ["golden", "golden"], ["lanterns", "lanterns"], ["tsukimi", "tsukimi"], ["all", "all"]], "help": "Test mode: keeps repeating one event. 'all' cycles through every event."},

<script>
/* =====================================================================
   PIXEL ZEN GARDEN — a quiet Japanese garden that follows the real seasons
   Koi circle the pond under an arched red bridge, a little waterfall feeds it,
   the bamboo deer-scarer clacks now and then, a monk rakes the gravel into new
   patterns, and a calico cat naps on the tea-house veranda.
   Spring: weeping cherry in bloom.  Summer: fireflies and lotus.  Autumn: red maples
   and red dragonflies.  Winter: snow.  Day and night follow your clock.
   Options (add to the end of the address, combine with &):
     #pixels=200        vertical resolution in big pixels
     #season=autumn     spring summer autumn winter (default: the calendar)
     #koi=8             number of koi (0-16)
     #time=21:00        pretend local time
     #event=feed        test mode: repeat one event (or "all")
     #speed=3           run time faster (testing)
     #debug             event name, time, season
   Events: feed rake deer heron cat rain tea wind tanuki visitor cranes
   Rare:   kitsune (fox wedding in a sun shower)  dragon (a koi climbs the waterfall)
           golden (golden koi)  lanterns (floating lanterns)  tsukimi (moon viewing)
   ===================================================================== */
const params = new URLSearchParams(location.hash.slice(1));
const num = (k, d) => { const v = parseFloat(params.get(k)); return Number.isFinite(v) ? v : d; };
const ROWS = Math.round(Math.min(600, Math.max(80, num('pixels', 200))));
const FORCE = params.get('event');
const TIME_SCALE = num('speed', 1);
const DEBUG = params.has('debug');
const TIME_FORCE = params.get('time');
const SEASON_FORCE = params.get('season');
const KOI_N = Math.round(Math.min(16, Math.max(0, num('koi', 8))));
const FPS = 30;

const canvas = document.getElementById('c');
const mainCtx = canvas.getContext('2d');
let ctx = mainCtx;
let W, H;

// ---------------------------------------------------------------- utils
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const chance = p => Math.random() < p;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const TAU = Math.PI * 2;
function weighted(obj) {
  const e = Object.entries(obj).filter(([, w]) => w > 0);

  let r = Math.random() * e.reduce((a, [, w]) => a + w, 0);
  for (const [k, w] of e) if ((r -= w) < 0) return k;
  return e[0][0];
}
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v + 0.5) / 16);
const bayer = (x, y) => BAYER[((y & 3) * 4) + (x & 3)];
const hexRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const rgbStr = c => `rgb(${c.map(v => Math.round(clamp(v, 0, 255))).join(',')})`;
const mixRgb = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
const mixHex = (a, b, t) => rgbStr(mixRgb(hexRgb(a), hexRgb(b), t));
function px(x, y, c) { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), 1, 1); }
function rect(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }
function disc(cx, cy, r, c) { if (c) ctx.fillStyle = c; cx = Math.round(cx); cy = Math.round(cy); for (let dy = -Math.floor(r); dy <= r; dy++) { const w = Math.floor(Math.sqrt(Math.max(0, r * r - dy * dy))); ctx.fillRect(cx - w, cy + dy, w * 2 + 1, 1); } }
function ellipse(cx, cy, rx, ry, c) { ctx.fillStyle = c; for (let dy = -Math.ceil(ry); dy <= ry; dy++) { const k = 1 - (dy * dy) / (ry * ry); if (k < 0) continue; const w = Math.round(rx * Math.sqrt(k)); ctx.fillRect(Math.round(cx - w), Math.round(cy + dy), w * 2 + 1, 1); } }
function ring(cx, cy, rx, ry, c) { const n = Math.max(10, Math.round((rx + ry) * 2.2)); ctx.fillStyle = c; let lx = null, ly = null; for (let i = 0; i < n; i++) { const a = (i / n) * TAU, x = Math.round(cx + Math.cos(a) * rx), y = Math.round(cy + Math.sin(a) * ry); if (x !== lx || y !== ly) ctx.fillRect(x, y, 1, 1); lx = x; ly = y; } }

const hash2 = (x, y) => hash(x * 57.3 + y * 131.7);
function vnoise(x) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(hash(i), hash(i + 1), u); }

function mk(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, w); c.height = Math.max(1, h); return c; }
function withCtx(c, fn) { const old = ctx; ctx = c.getContext('2d'); ctx.imageSmoothingEnabled = false; try { fn(); } finally { ctx = old; } }
const FONT = {
  A: '.X.X.XXXXX.XX.X', B: 'XX.X.XXX.X.XXX.', C: '.XXX..X..X...XX', D: 'XX.X.XX.XX.XXX.', E: 'XXXX..XX.X..XXX', F: 'XXXX..XX.X..X..',
  G: '.XXX..X.XX.X.XX', H: 'X.XX.XXXXX.XX.X', I: 'XXX.X..X..X.XXX', J: '..X..X..XX.X.X.', K: 'X.XX.XXX.X.XX.X', L: 'X..X..X..X..XXX',
  M: 'X.XXXXXXXX.XX.X', N: 'XX.X.XX.XX.XX.X', O: '.X.X.XX.XX.X.X.', P: 'XX.X.XXX.X..X..', Q: '.X.X.XX.XXX..XX', R: 'XX.X.XXX.X.XX.X',
  S: '.XXX...X...XXX.', T: 'XXX.X..X..X..X.', U: 'X.XX.XX.XX.XXXX', V: 'X.XX.XX.XX.X.X.', W: 'X.XX.XXXXXXXX.X', X: 'X.XX.X.X.X.XX.X',
  Y: 'X.XX.X.X..X..X.', Z: 'XXX..X.X.X..XXX', ' ': '...............', '!': '.X..X..X.....X.', '-': '......XXX......', '.': '.............X.',
  0: 'XXXX.XX.XX.XXXX', 1: '.X.XX..X..X.XXX', 2: 'XX...X.X.X..XXX', 3: 'XX...X.X...XXX.', 4: 'X.XX.XXXX..X..X', 5: 'XXXX..XX...XXX.',
  6: '.XXX..XXXX.XXXX', 7: 'XXX..X.X..X..X.', 8: 'XXXX.XXXXX.XXXX', 9: 'XXXX.XXXX..XXX.', ':': '....X.....X....', '?': 'XX...X.X.....X.', '~': '...X.XX.X......',
};
const textW = s => String(s).length * 4 - 1;
function text(str, x, y, col = '#ffffff', shadow = null) {
  str = String(str).toUpperCase();
  const draw = (ox, oy, c) => { ctx.fillStyle = c; for (let i = 0; i < str.length; i++) { const g = FONT[str[i]] || FONT['?']; for (let k = 0; k < 15; k++) if (g[k] === 'X') ctx.fillRect(Math.round(x + ox + i * 4 + (k % 3)), Math.round(y + oy + Math.floor(k / 3)), 1, 1); } };

// ---------------------------------------------------------------- sprite builder
const INK = '#2a2230';
class SB {

  set(x, y, c) { x = Math.round(x); y = Math.round(y); if (x >= 0 && y >= 0 && x < this.w && y < this.h) this.g[y * this.w + x] = c; return this; }
  get(x, y) { return x >= 0 && y >= 0 && x < this.w && y < this.h ? this.g[y * this.w + x] : null; }
  ell(cx, cy, rx, ry, c, shade) {
    for (let y = Math.floor(cy - ry - 1); y <= Math.ceil(cy + ry + 1); y++)
      for (let x = Math.floor(cx - rx - 1); x <= Math.ceil(cx + rx + 1); x++) {
        const dx = (x - cx) / (rx + 0.35), dy = (y - cy) / (ry + 0.35);
        if (dx * dx + dy * dy > 1) continue;
        this.set(x, y, shade && dx * 0.35 + dy * 0.95 > 0.5 ? shade : c);
      }
    return this;
  }
  rect(x, y, w, h, c) { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) this.set(x + i, y + j, c); return this; }
  seg(x0, y0, x1, y1, r, c, shade) { const n = Math.ceil(Math.hypot(x1 - x0, y1 - y0) * 2) + 1; for (let i = 0; i <= n; i++) { const t = i / n; this.ell(lerp(x0, x1, t), lerp(y0, y1, t), r, r, c, shade); } return this; }
  line(x0, y0, x1, y1, c) { const n = Math.ceil(Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0))) || 1; for (let i = 0; i <= n; i++) this.set(lerp(x0, x1, i / n), lerp(y0, y1, i / n), c); return this; }
  recolor(from, to) { for (let i = 0; i < this.g.length; i++) if (this.g[i] === from) this.g[i] = to; return this; }
  outline(c = INK) {
    const add = [];
    for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) {
      if (this.get(x, y)) continue;
      if (this.get(x - 1, y) || this.get(x + 1, y) || this.get(x, y - 1) || this.get(x, y + 1)) add.push([x, y]);
    }
    for (const [x, y] of add) this.set(x, y, c);

  }
}
function bake(b, ax, ay) {
  const r = mk(b.w, b.h), l = mk(b.w, b.h), rc = r.getContext('2d'), lc = l.getContext('2d');
  for (let y = 0; y < b.h; y++) for (let x = 0; x < b.w; x++) {
    const c = b.g[y * b.w + x]; if (!c) continue;
    rc.fillStyle = c; rc.fillRect(x, y, 1, 1); lc.fillStyle = c; lc.fillRect(b.w - 1 - x, y, 1, 1);
  }
  return { r, l, w: b.w, h: b.h, ax, ay };
}
// anchor (feet) at (x, y); facing 1 = right
function drawSpr(s, x, y, facing = 1, alpha = 1) {
  const X = Math.round(x - (facing > 0 ? s.ax : s.w - 1 - s.ax)), Y = Math.round(y - s.ay);
  if (alpha < 1) ctx.globalAlpha = Math.max(0, alpha);
  ctx.drawImage(facing > 0 ? s.r : s.l, X, Y);
  if (alpha < 1) ctx.globalAlpha = 1;
}
const ICONS = {};
function icon(name, rows, col) {
  const b = new SB(rows[0].length + 2, rows.length + 2);
  rows.forEach((r, y) => [...r].forEach((ch, x) => { if (ch !== '.') b.set(x + 1, y + 1, ch === 'o' ? '#ffffff' : col); }));
  ICONS[name] = bake(b.outline('#ffffff'), Math.floor(b.w / 2), b.h - 1);

icon('heart', ['.X.X.', 'XoXXX', 'XXXXX', '.XXX.', '..X..'], '#ff5a8a');
icon('note', ['..XX', '..XX', '..X.', 'XXX.', 'XX..'], '#6a5aff');
icon('bang', ['X', 'X', 'X', '.', 'X'], '#ff4a3a');
icon('q', ['XXX', '..X', '.X.', '...', '.X.'], '#3a6aff');
icon('z', ['XXX', '..X', '.X.', 'XXX'], '#7a8aff');
icon('sparkle', ['.X.', 'XoX', '.X.'], '#ffc83a');
icon('dots', ['X.X.X'], '#6a6070');
icon('sweat', ['.X', 'XX', 'XX'], '#5ab0ff');
icon('anger', ['X.X', '...', 'X.X'], '#ff4a3a');

// ---------------------------------------------------------------- season + palette
const SEASON = ['spring', 'summer', 'autumn', 'winter'].includes(SEASON_FORCE) ? SEASON_FORCE : (() => { const m = new Date().getMonth(); return m >= 2 && m <= 4 ? 'spring' : m >= 5 && m <= 7 ? 'summer' : m >= 8 && m <= 10 ? 'autumn' : 'winter'; })();
const PAL = {
  spring: { moss: '#6c9c4e', moss2: '#5e8e44', mossD: '#4c7a3a', leaf: ['#ffc6d8', '#f7a8c4', '#ffe4ee', '#e98cb0'], back: ['#8cc868', '#a2d478', '#74b456'], bush: '#5f9a4a', bushHi: '#78b45a', flower: '#f25aa6', fall: ['#ffd4e2', '#f8b4ca', '#fff2f6'], water: '#3f7c78' },
  summer: { moss: '#548e42', moss2: '#48803a', mossD: '#386c30', leaf: ['#3e8a40', '#4a9a44', '#357a38', '#5aa84c'], back: ['#3f8a44', '#4f9a4c', '#347a3c'], bush: '#4a8a40', bushHi: '#62a452', flower: '#b87ae8', fall: null, water: '#3a7872' },
  autumn: { moss: '#7a8c4a', moss2: '#6c7e42', mossD: '#5a6c38', leaf: ['#e4502c', '#f27c2c', '#c83c2a', '#f4aa34'], back: ['#d8642e', '#e8a03a', '#b8442a', '#7a9a44'], bush: '#5a743c', bushHi: '#c8583a', flower: null, fall: ['#e4502c', '#f27c2c', '#f4aa34', '#c83c2a'], water: '#3e6e6a' },
  winter: { moss: '#8e9a80', moss2: '#808c74', mossD: '#6e7a64', leaf: null, back: ['#5a7a5a', '#4a6a4e'], bush: '#4e6e4c', bushHi: '#6a8a64', flower: null, fall: null, water: '#46707a' },
}[SEASON];
const SNOWY = SEASON === 'winter';

// ---------------------------------------------------------------- world
const world = { t: 0, night: 0, dusk: 0, day: 1, wind: 0.3, gust: 0, rain: 0, snow: SNOWY ? 0.25 : 0, sun: 0, cloud: 0, forceNight: 0, flash: 0,
  parts: [], fx: [], ents: [], debris: [], ripples: [], pellets: [], floaters: [], threats: [], popups: [], tossed: [], rainbow: 0, moonBig: 0, snowCover: SNOWY ? 0.4 : 0 };
let GY, PY, EY, SX, BX0, BX1, PX, PCY, RX, RY, TX0, GX0, GX1, GY0, GY1, LX, LY, SSX, SSY, TREEX, TSX;
let bgCanvas, pondWater, pondRim, gravelCanvas, gravelImg, treeCanvas, pineSpr, lanternSpr, bridgeBack, bridgeFront, snowLayers = [];
const rocks = [];
let pattern = null, patternNext = null;

// ---------------------------------------------------------------- time
function localHour() {
  if (TIME_FORCE) { const [h, m] = TIME_FORCE.split(':').map(Number); return ((((h || 0) + (m || 0) / 60 + world.t / 3600) % 24) + 24) % 24; }

function moonPhase() { const syn = 29.530588853, ref = Date.UTC(2000, 0, 6, 18, 14); return ((((Date.now() - ref) / 864e5) % syn) + syn) % syn / syn; }

  const day = smooth(5.2, 7.2, h) * (1 - smooth(17.8, 19.8, h));
  world.dusk = Math.max(Math.exp(-(((h - 6.4) / 0.8) ** 2)), Math.exp(-(((h - 18.8) / 0.8) ** 2))) * (1 - world.cloud * 0.7);
  world.day = day;
  world.night = clamp(1 - day + world.forceNight, 0, 1);
  const p = (h - 6) / 12; world.sunP = p;
  world.moonP = (((h - 6 - moonPhase() * 24) / 12) % 2 + 2) % 2;

function skyPos(p, amp) { return { x: W * (0.06 + 0.88 * p), y: GY - 14 - Math.sin(Math.PI * clamp(p, 0, 1)) * amp }; }

// ---------------------------------------------------------------- layout + baking
function layout() {
  GY = Math.round(H * 0.44);
  PY = GY + Math.round(H * 0.06);
  EY = PY - 4;
  SX = Math.round(W * 0.2);
  BX0 = SX - 17; BX1 = SX + 17;
  PX = Math.round(W * 0.3);
  RY = Math.round(H * 0.148);
  PCY = PY + 8 + RY;
  RX = Math.round(Math.min(W * 0.25, RY * 3.4));
  TX0 = Math.round(W * 0.66);
  GX0 = Math.round(Math.max(PX + RX + 22, W * 0.6)); GX1 = W; GY0 = PY + 10; GY1 = H;

const toScreen = (u, v) => [PX + u, PCY + v / 2];

function onPondScreen(x, y, m = 1) { return inPond(x - PX, (y - PCY) * 2, m); }

function bakeBackground() {
  bgCanvas = mk(W, H);
  withCtx(bgCanvas, () => {
    // far ranges
    const ranges = [['#a6b6d2', 0.3, 34, 3.1], ['#8ea2c4', 0.2, 22, 7.7]];
    for (const [c, sc, amp, seed] of ranges) for (let x = 0; x < W; x++) { const top = GY - 16 - amp * fbm(x / (W * sc) + seed); rect(x, top, 1, GY - top, c); }
    // the big mountain
    const FX = W * 0.63, top = Math.round(H * 0.1), hb = W * 0.36;
    for (let x = Math.floor(FX - hb); x < FX + hb; x++) {
      const d = Math.abs(x - FX) / hb; if (d > 1) continue;

      const capH = (SEASON === 'summer' ? 0.16 : SEASON === 'autumn' ? 0.24 : 0.42) * (GY - 16 - top);
      for (let yy = Math.round(y); yy < GY - 10; yy++) {

        else if ((x > FX) && hash2(x, yy) < 0.5) c = mixHex('#62759e', '#92a4c4', k);

    drawPagoda(Math.round(W * 0.47), GY - 14);

    // bamboo grove: back stalks darker, leaf sprays near the tops, a few leaning
    const bamb = [W * 0.09, W * 0.3];
    for (const layer of [0, 1]) for (let x = bamb[0] + layer * 1.7; x < bamb[1]; x += rand(3.5, 6.5)) {
      const h = rand(36, 62) - layer * 6, xx = Math.round(x), lean = rand(-0.08, 0.08);
      const c = layer ? pick(['#7aaa52', '#86b85a']) : pick(['#4e7e3a', '#557f3e']), cd = layer ? '#5a8a40' : '#3e6a30';
      for (let y = 0; y < h; y++) { const X = xx + lean * y; px(X, GY - 16 - y, c); if (layer) px(X + 1, GY - 16 - y, cd); }
      for (let y = randi(4, 8); y < h; y += randi(6, 9)) { px(xx + lean * y, GY - 16 - y, '#d8e0a0'); if (layer) px(xx + lean * y + 1, GY - 16 - y, '#c0c888'); }
      const leaf = SNOWY ? ['#6a8a60', '#5a7a56'] : layer ? ['#6aaa44', '#8ac85a', '#5a9a3a'] : ['#3e7a34', '#4a8a3a'];
      for (let k = 0; k < 7; k++) {

        for (let j = 0; j < 3; j++) { const a = s * rand(0.2, 0.9); for (let i = 1; i <= 4; i++) px(bx + s * i * Math.cos(a * 0.6), by + i * Math.sin(Math.abs(a)) * 0.7 + j * 0.8, pick(leaf)); }

  if (world.dango) push(EY - 1, () => { const d = world.dango; rect(d.x - 3, d.y, 7, 1, '#b08a5a'); rect(d.x - 1, d.y - 1, 3, 1, '#8a6a4a'); const pos = [[-2, -2], [0, -2], [2, -2], [-1, -4], [1, -4], [0, -6]]; for (let i = 0; i < d.n; i++) disc(d.x + pos[i][0], d.y + pos[i][1], 1, '#fbfbf2'); for (let k = 0; k < 4; k++) px(d.x + 6, d.y - 1 - k * 2, '#8a8a60'); px(d.x + 7, d.y - 8, '#e8dcc0'); px(d.x + 5, d.y - 7, '#e8dcc0'); });
  if (world.bowl) push(EY, () => { px(world.bowl.x, world.bowl.y, '#4a6a3a'); px(world.bowl.x + 1, world.bowl.y, '#4a6a3a'); px(world.bowl.x, world.bowl.y + 1, '#6a4a3a'); });
  list.sort((a, b) => a[0] - b[0]);
  for (const [, fn] of list) fn();
}
function render() {
  ctx = mainCtx;
  drawSky();
  drawDragon();
  ctx.drawImage(bgCanvas, 0, 0);
  // hanging paper lantern + wind chime under the eave
  const ey = world.eave, sway = Math.sin(world.t * 2.2) * world.wind * 1.5 + (world.gust ? Math.sin(world.t * 9) * 1.5 : 0);
  rect(TX0 + 1, ey + 2, 1, 3, '#5a4a3a'); disc(TX0 + 1, ey + 6, 1.4, '#a8d8f0'); px(TX0 + 1 + sway, ey + 9, '#f06a6a'); px(TX0 + 1 + sway * 1.3, ey + 10, '#f06a6a');
  rect(TX0 + 30, ey + 2, 1, 2, '#3a2a20'); rect(TX0 + 28, ey + 4, 5, 6, '#e8e0c8'); rect(TX0 + 28, ey + 4, 5, 1, '#2a2020'); rect(TX0 + 28, ey + 9, 5, 1, '#2a2020'); px(TX0 + 30, ey + 6, '#c83a2a'); px(TX0 + 30, ey + 7, '#c83a2a');
  if (world.scroll) { const s = world.scroll; ring(s.x + 1.5, s.y + 4, 1.4, 2.2, '#2a2230'); }
  ctx.drawImage(gravelCanvas, GX0, GY0);
  if (world.snowCover > 0.05) ctx.drawImage(snowLayers[clamp(Math.round(world.snowCover * 4) - 1, 0, 3)], 0, 0);
  for (const d of world.debris) if (!d.float) px(d.x, d.y, d.col);
  drawWater();
  drawProps();
  // tossed food
  for (const t of world.tossed) { const k = t.t / t.dur; px(lerp(t.x0, t.x1, k), lerp(t.y0, t.y1, k) - Math.sin(Math.PI * k) * t.h, t.col); }
  // particles
  for (const p of world.parts) {
    if (p.rain) { ctx.fillStyle = p.col; ctx.fillRect(Math.round(p.x), Math.round(p.y), 1, 3); continue; }
    if (p.puff) { const k = p.life / p.max; ctx.globalAlpha = clamp(k * 1.5, 0, 0.9); disc(p.x, p.y, typeof p.puff === 'number' ? p.puff * (1.5 - k) : 2 - k, p.col); ctx.globalAlpha = 1; continue; }
    if (p.drift) { p.x += Math.sin(world.t * 3 + p.y) * 0.05; }
    px(p.x, p.y, p.col);
  }
  // fireflies/dragonflies/butterflies
  for (const f of flies) {
    if (f.kind === 'dragonfly') { const c = SEASON === 'autumn' ? '#e04a2a' : '#3a8ad8'; px(f.x, f.y, c); px(f.x - 1, f.y, c); px(f.x - 2, f.y, c); const up = Math.floor(world.t * 20) % 2; px(f.x - 0.5, f.y - 1 - up, '#dfeefa'); px(f.x + 0.5, f.y - 1 - up, '#dfeefa'); }
    else if (f.kind === 'butterfly') { const up = Math.floor(world.t * 8 + f.ph) % 2; px(f.x, f.y, '#3a3a3a'); px(f.x - 1, f.y - up, '#fff8e0'); px(f.x + 1, f.y - up, '#fff8e0'); }
  }
  // night
  if (world.night > 0.02) {
    ctx.globalCompositeOperation = 'multiply';
    ctx.fillStyle = rgbStr(mixRgb([255, 255, 255], [58, 70, 130], world.night * 0.86));
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'source-over';
    const nk = world.night;
    // lit shoji
    ctx.globalAlpha = nk * 0.75;
    for (let x = TX0 + 5, i = 0; x < W + 6; x += 11, i++) { if (i === 1) continue; rect(x, EY - 23, 10, 19, '#ffd89a'); for (let yy = EY - 20; yy < EY - 4; yy += 4) rect(x, yy, 10, 1, '#b08a5a'); for (let xx = x + 3; xx < x + 10; xx += 3) rect(xx, EY - 23, 1, 19, '#b08a5a'); }
    ctx.globalAlpha = 1;
    // lantern fire
    rect(LX - 1, LY - 16, 3, 2, '#ffc860');
    glowAt(LX, LY - 15, 14, '#ffb050', 0.8);
    glowAt(TX0 + 30, world.eave + 7, 12, '#ff9a5a', 0.6); rect(TX0 + 28, world.eave + 5, 5, 4, '#ffc890');
    for (let x = TX0 + 10; x < W; x += 22) glowAt(x, EY - 12, 18, '#ffc070', 0.35);
    for (const f of flies) if (f.kind === 'firefly') { const b = Math.max(0, Math.sin(world.t * 2 + f.ph * 3)); if (b > 0.3) { px(f.x, f.y, '#e8ff90'); glowAt(f.x, f.y, 4, '#c8ff60', b * 0.6); } }
  }
  for (const f of world.floaters) { const [x, y] = f.stream ? [f.x, f.y] : toScreen(f.u, f.v); glowAt(x, y - 2, 9, '#ffb060', (f.alpha == null ? 1 : f.alpha) * (0.35 + world.night * 0.65)); if (world.night > 0.2) { ctx.globalAlpha = (f.alpha == null ? 1 : f.alpha) * world.night; rect(x - 1.5, y - 3, 4, 3, '#ffe0a0'); ctx.globalAlpha = 1; } }
  flushGlows(1);
  // everyone's lanterns (fox procession) are drawn with their owner; glows collected there too
  if (world.dusk > 0.05 && world.night < 0.95) { ctx.globalCompositeOperation = 'soft-light'; ctx.globalAlpha = world.dusk * 0.45; rect(0, 0, W, H, '#ff9a5a'); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; }
  if (world.sunshower) { ctx.globalCompositeOperation = 'soft-light'; ctx.globalAlpha = 0.25; rect(0, 0, W, H, '#ffe890'); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; }
  if (world.flash > 0) { ctx.globalAlpha = world.flash * 0.5; rect(0, 0, W, H, '#fffbe8'); ctx.globalAlpha = 1; }
  // emotes + popups stay readable at night
  for (const a of [monk, cat, ...world.ents]) if (!a.dead) a.drawEmotes();
  for (const p of world.popups) { const k = p.t / 1.6; if (k > 0.7 && Math.floor(world.t * 10) % 2) continue; text(p.str, p.x - textW(p.str) / 2, p.y - k * 6, p.col, '#00000066'); }
  if (DEBUG) { const h = localHour(); text(`${director.name || '-'} ${SEASON} ${String(Math.floor(h)).padStart(2, '0')}:${String(Math.floor((h % 1) * 60)).padStart(2, '0')} ${pattern}`, 3, 3, '#ffffff', '#000000'); }
}

// ---------------------------------------------------------------- setup + main loop
function resize() {
  H = ROWS; W = Math.max(120, Math.round((ROWS * innerWidth) / Math.max(1, innerHeight)));
  canvas.width = W; canvas.height = H;
  mainCtx.imageSmoothingEnabled = false;
  layout();
  bakeBackground();
  scene.stars = Array.from({ length: Math.round(W * GY / 60) }, () => ({ x: randi(0, W - 1), y: randi(0, GY - 20), ph: rand(0, TAU) }));
  scene.clouds = Array.from({ length: 5 }, () => ({ x: rand(-20, W + 20), y: rand(H * 0.04, GY * 0.5), puffs: Array.from({ length: randi(3, 5) }, (_, i) => [i * 6 + rand(-2, 2), rand(-1.5, 1.5), rand(2.5, 4.5)]) }));
  makeKoi(); makePads(); makeCritters();
  world.ents = []; world.parts = []; world.debris = []; world.ripples = []; world.pellets = []; world.floaters = []; world.tossed = [];
  evActors.length = 0;
  monk = new Person({ kind: 'monk', P: MONK, x: SEAT(), y: EY, f: -1, pose: 'meditate' });
  cat = new Beast({ kind: 'cat', x: CATSPOT(), y: EY, f: -1, pose: 'loaf', walkPoses: ['walk1', 'walk2'], walkRate: 6, spd: 14 });
  director.cur = null; director.cool = FORCE ? 3 : 8;
  cleanupEvent();
  for (let i = 0; i < 90; i++) update(1 / 30);   // settle: petals already on the ground, koi spread out
  if (PAL.fall) for (let i = 0; i < 25; i++) { const x = rand(0, W), y = rand(PY - 3, H); landDebris(x, y, pick(PAL.fall)); }
}
addEventListener('resize', resize);
resize();
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  if (now - last < 1000 / FPS - 1) return;
  const dt = Math.min(0.1, (now - last) / 1000) * TIME_SCALE;
  last = now;
  try { const steps = Math.ceil(dt / 0.05); for (let i = 0; i < steps; i++) update(dt / steps); render(); } catch (e) { console.error(e); }
}
requestAnimationFrame(frame);
</script>
</body>
