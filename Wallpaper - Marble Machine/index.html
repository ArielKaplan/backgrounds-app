<script>
/* =====================================================================
   PIXEL MARBLE MACHINE — a hamster-powered marble run in an inventor mouse's workshop
   A hamster in a wheel drives the bucket lift. Marbles ride up, roll down the top rail,
   swirl around the copper funnel, get split left or right by a flip-flop: left down the
   brass helix and across the chimes, right around the loop, into the water-wheel and the
   see-saw; then back along the bottom rail to the lift. The counter remembers every lap.
   The window and the wall clock follow your real time.
   Options (add to the end of the address, combine with &):
     #pixels=200        vertical resolution in big pixels
     #marbles=28        marbles in the machine
     #time=21:00        pretend local time
     #reset             reset the lap counter
     #event=jam         test mode: repeat one event (or "all")
     #speed=3           run time faster (testing)
     #debug             event name, marble count
   Events: golden jam flood race cat oil snack snail tea domino glow
   Rare:   ride (the mouse rides the machine)  duck  party  ghost  giant
   ===================================================================== */
const params = new URLSearchParams(location.hash.slice(1));
const num = (k, d) => { const v = parseFloat(params.get(k)); return Number.isFinite(v) ? v : d; };
const ROWS = Math.round(Math.min(600, Math.max(80, num('pixels', 200))));
const FORCE = params.get('event');
const TIME_SCALE = num('speed', 1);
const DEBUG = params.has('debug');
const TIME_FORCE = params.get('time');
const N_MARBLES = Math.round(Math.min(40, Math.max(6, num('marbles', 28))));
const FPS = 30;
const STORE_KEY = 'backgrounds.marbleMachine.laps';
if (params.has('reset')) { try { localStorage.removeItem(STORE_KEY); } catch (e) {} }

const canvas = document.getElementById('c');
const mainCtx = canvas.getContext('2d');
let ctx = mainCtx;
let W, H;

// ---------------------------------------------------------------- utils
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const chance = p => Math.random() < p;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;

const TAU = Math.PI * 2;
function weighted(obj) {
  const e = Object.entries(obj).filter(([, w]) => w > 0);
  if (!e.length) return null;
  let r = Math.random() * e.reduce((a, [, w]) => a + w, 0);
  for (const [k, w] of e) if ((r -= w) < 0) return k;
  return e[0][0];
}
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v + 0.5) / 16);
const bayer = (x, y) => BAYER[((y & 3) * 4) + (x & 3)];
const hexRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const rgbStr = c => `rgb(${c.map(v => Math.round(clamp(v, 0, 255))).join(',')})`;
const mixRgb = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
const mixHex = (a, b, t) => rgbStr(mixRgb(hexRgb(a), hexRgb(b), t));
function px(x, y, c) { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), 1, 1); }
function rect(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }
function disc(cx, cy, r, c) { if (c) ctx.fillStyle = c; cx = Math.round(cx); cy = Math.round(cy); for (let dy = -Math.floor(r); dy <= r; dy++) { const w = Math.floor(Math.sqrt(Math.max(0, r * r - dy * dy))); ctx.fillRect(cx - w, cy + dy, w * 2 + 1, 1); } }

const hash2 = (x, y) => hash(x * 57.3 + y * 131.7);

function mk(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; }
function withCtx(c, fn) { const old = ctx; ctx = c.getContext('2d'); ctx.imageSmoothingEnabled = false; try { fn(); } finally { ctx = old; } }
const FONT = {
  A: '.X.X.XXXXX.XX.X', B: 'XX.X.XXX.X.XXX.', C: '.XXX..X..X...XX', D: 'XX.X.XX.XX.XXX.', E: 'XXXX..XX.X..XXX', F: 'XXXX..XX.X..X..',
  G: '.XXX..X.XX.X.XX', H: 'X.XX.XXXXX.XX.X', I: 'XXX.X..X..X.XXX', J: '..X..X..XX.X.X.', K: 'X.XX.XXX.X.XX.X', L: 'X..X..X..X..XXX',
  M: 'X.XXXXXXXX.XX.X', N: 'XX.X.XX.XX.XX.X', O: '.X.X.XX.XX.X.X.', P: 'XX.X.XXX.X..X..', Q: '.X.X.XX.XXX..XX', R: 'XX.X.XXX.X.XX.X',
  S: '.XXX...X...XXX.', T: 'XXX.X..X..X..X.', U: 'X.XX.XX.XX.XXXX', V: 'X.XX.XX.XX.X.X.', W: 'X.XX.XXXXXXXX.X', X: 'X.XX.X.X.X.XX.X',
  Y: 'X.XX.X.X..X..X.', Z: 'XXX..X.X.X..XXX', ' ': '...............', '!': '.X..X..X.....X.', '-': '......XXX......', '.': '.............X.',
  0: 'XXXX.XX.XX.XXXX', 1: '.X.XX..X..X.XXX', 2: 'XX...X.X.X..XXX', 3: 'XX...X.X...XXX.', 4: 'X.XX.XXXX..X..X', 5: 'XXXX..XX...XXX.',
  6: '.XXX..XXXX.XXXX', 7: 'XXX..X.X..X..X.', 8: 'XXXX.XXXXX.XXXX', 9: 'XXXX.XXXX..XXX.', ':': '....X.....X....', '?': 'XX...X.X.....X.', '#': 'X.XXXXX.XXXXX.X',
};
const textW = s => String(s).length * 4 - 1;
function text(str, x, y, col = '#ffffff', shadow = null) {
  str = String(str).toUpperCase();
  const draw = (ox, oy, c) => { ctx.fillStyle = c; for (let i = 0; i < str.length; i++) { const g = FONT[str[i]] || FONT['?']; for (let k = 0; k < 15; k++) if (g[k] === 'X') ctx.fillRect(Math.round(x + ox + i * 4 + (k % 3)), Math.round(y + oy + Math.floor(k / 3)), 1, 1); } };

// ---------------------------------------------------------------- sprite builder
const INK = '#261c1a';

  get(x, y) { return x >= 0 && y >= 0 && x < this.w && y < this.h ? this.g[y * this.w + x] : null; }
  ell(cx, cy, rx, ry, c, shade) {
    for (let y = Math.floor(cy - ry - 1); y <= Math.ceil(cy + ry + 1); y++)
      for (let x = Math.floor(cx - rx - 1); x <= Math.ceil(cx + rx + 1); x++) {
        const dx = (x - cx) / (rx + 0.35), dy = (y - cy) / (ry + 0.35);
        if (dx * dx + dy * dy > 1) continue;
        this.set(x, y, shade && dx * 0.35 + dy * 0.95 > 0.5 ? shade : c);
      }
    return this;
  }
  rect(x, y, w, h, c) { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) this.set(x + i, y + j, c); return this; }
  seg(x0, y0, x1, y1, r, c, shade) { const n = Math.ceil(Math.hypot(x1 - x0, y1 - y0) * 2) + 1; for (let i = 0; i <= n; i++) { const t = i / n; this.ell(lerp(x0, x1, t), lerp(y0, y1, t), r, r, c, shade); } return this; }
  line(x0, y0, x1, y1, c) { const n = Math.ceil(Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0))) || 1; for (let i = 0; i <= n; i++) this.set(lerp(x0, x1, i / n), lerp(y0, y1, i / n), c); return this; }
  outline(c = INK) {
    const add = [];
    for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) {
      if (this.get(x, y)) continue;
      if (this.get(x - 1, y) || this.get(x + 1, y) || this.get(x, y - 1) || this.get(x, y + 1)) add.push([x, y]);
    }

  }
}
function bake(b, ax, ay) {
  const r = mk(b.w, b.h), l = mk(b.w, b.h), rc = r.getContext('2d'), lc = l.getContext('2d');
  for (let y = 0; y < b.h; y++) for (let x = 0; x < b.w; x++) {
    const c = b.g[y * b.w + x]; if (!c) continue;
    rc.fillStyle = c; rc.fillRect(x, y, 1, 1); lc.fillStyle = c; lc.fillRect(b.w - 1 - x, y, 1, 1);
  }
  return { r, l, w: b.w, h: b.h, ax, ay };
}
function drawSpr(s, x, y, facing = 1, alpha = 1) {
  const X = Math.round(x - (facing > 0 ? s.ax : s.w - 1 - s.ax)), Y = Math.round(y - s.ay);
  if (alpha < 1) ctx.globalAlpha = Math.max(0, alpha);

  if (alpha < 1) ctx.globalAlpha = 1;
}
const ICONS = {};
function icon(name, rows, col) {
  const b = new SB(rows[0].length + 2, rows.length + 2);
  rows.forEach((r, y) => [...r].forEach((ch, x) => { if (ch !== '.') b.set(x + 1, y + 1, ch === 'o' ? '#ffffff' : col); }));
  ICONS[name] = bake(b.outline('#ffffff'), Math.floor(b.w / 2), b.h - 1);
}
icon('heart', ['.X.X.', 'XoXXX', 'XXXXX', '.XXX.', '..X..'], '#ff5a8a');
icon('note', ['..XX', '..XX', '..X.', 'XXX.', 'XX..'], '#6a5aff');
icon('bang', ['X', 'X', 'X', '.', 'X'], '#ff4a3a');
icon('q', ['XXX', '..X', '.X.', '...', '.X.'], '#3a6aff');
icon('z', ['XXX', '..X', '.X.', 'XXX'], '#7a8aff');
icon('sparkle', ['.X.', 'XoX', '.X.'], '#ffc83a');
icon('dots', ['X.X.X'], '#6a6070');
icon('sweat', ['.X', 'XX', 'XX'], '#5ab0ff');
icon('anger', ['X.X', '...', 'X.X'], '#ff4a3a');
icon('swirl', ['XXX', 'X.X', 'X.X', '..X'], '#b85aff');
icon('bulb', ['.X.', 'XoX', 'XXX', '.X.'], '#ffe040');

// ---------------------------------------------------------------- layout (machine drawn in a 320x200 reference space)
let SC, AX, OX;
const X = x => OX + x * SC * AX, Y = y => y * SC;
const P = (x, y) => [X(x), Y(y)];
let BENCH, G;
function layout() {
  SC = H / 200;
  AX = clamp((W / H) / 1.6, 0.86, 1.3);
  OX = (W - 320 * SC * AX) / 2;
  BENCH = Math.round(Y(190));
  G = 150 * SC;
}

// ---------------------------------------------------------------- world
const world = { t: 0, night: 0, dusk: 0, parts: [], popups: [], ents: [], laps: 0, shake: 0, glowMode: 0, party: 0, lampOff: 0, bellT: 0, confetti: [], flashBar: [0, 0, 0, 0, 0], dominoes: null, jarFill: 0, duckOnBench: false };
try { world.laps = parseInt(localStorage.getItem(STORE_KEY), 10) || 0; } catch (e) {}
function saveLaps() { try { localStorage.setItem(STORE_KEY, String(world.laps)); } catch (e) {} }
function localHour() {
  if (TIME_FORCE) { const [h, m] = TIME_FORCE.split(':').map(Number); return ((((h || 0) + (m || 0) / 60 + world.t / 3600) % 24) + 24) % 24; }
  const d = new Date(); return d.getHours() + d.getMinutes() / 60 + d.getSeconds() / 3600;
}

// ---------------------------------------------------------------- track pieces
class Rail {
  constructor(name, pts, o = {}) {
    this.name = name; this.type = 'rail'; this.ref = pts; this.o = o;
    this.fric = o.fric ?? 1.1; this.vmin = o.vmin ?? 12; this.vmax = o.vmax ?? 70; this.gap = o.gap ?? 5.2;
  }
  build() {
    this.pts = this.ref.map(([x, y]) => P(x, y));
    this.cum = [0];
    for (let i = 1; i < this.pts.length; i++) this.cum.push(this.cum[i - 1] + Math.hypot(this.pts[i][0] - this.pts[i - 1][0], this.pts[i][1] - this.pts[i - 1][1]));
    this.len = this.cum[this.cum.length - 1];
  }
  at(s) {
    s = clamp(s, 0, this.len);
    let i = 1; while (i < this.cum.length - 1 && this.cum[i] < s) i++;
    const a = this.pts[i - 1], b = this.pts[i], seg = this.cum[i] - this.cum[i - 1] || 1, k = (s - this.cum[i - 1]) / seg;
    return { x: lerp(a[0], b[0], k), y: lerp(a[1], b[1], k), dx: (b[0] - a[0]) / seg, dy: (b[1] - a[1]) / seg };
  }
}
function loopPts(cx, cy, r, n = 28) { const out = []; for (let i = 0; i <= n; i++) { const a = Math.PI / 2 - (i / n) * TAU; out.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); } return out; }
const RAILS = {
  top: new Rail('top', [[33, 11], [60, 15], [112, 24]], { vmax: 45 }),
  left: new Rail('left', [[136, 61], [106, 71], [104, 72]], { vmax: 40 }),
  right: new Rail('right', [[144, 61], [172, 69], [196, 83], [205, 88]], { vmin: 30, vmax: 60, fric: 0.4 }),
  loop: new Rail('loop', loopPts(205, 78, 10), { vmin: 34, vmax: 60, fric: 0.2, gap: 4 }),
  right2: new Rail('right2', [[206, 88.5], [220, 93], [247, 100]], { vmax: 45 }),
  exitH: new Rail('exitH', [[104, 126], [117, 129]], { vmax: 30 }),
  bottom: new Rail('bottom', [[303, 172], [120, 179], [33, 183]], { vmin: 22, vmax: 40, fric: 1.2 }),
};
const FUN = { cx: 140, rim: 30, rx: 22, ry: 6, depth: 18 };
const HEL = { cx: 92, top: 74, bot: 124, r: 12, turns: 3 };
const CHIMES = [[125, 135], [113, 143], [125, 151], [113, 159], [125, 167]];
const CHIME_COLS = ['#ff5a5a', '#ffa040', '#ffe060', '#6ad06a', '#5aa0ff'];
const WHEEL = { cx: 262, cy: 113, r: 14, n: 8, a: 0, entry: -2.18, release: 0.96 };
const SAW = { px: 262, py: 153, half: 26, a: -0.2, st: 'rest', t: 0, cup: [] };
const LIFT = { upX: 26, downX: 14, cx: 20, top: 18, bot: 180, r: 6, spacing: 12, off: 0, speed: 1 };

const SPLIT = { x: 140, y: 58, dir: 1, flip: 0, force: null };

// ---------------------------------------------------------------- marbles
const MCOLS = [['#e8404a', '#ff9aa0'], ['#3a7ae8', '#9ac4ff'], ['#3ab85a', '#9ae8a8'], ['#f0c030', '#fff0a0'], ['#9a4ad8', '#d4a8ff'], ['#2ab8c8', '#a8f0f8'], ['#f07a2a', '#ffc49a'], ['#e8e8f0', '#ffffff'], ['#d84aa8', '#ffa8e0']];
let marbles = [];
class Marble {
  constructor(o) { Object.assign(this, { seg: null, s: 0, v: 20, x: 0, y: 0, hidden: false, r: 2, kind: 'glass', front: 1, col: pick(MCOLS), spin: rand(0, TAU), trail: [] }, o); }
}
function railMarbles(rail) { return marbles.filter(m => m.seg === rail); }

    case 'right': { enterRail(m, RAILS.loop, 0, Math.max(m.v, 40)); return true; }

  while (t < 26) { const dt = yield; t += dt; if (!reacted && t > 8 && !m.busy) { reacted = true; takeMouse(); m.pose = 'stand'; m.emote('sweat', 2); m.f = g.x > m.x ? 1 : -1; } if (reacted && t > 11 && t < 12) m.emote('q', 2); }
  g.gone = true;
  if (reacted) { m.pose = 'stand'; yield* wait(1); m.emote('dots', 2); yield* wait(2); }
}
function* evGiant() {
  const m = takeMouse();
  m.pose = 'stand'; m.emote('bulb', 1.5); yield* wait(1);
  yield* toTopStart(m);
  const g = new Marble({ kind: 'giant', r: 5, col: ['#8a8a98', '#ffffff'] }); g.x = X(38); marbles.push(g); insertTop(g);
  world.shake = 0.4; addPopup('THUD', X(40), Y(8), '#ffffff');
  m.pose = 'cheer'; yield* wait(1);
  m.pose = 'stand';
  yield* until(() => world.giantStuck, 40);
  addPopup('STUCK', X(FUN.cx) - 10, Y(FUN.rim) - 14, '#ffd0a0');
  m.emote('bang', 1.5); yield* wait(1);
  yield* goTo(m, X(FUN.cx + 8), 'top'); m.f = -1; m.pose = 'push';
  // poke it through with a long stick
  for (let i = 0; i < 3; i++) { m.pose = 'bonk1'; yield* wait(0.4); m.pose = 'bonk2'; world.shake = 0.25; addPopup('BONK', X(FUN.cx) - 8, Y(FUN.rim) - 12, '#ffffff'); yield* wait(0.5); }

  g.seg = { type: 'fly', update: (mm, dt) => { vy += G * dt; y += vy * dt; if (y > BENCH - 5) { y = BENCH - 5; if (vy > 30) { world.shake = 0.6; addPopup('THUD', x - 8, y - 14, '#ffffff'); } vy = -vy * 0.3; if (Math.abs(vy) < 10) vy = 0; } mm.x = x; mm.y = y; } };
  m.emote('sweat', 2); yield* wait(3);
  yield* goTo(m, x + 8, 'bench'); m.f = -1; m.pose = 'push';
  let t = 0; while (t < 5) { const dt = yield; t += dt; g.x -= dt * 10 * SC; m.x -= dt * 10 * SC; g.spin -= dt * 2; }

const COMMON = { golden: 1, jam: 1.1, flood: 0.9, race: 1, cat: 0.9, oil: 0.8, snack: 1, snail: 0.8, tea: 0.8, domino: 1, glow: 0.7 };
const RARE = { ride: 1.2, duck: 1, party: 1, ghost: 0.8, giant: 1 };
const FITS = { glow: () => world.night > 0.4, ghost: () => world.night > 0.5 };
const EVENTS = { golden: evGolden, jam: evJam, flood: evFlood, race: evRace, cat: evCat, oil: evOil, snack: evSnack, snail: evSnail, tea: evTea, domino: evDomino, glow: evGlow, ride: evRide, duck: evDuck, party: evParty, ghost: evGhost, giant: evGiant };
const director = { cur: null, name: '', cool: 6, last: '', idx: 0 };
function runDirector(dt) {
  if (director.cur) {
    let r;
    try { r = director.cur.next(dt); } catch (e) { console.error(director.name, e); r = { done: true }; }
    if (r.done) { director.cur = null; director.name = ''; director.cool = FORCE ? 4 : rand(10, 22); cleanupEvent(); }
  } else if ((director.cool -= dt) <= 0) {
    const allEv = Object.keys(EVENTS);
    let name;
    if (FORCE) name = FORCE === 'all' ? allEv[director.idx++ % allEv.length] : FORCE;
    else {
      const fit = tbl => Object.fromEntries(Object.entries(tbl).map(([k, w]) => [k, (FITS[k] && !FITS[k]()) || k === director.last ? 0 : w]));
      name = chance(0.14) ? weighted(fit(RARE)) : null;
      if (!name) name = weighted(fit(COMMON));
    }
    if (!EVENTS[name]) { director.cool = 5; return; }
    director.last = director.name = name;
    director.cur = EVENTS[name]();
    try { director.cur.next(0); } catch (e) { console.error(name, e); director.cur = null; cleanupEvent(); }
  }
}
function cleanupEvent() {
  for (const q of marbles) { q.stuck = false; q.route = null; if (q.kind !== 'glass' && q.kind !== 'gold') q.gone = true; if (q.seg && q.seg.type === 'fly') q.gone = true; if (q.hidden && q.kind === 'glass') { q.hidden = false; } }
  marbles = marbles.filter(q => !q.gone || q.extra);
  for (const b of buckets) if (b.m && !marbles.includes(b.m)) b.m = null;
  for (let k = 0; k < WHEEL.n; k++) if (WHEEL.pockets[k] && !marbles.includes(WHEEL.pockets[k])) WHEEL.pockets[k] = null;
  SAW.cup = SAW.cup.filter(q => marbles.includes(q));
  world.snail = null; world.cat = null; world.squeak = false; world.lampOff = 0; world.glowMode = 0; world.party = 0; world.giantStuck = false; world.jar = false;
  if (world.dominoes) world.dominoes = null;
  HAM.want = 1; if (HAM.state !== 'run') HAM.state = 'run';
  SPLIT.force = null;
  if (mouse) { mouse.busy = false; mouse.brain = null; mouse.carry = null; mouse.hidden = false; mouse.hop = 0; }
  const glass = marbles.filter(q => (q.kind === 'glass' || q.kind === 'gold') && !q.extra).length;
  for (let i = glass; i < N_MARBLES; i++) { const q = new Marble(); marbles.push(q); enterRail(q, RAILS.bottom, rand(10, RAILS.bottom.len - 10), 10); }
}

// ---------------------------------------------------------------- update + render
function update(dt) {
  world.t += dt;
  const h = localHour();
  const day = smooth(5.5, 7.5, h) * (1 - smooth(18, 20, h));
  world.night = 1 - day;
  world.dusk = Math.max(Math.exp(-(((h - 6.5) / 0.8) ** 2)), Math.exp(-(((h - 19) / 0.8) ** 2)));
  world.dark = clamp(world.night * 0.55 + world.lampOff * 0.75, 0, 1);
  runDirector(dt);
  if (!mouse.busy && !mouse.brain) mouse.brain = mouseAmbient();
  mouse.update(dt);
  updateMachine(dt);
  updateMarbles(dt);
  for (const p of world.parts) { p.life -= dt; p.vy += p.grav * dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.steam) p.x += Math.sin(world.t * 3 + p.y) * 0.05; }
  world.parts = world.parts.filter(p => p.life > 0);
  for (const c of world.confetti) { c.life -= dt; c.vy += 60 * dt; c.vx *= Math.pow(0.5, dt); c.x += c.vx * dt; c.y += c.vy * dt; c.a += dt * 6; if (c.y > BENCH) { c.y = BENCH; c.vx = 0; c.vy = 0; } }
  world.confetti = world.confetti.filter(c => c.life > 0);
  for (const p of world.popups) p.t += dt;
  world.popups = world.popups.filter(p => p.t < 1.6);
  world.shake = Math.max(0, world.shake - dt);
  if (world.snailRest) { world.snailRest.t -= dt; if (world.snailRest.t <= 0) world.snailRest = null; }
  if (world.goldOnShelf > 0) world.goldOnShelf -= dt;
  if (world.jar) for (const q of marbles) if (q.extra && q.seg === RAILS.bottom && q.x < X(52) && !q.jarred) { q.jarred = true; const jx = X(50), jy = BENCH - 6; drop(q, jx, jy, mm => { mm.gone = true; world.jarFill = Math.min(14, (world.jarFill || 0) + 1); }, { T: 0.3 }); }
  if (!world.jar && world.jarFill > 0 && !director.cur) world.jarFill = 0;
}
function drawWindowSky() {

  let top = mixRgb([90, 160, 230], [12, 16, 44], n), bot = mixRgb([190, 226, 246], [34, 48, 90], n);
  bot = mixRgb(bot, [250, 170, 120], d * 0.8);
  for (let y = -w.r; y <= w.r; y++) { const hw = Math.floor(Math.sqrt(w.r * w.r - y * y)); ctx.fillStyle = rgbStr(mixRgb(top, bot, (y + w.r) / (2 * w.r))); ctx.fillRect(Math.round(w.x - hw), Math.round(w.y + y), hw * 2 + 1, 1); }

  else { const q = ((h + 6) % 24) / 12; disc(w.x - w.r * 0.8 + q * w.r * 1.6, w.y + w.r * 0.2 - Math.sin(Math.PI * q) * w.r * 0.7, 2 * SC, '#f0ecd8'); for (let i = 0; i < 9; i++) if ((Math.sin(world.t + i * 3) > 0)) px(w.x + (hash(i) - 0.5) * w.r * 1.6, w.y + (hash(i + 9) - 0.8) * w.r, '#ffffff'); }
  const cx = w.x - w.r + ((world.t * 1.5) % (w.r * 3)) - w.r * 0.5; ellipse(cx, w.y - w.r * 0.35, 4 * SC, 1.5 * SC, mixHex('#ffffff', '#3a4466', n));

}
function render() {
  ctx = mainCtx;
  ctx.save();
  if (world.shake > 0) ctx.translate(Math.round(rand(-1, 1) * world.shake * 3), Math.round(rand(-1, 1) * world.shake * 2));
  ctx.drawImage(bgCanvas, 0, 0);
  drawWindowSky();
  drawGears();
  drawHamster();
  drawLift();

  for (const m of marbles) if (m.seg && (m.seg.type === 'funnel' || (m.seg.type === 'helix' && !m.front))) drawMarble(m);
  ctx.drawImage(funnelFront, 0, 0);
  ctx.drawImage(helixFront, 0, 0);

  // bench things

function drawBench() {
  // desk lamp, spool seat, matchbox bed, jar
  const lx = X(150), by = BENCH;
  rect(lx - 5, by - 2, 10, 2, '#3a3a44'); line(lx, by - 2, lx + 6 * SC, by - 18 * SC, '#5a5a66', 2); line(lx + 6 * SC, by - 18 * SC, lx - 2 * SC, by - 28 * SC, '#5a5a66', 2);
  const hx = lx - 2 * SC, hy = by - 28 * SC;
  for (let k = 0; k < 6; k++) rect(hx - 2 - k * 0.7, hy + k, 5 + k * 1.4, 1, k < 1 ? '#6ab0a0' : '#4a9080');
  if (world.lampOff < 0.5) rect(hx - 5, hy + 6, 11, 1, '#fff0c0');
  // spool the mouse sits on
  const sx = HOME() + 1;
  rect(sx - 4, by - 6, 9, 1, WOODD); rect(sx - 3, by - 5, 7, 4, '#d85a5a'); rect(sx - 3, by - 4, 7, 1, '#f08080'); rect(sx - 4, by - 1, 9, 1, WOODD);
  // matchbox bed
  const mx = X(234);
  rect(mx - 7, by - 4, 14, 4, '#e8c060'); rect(mx - 7, by - 4, 14, 1, '#f4d890'); rect(mx - 5, by - 3, 10, 2, '#c83a2a'); rect(mx - 6, by - 5, 3, 2, '#ffffff');
  // marble jar (flood event)

    for (let i = 0; i < d.n; i++) { const x = d.x0 + i * d.step, a = d.a[i] * 1.2; ctx.save(); ctx.translate(Math.round(x), by); ctx.rotate(a); ctx.fillStyle = '#1a1a1a'; ctx.fillRect(0, -7, 2, 7); ctx.fillStyle = '#f0f0f0'; ctx.fillRect(1, -6, 1, 1); ctx.fillRect(1, -3, 1, 1); ctx.restore(); }
  }

}
function drawCat() {
  const c = world.cat;

    const tgt = marbles.filter(m => m.seg === RAILS.bottom).sort((a, b) => b.x - a.x)[0];
    const look = tgt ? (tgt.x < x - 30 ? -1 : 0) : 0;
    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, BENCH + 1); ctx.clip();
    drawSpr(spr('cathead' + look, () => catHeadSpr(look)), x, y, 1);
    ctx.restore();
  }
  if (c.paw > 0.01) drawSpr(spr('paw', catPawSpr), c.pawX, c.pawY, 1);
}
// ---------------------------------------------------------------- setup + main loop
function resize() {
  H = ROWS; W = Math.max(120, Math.round((ROWS * innerWidth) / Math.max(1, innerHeight)));
  canvas.width = W; canvas.height = H;
  mainCtx.imageSmoothingEnabled = false;
  layout();
  bakeStatic();
  makeBuckets();
  WHEEL.pockets = new Array(WHEEL.n).fill(null);
  SAW.cup = []; SAW.st = 'rest';
  marbles = [];
  mouse = new Mouse();
  director.cur = null; director.cool = FORCE ? 3 : 6;
  world.parts = []; world.popups = []; world.confetti = [];
  cleanupEvent();
  // spread the marbles around the machine

addEventListener('resize', resize);
resize();
addEventListener('beforeunload', saveLaps);
setInterval(saveLaps, 30000);
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  if (now - last < 1000 / FPS - 1) return;
  const dt = Math.min(0.1, (now - last) / 1000) * TIME_SCALE;
  last = now;
  try { const steps = Math.ceil(dt / 0.05); for (let i = 0; i < steps; i++) update(dt / steps); render(); } catch (e) { console.error(e); }
}
requestAnimationFrame(frame);
</script>
