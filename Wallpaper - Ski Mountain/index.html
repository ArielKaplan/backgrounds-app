  world.t += dt;
  updateLight();
  runDirector(dt);
  updateLift(dt);
  for (const e of world.ents) if (!e.dead) e.update(dt);
  world.ents = world.ents.filter(e => !e.dead);
  // weather drifts on its own unless forced
  if (!WEATHER && director.name !== 'snowfall') { world.wx = (world.wx || 0) + dt; if (world.wx > 240) { world.wx = 0; world.baseSnow = chance(0.3) ? rand(0.15, 0.4) : 0; } world.snow = lerp(world.snow, world.baseSnow, 1 - Math.exp(-dt * 0.1)); world.cloud = lerp(world.cloud, world.baseSnow * 0.8, 1 - Math.exp(-dt * 0.1)); }

  for (const p of world.parts) { p.life -= dt; if (p.flake) { p.ph += dt * 2; p.x += (p.vx + Math.sin(p.ph) * 6) * dt; p.y += p.vy * dt; if (p.y > H) p.life = 0; continue; } p.vy += p.grav * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
  world.parts = world.parts.filter(p => p.life > 0);
  for (const p of world.popups) p.t += dt; world.popups = world.popups.filter(p => p.t < 1.6);
  for (const c of scene.clouds) { c.x += dt * 2.5; if (c.x > W + 50) { c.x = -50; c.y = rand(H * 0.04, H * 0.22); } }
  // fireworks
  for (const f of world.fireworks) { f.t += dt; if (!f.burst) { f.y += f.vy * dt; if (f.t > f.fuse) { f.burst = true; for (let i = 0; i < 48; i++) { const a = i / 48 * TAU, s = rand(28, 46); addPart(f.x, f.y, Math.cos(a) * s, Math.sin(a) * s, rand(1, 1.6), f.col, { grav: 14, fw: true }); } addPopup('', f.x, f.y); } } }
  world.fireworks = world.fireworks.filter(f => !f.burst);
  // chimney smoke
  if (chance(dt * 2)) addPart(world.chimney[0], world.chimney[1], rand(1, 3), rand(-6, -4), 4, '#b8bcc8', { smoke: true });
  if (chance(dt * 1)) addPart(world.hutChimney[0], world.hutChimney[1], rand(1, 3), rand(-5, -3), 3, '#b8bcc8', { smoke: true });

}
function drawSky() {
  const n = world.night, d = world.dusk, g = world.cloud;
  let top = mixRgb([70, 146, 226], [8, 12, 38], n), bot = mixRgb([196, 226, 248], [32, 42, 86], n);
  top = mixRgb(top, [110, 80, 150], d * 0.4); bot = mixRgb(bot, [250, 170, 130], d * 0.8);
  top = mixRgb(top, mixRgb([150, 160, 178], [26, 30, 44], n), g * 0.8); bot = mixRgb(bot, mixRgb([200, 206, 216], [44, 48, 62], n), g * 0.8);
  for (let y = 0; y < H * 0.62; y++) { const k = clamp(y / (H * 0.6) + (bayer(y, y * 3) - 0.5) * 0.05, 0, 1); ctx.fillStyle = rgbStr(mixRgb(top, bot, k)); ctx.fillRect(0, y, W, 1); }
  if (n > 0.3) { const a = (n - 0.3) / 0.7 * (1 - g); for (const s of scene.stars) { const tw = 0.5 + 0.5 * Math.sin(world.t * 1.4 + s.ph); if (tw * a > 0.35) px(s.x, s.y, tw * a > 0.7 ? '#ffffff' : '#a0aad8'); } }
  const sp = world.sunP; if (sp > -0.1 && sp < 1.1 && g < 0.8) { const x = W * (0.1 + 0.8 * sp), y = H * 0.5 - Math.sin(Math.PI * clamp(sp, 0, 1)) * H * 0.4; ctx.globalAlpha = 1 - g; disc(x, y, 8, d > 0.3 ? '#ffc890' : '#fff4d8'); disc(x, y, 6, '#fffbea'); ctx.globalAlpha = 1; }
  if (n > 0.4) { const h = localHour(), q = (((h - 18) / 12) % 2 + 2) % 2; if (q < 1) { const x = W * (0.1 + 0.8 * q), y = H * 0.48 - Math.sin(Math.PI * q) * H * 0.36; disc(x, y, 5, '#f4f0dc'); px(x - 2, y - 1, '#d8d4c0'); px(x + 1, y + 2, '#d8d4c0'); } }
  for (const c of scene.clouds) {
    const col = rgbStr(mixRgb(mixRgb([255, 255, 255], [60, 66, 96], n), [180, 184, 194], g * 0.7)), sh = rgbStr(mixRgb(mixRgb([220, 228, 242], [44, 48, 74], n), [150, 154, 166], g * 0.7));
    for (const [dx, dy, r] of c.puffs) ellipse(c.x + dx, c.y + dy + 2, r * 1.7, r * 0.8, sh);
    for (const [dx, dy, r] of c.puffs) ellipse(c.x + dx, c.y + dy, r * 1.6, r * 0.75, col);

}
function drawSleigh(s) {
  const x = Math.round(s.x), y = Math.round(s.y);
  for (let i = 0; i < 3; i++) { const rx = x + 10 + i * 9, ry = y - 2 + Math.sin(world.t * 8 + i) * 1; ellipse(rx, ry, 3, 1.6, '#8a5a34'); px(rx + 3, ry - 2, '#8a5a34'); px(rx + 3, ry - 3, '#c8a070'); px(rx + 4, ry - 3, i === 2 ? '#ff3a3a' : '#5a3a24'); px(rx - 1, ry + 2, '#5a3a24'); px(rx + 2, ry + 2, '#5a3a24'); }
  line(x + 4, y, x + 30, y - 1, '#c8a070');
  rect(x - 8, y - 3, 12, 4, '#c8302a'); rect(x - 9, y + 1, 14, 1, '#e8c060'); rect(x - 5, y - 8, 5, 5, '#d8382a'); px(x - 3, y - 9, '#ffffff'); rect(x - 4, y - 6, 3, 1, '#f4d0b0'); rect(x - 5, y - 5, 5, 2, '#ffffff');
  rect(x - 8, y - 6, 3, 3, '#8a5a34');
}
function render() {
  ctx = mainCtx;
  ctx.save();
  if (world.shake > 0.01) ctx.translate(Math.round(rand(-1, 1) * world.shake * 3), Math.round(rand(-1, 1) * world.shake * 2));
  drawSky();
  ctx.drawImage(bgCanvas, 0, 0);
  // slalom gates, gear, snowmen
  if (world.gates) for (const g of world.gates) { const [x, y] = pist(g.t, g.u); rect(x, y - 7, 1, 7, g.col); rect(x + 1, y - 7, 3, 3, g.col); }
  // lift cable + chairs

  const list = [];
  for (const c of chairs) { const [x, y, up] = chairXY(c); list.push({ y: y + 12, draw: () => drawChair(c, x, y, up) }); }
  for (const e of world.ents) if (!e.dead && !e.hidden && !(e.x === 0 && e.y === 0) && !(e instanceof Person && e.state === 'chair')) list.push({ y: e.y, draw: () => { if (e.sled) drawSledUnder(e); e.draw(); } });
  for (const p of world.deckers) list.push({ y: p.y, draw: () => p.draw() });
  for (const sm of world.snowmen) list.push({ y: sm.y, draw: () => drawSnowman(sm) });
  if (world.groomer) { const g = world.groomer, [x, y] = pist(g.t, g.u); list.push({ y, draw: () => drawGroomer(x, y) }); }
  if (world.bigball) { const b = world.bigball; list.push({ y: b.y, draw: () => { disc(b.x, b.y - b.r, b.r, '#dfe8f4'); disc(b.x - b.r * 0.2, b.y - b.r * 1.15, b.r * 0.8, '#ffffff'); if (b.caught) { px(b.x + 2, b.y - b.r, b.caught.L.skiCol); px(b.x - 3, b.y - b.r * 1.3, b.caught.L.hat); } } }); }
  if (world.gear) for (const g of world.gear) if (!g.picked) list.push({ y: g.y, draw: () => { if (g.kind === 'ski') line(g.x - 4, g.y - g.h, g.x + 4, g.y - g.h - 1, g.col); else if (g.kind === 'pole') line(g.x - 2, g.y - g.h - 3, g.x + 2, g.y - g.h, g.col); else rect(g.x - 1, g.y - g.h - 2, 3, 2, g.col); } });
  if (world.mitten) list.push({ y: world.mitten.y, draw: () => rect(world.mitten.x, world.mitten.y - 2, 2, 2, world.mitten.col) });
  list.sort((a, b) => a.y - b.y);
  for (const it of list) it.draw();
  if (world.balls) for (const b of world.balls) { const k = clamp(b.t / b.dur, 0, 1); disc(lerp(b.x0, b.x1, k), lerp(b.y0, b.y1, k) - Math.sin(Math.PI * k) * 8, 1, '#ffffff'); }
  ctx.drawImage(frontCanvas, 0, 0);
  for (const p of world.parts) {
    if (p.flake) { px(p.x, p.y, '#ffffff'); continue; }
    if (p.smoke) { ctx.globalAlpha = clamp(p.life / p.max, 0, 0.5); disc(p.x, p.y, 1 + (1 - p.life / p.max) * 3, p.col); ctx.globalAlpha = 1; continue; }
    if (p.fw) continue;
    if (p.sparkle) { if (Math.floor(world.t * 10 + p.x) % 2) px(p.x, p.y, p.col); continue; }
    px(p.x, p.y, p.col);

    ctx.globalCompositeOperation = 'multiply';
    ctx.fillStyle = rgbStr(mixRgb([255, 255, 255], [60, 72, 136], world.night * 0.82));
    ctx.fillRect(-4, -4, W + 8, H + 8);
    ctx.globalCompositeOperation = 'source-over';
    for (const [x, y] of world.lodgeWins) { rect(x - 1, y - 2, 3, 4, '#ffe0a0'); glowAt(x, y, 10, '#ffb860', 0.6); }
    glowAt(HUT.x, HUT.y - 5, 12, '#ffb860', 0.5);
    glowAt(LIFT.x0, LIFT.y0 - 6, 10, '#ffd890', 0.5); glowAt(LIFT.x1, LIFT.y1 - 6, 10, '#ffd890', 0.5);
    if (world.lights) for (let t = 0.08, i = 0; t < 1; t += 0.12, i++) { const [x, y] = pist(t, i % 2 ? -1.25 : 1.25); rect(x, y - 14, 1, 14, '#3a3a44'); rect(x - 1, y - 15, 3, 2, '#fffbe0'); glowAt(x + (i % 2 ? 6 : -6), y - 4, 30, '#fff0c8', 0.4); }
    if (world.groomer) { const [x, y] = pist(world.groomer.t, world.groomer.u); glowAt(x - 8, y - 4, 16, '#fff8d0', 0.8, true); }
  }
  for (const p of world.parts) if (p.fw) { const k = clamp(p.life / p.max * 1.4, 0, 1); ctx.globalAlpha = k; px(p.x, p.y, p.col); px(p.x - p.vx * 0.03, p.y - p.vy * 0.03, p.col); ctx.globalAlpha = 1; if (chance(0.3)) glowAt(p.x, p.y, 6, p.col, 0.5 * k, true); }
  for (const f of world.fireworks) { px(f.x, f.y, '#fff0c0'); glowAt(f.x, f.y, 4, '#ffb060', 0.6, true); }
  flushGlows();
  if (world.dusk > 0.05 && world.night < 0.95) { ctx.globalCompositeOperation = 'soft-light'; ctx.globalAlpha = world.dusk * 0.45; rect(-4, -4, W + 8, H + 8, '#ff9a6a'); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; }
  for (const e of world.ents) if (!e.dead && e.drawEmotes) e.drawEmotes();

  ctx.restore();
  if (DEBUG) { const h = localHour(); text(`${director.name || '-'} ${String(Math.floor(h)).padStart(2, '0')}:${String(Math.floor((h % 1) * 60)).padStart(2, '0')} Q${queue.length} P${world.ents.length}`, 3, 3, '#ffffff', '#000000'); }
}
function drawChair(c, x, y, up) {
  const sw = c.swing;
  line(x, y, x + sw, y + 7, '#4a4a58');
  const cx = x + sw, cy = y + 8;
  // riders sit on the bench, skis dangling

  if (up && c.riders.length) rect(cx - 4, cy - 1, 10, 1, '#8a8a98');

function drawSledUnder(p) { rect(p.x - 5, p.y - 1, 10, 2, '#e84a3a'); px(p.x + 5 * -p.f, p.y - 2, '#e84a3a'); }
function drawSnowman(sm) {
  const x = sm.x, y = sm.y, s = sm.s;
  if (s > 0) ellipse(x, y - Math.min(1, s) * 4, Math.min(1, s) * 5, Math.min(1, s) * 4, '#fbfdff');
  if (s > 1) disc(x, y - 10, Math.min(1, s - 1) * 3.5, '#fbfdff');
  if (s > 2) disc(x, y - 16, Math.min(1, s - 2) * 2.6, '#fbfdff');
  if (s >= 3) { px(x - 1, y - 17, INK); px(x + 1, y - 17, INK); px(x, y - 11, INK); px(x, y - 9, INK); }
  if (sm.parts >= 1) { rect(x - 3, y - 20, 6, 1, INK); rect(x - 2, y - 23, 4, 3, INK); line(x - 3, y - 11, x - 7, y - 14, '#6a4a2a'); line(x + 3, y - 11, x + 7, y - 14, '#6a4a2a'); }
  if (sm.parts >= 2) { px(x + 1, y - 16, '#f07a2a'); px(x + 2, y - 16, '#f07a2a'); rect(x - 3, y - 14, 6, 1, '#e84a3a'); }
}
function drawGroomer(x, y) {
  rect(x - 12, y - 3, 20, 3, '#3a3a44'); for (let i = 0; i < 20; i += 3) px(x - 12 + i + (Math.floor(world.t * 8) % 3), y - 2, '#6a6a78');
  rect(x - 10, y - 10, 14, 7, '#e8403a'); rect(x - 4, y - 9, 6, 4, '#a8d8f0'); rect(x - 10, y - 10, 14, 1, '#ff7a6a');
  rect(x + 6, y - 5, 3, 4, '#c8c8d0'); px(x + 2, y - 11, '#ffb040');
  for (let i = 0; i < 6; i++) px(x - 14 + i * 0.5, y - 1, '#e2eaf6');
}

// ---------------------------------------------------------------- setup + main loop
function resize() {
  H = ROWS; W = Math.max(120, Math.round((ROWS * innerWidth) / Math.max(1, innerHeight)));
  canvas.width = W; canvas.height = H;
  mainCtx.imageSmoothingEnabled = false;
  layout();
  bakeBackground();
  scene.stars = Array.from({ length: Math.round(W * H * 0.5 / 60) }, () => ({ x: randi(0, W - 1), y: randi(0, Math.round(H * 0.45)), ph: rand(0, TAU) }));
  scene.clouds = Array.from({ length: 4 }, () => ({ x: rand(-20, W + 20), y: rand(H * 0.04, H * 0.22), puffs: Array.from({ length: randi(3, 5) }, (_, i) => [i * 7 + rand(-2, 2), rand(-1.5, 1.5), rand(3, 5)]) }));
  world.parts = []; world.popups = []; world.ents = []; world.snowmen = []; world.fireworks = [];
  world.baseSnow = WEATHER === 'snow' ? 0.45 : WEATHER === 'clear' ? 0 : chance(0.25) ? 0.25 : 0;
  world.snow = world.baseSnow; world.cloud = world.baseSnow * 0.8;

  for (let i = 0; i < N_SKIERS; i++) {
    const p = new Person({ L: makeLook(chance(0.2)) });
    world.ents.push(p);
    const r = i % 3;
    if (r === 0) { p.state = 'queue'; p.x = LIFT.x0 + 10 + queue.length * 5; p.y = LIFT.y0 + 4; queue.push(p); }
    else if (r === 1 && i % 2) { const c = chairs.filter(q => q.s < 0.9 && q.s > 0.05 && q.riders.length < 2)[0]; if (c) { p.state = 'chair'; p.pose = 'ride'; c.riders.push(p); } else { queue.push(p); p.x = LIFT.x0 + 10; p.y = LIFT.y0 + 4; } }
    else { p.x = LIFT.x1 + 4; p.y = LIFT.y1; p.brain = skiDown(p); p.brain.next(0); const n = randi(0, 1100); for (let k = 0; k < n && p.state === 'ski'; k++) p.brain.next(1 / 30); }
  }

  world.deckers = [0, 1, 2].map(i => { const p = new Person({ L: makeLook(), x: world.deck.x + 3 + i * 5, y: world.deck.y + 1, pose: i === 1 ? 'cocoa' : 'sit', f: i === 2 ? -1 : 1 }); p.hideSki = true; return p; });
  for (const p of world.deckers) p.L.board = false;

addEventListener('resize', resize);
resize();
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  if (now - last < 1000 / FPS - 1) return;
  const dt = Math.min(0.1, (now - last) / 1000) * TIME_SCALE;
  last = now;
  try { const steps = Math.ceil(dt / 0.05); for (let i = 0; i < steps; i++) update(dt / steps); render(); } catch (e) { console.error(e); }
}
requestAnimationFrame(frame);
</script>
