<script>
/* =====================================================================
   AURORA — northern lights over a mountain lake
   Live: the aurora follows the real planetary Kp index (NOAA SWPC, refreshed every 10 min).
         Quiet nights are a faint green glow low over the mountains; storms climb the sky,
         add red tops, pink lower fringes and extra arcs. The stars are the real sky over
         Tromsø right now (Big Dipper, Cassiopeia and Polaris turn with sidereal time) and
         the moon is where it really is, with its real phase.
   Options (add to the end of the address, combine with &):
     #kp=5              pretend Kp (0-9) instead of the live value
     #lat=69.6&lon=19   observer for stars + moon (default Tromsø)
     #seed=42           same mountains every time (otherwise a new valley each load)
     #quality=medium    low | medium | high (GL resolution for the sky)
     #hud=bl            HUD corner: bl | br | tl | tr | off
     #offline           never touch the network
     #event=moose       test mode: repeat one event (or "all")
     #speed=3           run time faster (testing)
     #fps=30            frame cap
     #debug             event name + timings
   Events: meteor substorm moose wolf owl fox cabin canoe satellite snow hare
   Rare:   shower fireball red steve reindeer
   ===================================================================== */
const params = new URLSearchParams(location.hash.slice(1));
const num = (k, d) => { const v = parseFloat(params.get(k)); return Number.isFinite(v) ? v : d; };
const KP_FORCE = params.has('kp') ? num('kp', 3) : null;
const OBS_LAT = num('lat', 69.65), OBS_LON = num('lon', 18.96);
const QUALITY = params.get('quality') || 'medium';
const HUD = params.get('hud') || 'bl';
const OFFLINE = params.has('offline');
const FORCE = params.get('event');
const TIME_SCALE = num('speed', 1);
const FPS = num('fps', 30);
const DEBUG = params.has('debug');

// ---------------------------------------------------------------- utils
let seed = params.has('seed') ? num('seed', 1) >>> 0 : (Math.random() * 2 ** 32) >>> 0;
function srand() { seed = (seed + 0x6D2B79F5) >>> 0; let t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
const rand = (a, b) => a + Math.random() * (b - a);
const srandr = (a, b) => a + srand() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const chance = p => Math.random() < p;
const coin = () => (Math.random() < 0.5 ? 1 : -1);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const rad = Math.PI / 180, TAU = Math.PI * 2;
function weighted(obj) {
  const e = Object.entries(obj).filter(([, w]) => w > 0);
  let r = Math.random() * e.reduce((a, [, w]) => a + w, 0);
  for (const [k, w] of e) if ((r -= w) < 0) return k;
  return e[0][0];
}
function mk(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, w); c.height = Math.max(1, h); return c; }
const PERM = new Float32Array(1024);
function reseedNoise() { for (let i = 0; i < 1024; i++) PERM[i] = srand(); }
const hsh = i => PERM[i & 1023];
function vn(x) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return hsh(i) + (hsh(i + 1) - hsh(i)) * u; }
function vn2(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const h = (a, b) => PERM[(a * 73 + b * 151) & 1023];
  const a = h(xi, yi), b = h(xi + 1, yi), c = h(xi, yi + 1), d = h(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function ridged(x, oct = 5) { let s = 0, a = 1, f = 1, n = 0; for (let i = 0; i < oct; i++) { const r = 1 - Math.abs(2 * vn(x * f + i * 17.3) - 1); s += a * r * r; n += a; a *= 0.5; f *= 2.03; } return s / n; }
function fbm(x, oct = 4) { let s = 0, a = 1, f = 1, n = 0; for (let i = 0; i < oct; i++) { s += a * vn(x * f + i * 31.7); n += a; a *= 0.5; f *= 2.1; } return s / n; }

// ---------------------------------------------------------------- astronomy
function astro(ms) {
  const n = ms / 86400000 + 2440587.5 - 2451545.0;
  const L = 280.460 + 0.9856474 * n, g = (357.528 + 0.9856003 * n) * rad;
  const lam = (L + 1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g)) * rad, eps = (23.439 - 4e-7 * n) * rad;
  const sun = { ra: Math.atan2(Math.cos(eps) * Math.sin(lam), Math.cos(lam)), dec: Math.asin(Math.sin(eps) * Math.sin(lam)) };
  const gmst = ((280.46061837 + 360.98564736629 * n) % 360 + 360) % 360 * rad;
  const Lm = (218.316 + 13.176396 * n) * rad, Mm = (134.963 + 13.064993 * n) * rad, Fm = (93.272 + 13.229350 * n) * rad;
  const lm = Lm + 6.289 * rad * Math.sin(Mm), bm = 5.128 * rad * Math.sin(Fm);
  const x = Math.cos(bm) * Math.cos(lm), y = Math.cos(eps) * Math.cos(bm) * Math.sin(lm) - Math.sin(eps) * Math.sin(bm), z = Math.sin(eps) * Math.cos(bm) * Math.sin(lm) + Math.cos(eps) * Math.sin(bm);
  const moon = { ra: Math.atan2(y, x), dec: Math.asin(z) };
  return { sun, moon, lst: gmst + OBS_LON * rad };
}
// local frame: x = east, y = up, z = north (we look north)
const PHI = OBS_LAT * rad;
const POLE = [0, Math.sin(PHI), Math.cos(PHI)], MERID = [0, Math.cos(PHI), -Math.sin(PHI)];
function localDir(ra, dec, lst) {
  const H = lst - ra, cd = Math.cos(dec), sd = Math.sin(dec), ch = Math.cos(H), sh = Math.sin(H);
  return [-cd * sh, sd * POLE[1] + cd * ch * MERID[1], sd * POLE[2] + cd * ch * MERID[2]];
}
// bright stars: [RA hours, Dec deg, magnitude]
const STARS = [
  [2.530, 89.26, 2.0], [11.062, 61.75, 1.8], [11.031, 56.38, 2.4], [11.897, 53.69, 2.4], [12.257, 57.03, 3.3], [12.900, 55.96, 1.8], [13.399, 54.93, 2.2], [13.792, 49.31, 1.9],
  [0.675, 56.54, 2.2], [0.153, 59.15, 2.3], [0.945, 60.72, 2.2], [1.430, 60.24, 2.7], [1.907, 63.67, 3.4],
  [14.845, 74.16, 2.1], [15.345, 71.83, 3.0], [17.537, 86.59, 4.4], [16.766, 82.04, 4.2], [15.734, 77.79, 4.3], [16.292, 75.76, 4.9],
  [5.278, 46.00, 0.1], [18.616, 38.78, 0.0], [20.690, 45.28, 1.3], [19.846, 8.87, 0.8], [14.261, 19.18, -0.05], [4.599, 16.51, 0.9],
  [5.919, 7.41, 0.5], [5.242, -8.20, 0.1], [6.752, -16.72, -1.46], [7.655, 5.22, 0.4], [7.755, 28.03, 1.1], [7.577, 31.89, 1.6], [10.139, 11.97, 1.4],
  [3.405, 49.86, 1.8], [3.136, 40.96, 2.1], [20.370, 40.26, 2.2], [20.770, 33.97, 2.5], [19.750, 45.13, 2.9], [19.512, 27.96, 3.1],
  [17.943, 51.49, 2.2], [17.507, 52.30, 2.8], [14.073, 64.38, 3.7], [16.400, 61.51, 2.7], [21.310, 62.59, 2.5], [23.656, 77.63, 3.2], [21.478, 70.56, 3.2],
  [5.992, 44.95, 1.9], [0.140, 29.09, 2.1], [1.162, 35.62, 2.1], [2.065, 42.33, 2.1], [23.079, 15.21, 2.5], [23.063, 28.08, 2.4], [0.220, 15.18, 2.8],
  [3.791, 24.11, 2.9], [3.763, 24.37, 3.7], [3.747, 23.95, 3.9], [3.819, 24.05, 3.6], [9.460, -8.66, 2.0], [12.692, -1.45, 2.7],
  [13.420, -11.16, 1.0], [16.490, -26.43, 1.0], [11.818, 14.57, 2.1], [10.333, 19.84, 2.0], [1.622, 20.81, 2.6], [2.120, 23.46, 2.0],
];

// ---------------------------------------------------------------- live Kp
const live = { state: OFFLINE ? 'off' : 'wait', time: 0 };
let KP_LIVE = null;
async function fetchT(url, ms = 20000) {
  const ac = new AbortController(), to = setTimeout(() => ac.abort(), ms);
  try { const r = await fetch(url, { signal: ac.signal, mode: 'cors' }); if (!r.ok) throw new Error(r.status); return await r.json(); } finally { clearTimeout(to); }
}
async function fetchKp() {
  let kp = null;
  try {
    const j = await fetchT('https://services.swpc.noaa.gov/json/planetary_k_index_1m.json');
    const last = [].concat(j).reverse().find(r => r && (r.estimated_kp ?? r.kp_index) != null);
    if (last) kp = parseFloat(last.estimated_kp ?? last.kp_index);
  } catch (e) { /* try the 3-hourly product */ }
  if (!Number.isFinite(kp)) {
    const j = await fetchT('https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json');
    const rows = [].concat(j).filter(r => r && (Array.isArray(r) ? r[1] !== 'Kp' : r.Kp != null));
    const last = rows[rows.length - 1];
    kp = parseFloat(Array.isArray(last) ? last[1] : last.Kp);
  }
  if (!Number.isFinite(kp)) throw new Error('bad Kp');
  KP_LIVE = clamp(kp, 0, 9);
  live.state = 'live'; live.time = Date.now();
  try { localStorage.setItem('aurora:kp', JSON.stringify({ kp: KP_LIVE, time: live.time })); } catch (e) { /* ignore */ }
}
if (!OFFLINE && KP_FORCE === null) {
  try { const c = JSON.parse(localStorage.getItem('aurora:kp') || 'null'); if (c && Date.now() - c.time < 3 * 3600e3) { KP_LIVE = c.kp; live.state = 'cache'; live.time = c.time; } } catch (e) { /* ignore */ }
  let fails = 0;
  const run = async () => {
    let next = 10 * 60e3;
    try { await fetchKp(); fails = 0; } catch (e) { fails++; console.warn('[aurora] Kp fetch failed', e.message || e); if (live.state === 'wait') live.state = 'off'; next = Math.min(10 * 60e3, 30e3 * 2 ** (fails - 1)); }
    setTimeout(run, next);
  };
  run();
}
// without data: a plausible, slowly wandering "typical night"
const kpNow = t => KP_FORCE !== null ? KP_FORCE : KP_LIVE !== null ? KP_LIVE : 2.6 + 1.1 * Math.sin(t / 900) + 0.5 * Math.sin(t / 257);
const kpWord = k => k >= 7 ? 'strong storm' : k >= 5 ? `storm · G${Math.min(5, Math.floor(k) - 4)}` : k >= 4 ? 'active' : k >= 3 ? 'unsettled' : 'quiet';

// ---------------------------------------------------------------- WebGL sky + lake
const cv = document.getElementById('gl'), ov = document.getElementById('ov');
const gl = cv.getContext('webgl2', { antialias: false, alpha: false, powerPreference: 'low-power' });
const ctx = ov.getContext('2d');
if (!gl) { document.body.style.color = '#8aa'; document.body.append('This wallpaper needs WebGL2.'); throw new Error('no webgl2'); }
cv.addEventListener('webglcontextlost', e => e.preventDefault());
cv.addEventListener('webglcontextrestored', () => location.reload());

const FRAG = `#version 300 es
precision highp float;
uniform vec2 uRes;
uniform float uScale, uHY, uF, uW, uPhase, uTime, uRed, uBoost, uMoonLight, uFlash, uSteve, uSteveX;
uniform vec3 uArcZ, uArcI, uMoonDir;
out vec4 o;

float h11(float p) { p = fract(p * 0.1031); p *= p + 33.33; p *= p + p; return fract(p); }
float h12(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float n1(float x) { float i = floor(x), f = fract(x); return mix(h11(i), h11(i + 1.0), f * f * (3.0 - 2.0 * f)); }
float n2(vec2 x) { vec2 i = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(h12(i), h12(i + vec2(1, 0)), f.x), mix(h12(i + vec2(0, 1)), h12(i + vec2(1, 1)), f.x), f.y); }
float fb(float x) { return n1(x) * 0.55 + n1(x * 2.17 + 7.3) * 0.3 + n1(x * 4.63 + 1.7) * 0.15; }

float curveZ(float x, float k, float Z) {
  float u = x / Z;
  return Z * (1.0 + (fb(u * 0.9 + uPhase * 0.011 + k * 11.0) - 0.5) * 0.75 + 0.2 * sin(u * 0.33 + k * 2.1 + uPhase * 0.006)
             + 0.16 * (n1(u * 3.6 + uPhase * 0.02 + k * 4.0) - 0.5));   // folds
}

vec3 aurora(vec3 rd) {
  vec3 acc = vec3(0.0);
  if (rd.y <= 0.001 || rd.z <= 0.02) return acc;
  vec2 hd = normalize(rd.xz);
  for (int k = 0; k < 3; k++) {
    float Z = uArcZ[k], I = uArcI[k];
    if (I < 0.01) continue;
    for (int sh = 0; sh < 2; sh++) {
      float ks = float(k) + float(sh) * 0.37, off = float(sh) * 0.08 * Z;
      float t = Z / rd.z;
      for (int it = 0; it < 4; it++) t = (curveZ(rd.x * t, ks, Z) + off) / rd.z;
      if (t <= 0.0) continue;
      float a = rd.y * t, x = rd.x * t, u = x / Z;
      float a0 = 1.0 + 0.12 * (n1(u * 2.0 + ks * 3.1 + uPhase * 0.03) - 0.5) + 0.05 * (n1(u * 11.0 - uPhase * 0.2 + ks) - 0.5);
      float h = a - a0;
      if (h < -0.06 || h > 4.5) continue;
      float green = smoothstep(-0.012, 0.012, h) * (exp(-max(h, 0.0) * 1.7) + 1.3 * exp(-max(h, 0.0) * 12.0));
      float red = smoothstep(0.35, 1.3, h) * exp(-max(h - 1.3, 0.0) * 0.8);
      float pink = exp(-h * h / 0.0025) * uBoost;
      float rays = 0.18 + 0.95 * pow(n1(u * 9.0 + uPhase * 0.22 + ks * 17.0), 2.5) + 0.3 * pow(n1(u * 38.0 - uPhase * 0.6), 2.0);
      float patchv = smoothstep(0.30, 0.78, fb(u * 2.2 + uPhase * 0.017 + ks * 5.0)) * (k == 0 ? 1.0 : smoothstep(0.45, 0.8, n1(u * 1.3 + ks * 9.0 + uPhase * 0.01)));
      float pulse = 0.78 + 0.22 * sin(u * 9.0 - uPhase * 1.5 + 6.0 * n1(u * 2.0));
      float dz = curveZ(x + 0.3 * Z, ks, Z) - curveZ(x - 0.3 * Z, ks, Z);
      vec2 nrm = normalize(vec2(-dz / (0.6 * Z), 1.0));
      float obl = min(1.0 / max(abs(dot(nrm, hd)), 0.22), 3.5);
      float fade = exp(-t * 0.012);
      float e = rays * patchv * pulse * obl * I * fade * (sh == 0 ? 1.0 : 0.5);
      acc += (vec3(0.08, 1.0, 0.40) * green * 1.5 + vec3(1.0, 0.14, 0.30) * red * (0.10 + uRed) + vec3(1.0, 0.28, 0.72) * pink) * e;
    }
  }
  return acc;
}

vec3 sky(vec3 rd) {
  float el = max(rd.y, 0.0);
  vec3 col = mix(vec3(0.011, 0.019, 0.030), vec3(0.0015, 0.003, 0.008), pow(el, 0.4));
  col += vec3(0.03, 0.022, 0.012) * exp(-el * 30.0) * 0.4;               // faint town glow on the horizon
  float gl = uArcI.x + uArcI.y * 0.6 + uArcI.z * 0.3;
  col += vec3(0.02, 0.11, 0.06) * gl * exp(-el * 3.5) * 0.35;           // aurora lighting the whole sky
  float mm = max(dot(rd, uMoonDir), 0.0);
  col += vec3(0.10, 0.13, 0.19) * uMoonLight * (pow(mm, 30.0) * 0.5 + pow(mm, 4.0) * 0.12) + vec3(0.006, 0.009, 0.016) * uMoonLight;
  col += aurora(rd);
  if (uSteve > 0.001) {                                                  // STEVE: a thin mauve ribbon + green picket fence
    float elev = asin(clamp(rd.y, -1.0, 1.0)), az = atan(rd.x, rd.z) - uSteveX;
    float arc = radians(46.0) - 0.55 * az * az;
    float d = elev - arc;
    float rib = exp(-d * d / 0.00012) * (0.6 + 0.4 * n1(az * 40.0 + uTime * 0.3));
    float fence = exp(-pow((d + 0.075) / 0.028, 2.0)) * pow(n1(az * 160.0 + uTime * 0.2), 3.0) * 2.0;
    col += (vec3(0.75, 0.30, 0.85) * rib * 0.9 + vec3(0.2, 1.0, 0.45) * fence * 0.35) * uSteve * smoothstep(1.3, 0.6, abs(az));
  }
  return col;
}

void main() {
  vec2 p = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y) / uScale;    // CSS px, y down
  float xs = (p.x - uW * 0.5) / uF;
  float dy = p.y - uHY;
  vec3 col;
  if (dy <= 0.0) {
    col = sky(normalize(vec3(xs, -dy / uF, 1.0)));
  } else {
    float D = uF / dy;                                                   // distance across the water
    vec2 wp = vec2(xs * D, D);
    float r1 = n2(wp * vec2(0.7, 2.2) + vec2(0.0, -uTime * 0.22)) + 0.5 * n2(wp * vec2(2.2, 6.0) + vec2(uTime * 0.05, uTime * 0.35));
    float r2 = n2(wp * vec2(1.3, 3.0) + vec2(4.0, uTime * 0.18));
    float slope = dy / uF;
    vec3 rr = normalize(vec3(xs + (r2 - 0.5) * 0.035 * min(slope * 4.0, 1.0), slope * (1.0 + (r1 - 0.75) * 0.55), 1.0));
    float fres = 0.30 + 0.62 * pow(1.0 - min(slope, 1.0), 4.0);
    col = sky(rr) * fres + vec3(0.004, 0.010, 0.016);
  }
  col += vec3(0.25, 0.8, 0.45) * uFlash * 0.25;
  col = 1.0 - exp(-col * 1.35);
  col = pow(col, vec3(1.0 / 2.2));
  col += (h12(gl_FragCoord.xy + fract(uTime * 7.0)) - 0.5) / 255.0;
  o = vec4(col, 1.0);
}`;
function compile(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, `#version 300 es
in vec2 p; void main() { gl_Position = vec4(p, 0.0, 1.0); }`));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG));
gl.bindAttribLocation(prog, 0, 'p');
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
const U = {};
for (let i = 0, n = gl.getProgramParameter(prog, gl.ACTIVE_UNIFORMS); i < n; i++) { const nm = gl.getActiveUniform(prog, i).name; U[nm] = gl.getUniformLocation(prog, nm); }

// ---------------------------------------------------------------- world
let W, H, DPR, HY, F, SHORE, UNIT, RS;
const world = { t: 0, phase: 0, boost: 0, red: 0, steve: 0, steveX: 0, flash: 0, speedMul: 1, snow: 0, arcs: { Z: [8, 14, 24], I: [0.4, 0.2, 0.1] }, glow: 0 };
const scene = {};
const ents = [], parts = [], fx = [];
const SIL = '#03060b';

// bank (foreground snow) top line, in CSS px
function bankTop(x) {
  const u = x / W;
  return SHORE + H * (0.012 * Math.sin(u * 9 + scene.bankSeed) + 0.008 * Math.sin(u * 23 + scene.bankSeed * 2)) - H * 0.085 * (smooth(0.22, 0, u) + smooth(0.8, 1.02, u));
}

// ---------------------------------------------------------------- landscape bake
function buildLandscape() {
  seed = scene.seed0; reseedNoise();
  scene.bankSeed = srand() * 10;
  const dw = Math.round(W * DPR), dh = Math.round(H * DPR), hy = Math.round(HY * DPR);
  const top = mk(dw, hy + 2), tc = top.getContext('2d');
  const img = tc.createImageData(dw, hy + 2), d = img.data;
  const glowMask = mk(dw, hy + 2), gc = glowMask.getContext('2d'), gimg = gc.createImageData(dw, hy + 2), gd = gimg.data;
  const moonSide = scene.moonSide || -1;   // light from the left (-1) or right (+1)
  const mk01 = scene.moonK;
  const s1 = srandr(0, 100), s2 = srandr(0, 100), p1 = srandr(0.18, 0.4), p2 = srandr(0.62, 0.85);
  const far = new Float32Array(dw), mid = new Float32Array(dw);
  for (let x = 0; x < dw; x++) {
    const u = x / dw;
    far[x] = hy - dh * (0.075 + 0.085 * ridged(u * 5.5 + s1) + 0.035 * Math.exp(-(((u - p2) / 0.12) ** 2)));
    mid[x] = hy - dh * (0.01 + 0.035 * ridged(u * 7 + s2, 6) + 0.17 * Math.exp(-(((u - p1) / 0.11) ** 2)) * (0.75 + 0.25 * ridged(u * 13 + s2)) + 0.07 * Math.exp(-(((u - 0.95) / 0.1) ** 2)));
  }

    for (const e of herd) { e.x += dir * e.v * dt; e.ph += dt * 5; }

const COMMON = { meteor: 1.6, substorm: 1.3, moose: 1.3, wolf: 1.1, owl: 1.1, fox: 1.2, cabin: 1.0, canoe: 1.0, satellite: 1.2, snow: 0.8, hare: 1.0 };
const RARE = { shower: 1, fireball: 1, red: 1, steve: 0.8, reindeer: 1 };
const EVENTS = { meteor: evMeteor, substorm: evSubstorm, moose: evMoose, wolf: evWolf, owl: evOwl, fox: evFox, cabin: evCabin, canoe: evCanoe, satellite: evSatellite, snow: evSnow, hare: evHare,
  shower: evShower, fireball: evFireball, red: evRed, steve: evSteve, reindeer: evReindeer };
const director = { cur: null, name: '', cool: 6, last: '', idx: 0 };
function runDirector(dt) {
  if (director.cur) {
    let r;
    try { r = director.cur.next(dt); } catch (e) { console.error(director.name, e); r = { done: true }; }
    if (r.done) { director.cur = null; director.name = ''; director.cool = FORCE ? 3 : rand(12, 26); cleanup(); }
  } else if ((director.cool -= dt) <= 0) {
    const all = Object.keys(EVENTS);
    let name;
    if (FORCE) name = FORCE === 'all' ? all[director.idx++ % all.length] : FORCE;
    else do { name = chance(0.13) ? weighted(RARE) : weighted(COMMON); } while (name === director.last);
    if (!EVENTS[name]) { director.cool = 5; return; }
    director.last = director.name = name;
    director.cur = EVENTS[name]();
    try { director.cur.next(0); } catch (e) { console.error(name, e); director.cur = null; cleanup(); }
  }
}
function cleanup() {
  for (const e of ents) e.dead = true;
  world.boost = 0; world.red = 0; world.steve = 0; world.snow = 0; scene.door = 0;
}

// ---------------------------------------------------------------- update + render
function updateAurora(dt) {
  const kp = kpNow(world.t);
  const elev = clamp(16 + 5.2 * kp + world.boost * 9, 13, 72) * rad;
  const Z0 = 1 / Math.tan(elev);
  const base = (0.13 + 0.085 * kp) * (1 + 1.4 * world.boost);
  const tZ = [Z0, Z0 * 1.9 + 1.2, Z0 * 3.4 + 3.5], tI = [base, base * (kp > 3 ? 0.32 : 0.16), kp > 5 ? base * 0.22 : 0];

  for (let i = 0; i < 3; i++) { world.arcs.Z[i] = lerp(world.arcs.Z[i], tZ[i], k); world.arcs.I[i] = lerp(world.arcs.I[i], tI[i], k); }

let lastSky = -99;
function update(dt) {

  for (const f of fx) f.t += dt;
  for (let i = fx.length - 1; i >= 0; i--) if (fx[i].t > fx[i].dur) fx.splice(i, 1);
  world.flash = Math.max(0, world.flash - dt * 1.2);
  // chimney smoke
  if (scene.cabin && chance(dt * 3)) { const c = scene.cabin.chim; addPart({ x: c.x, y: c.y - 8 * UNIT, vx: rand(2, 6) * UNIT, vy: -rand(5, 9) * UNIT, drag: 0.9, life: rand(5, 8), size: rand(2, 3.5) * UNIT, col: '#6c7a94', alpha: 0.16, layer: 'smoke', grow: 1.2 }); }

  if (world.snow > 0) for (let i = 0; i < world.snow * dt * 120 * (W / 1400); i++) { const z = rand(0.3, 1); addPart({ x: rand(-20, W + 20), y: -5, vx: rand(-8, 8), vy: 40 * z * UNIT, life: H / (40 * z * UNIT) + 1, size: z * 2.2 * UNIT, col: '#dfe8f7', alpha: 0.35 + 0.5 * z, layer: 'snow', z, ph: rand(0, TAU) }); }
}
function drawFx(kind, fn) { for (const f of fx) if (f.kind === kind) fn(f); }
function render() {
  const A = world.arcI || world.arcs.I;
  gl.uniform2f(U.uRes, cv.width, cv.height);
  gl.uniform1f(U.uScale, RS); gl.uniform1f(U.uHY, HY); gl.uniform1f(U.uF, F); gl.uniform1f(U.uW, W);
  gl.uniform1f(U.uPhase, world.phase); gl.uniform1f(U.uTime, world.t);

  gl.uniform1f(U.uRed, world.red); gl.uniform1f(U.uBoost, world.boost);
  gl.uniform1f(U.uMoonLight, sky.moonLight || 0); gl.uniform3fv(U.uMoonDir, sky.moon ? sky.moon.dir : [0, -1, 0]);

  gl.drawArrays(gl.TRIANGLES, 0, 3);

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  const t = world.t;
  // sky objects
  drawStars(t, false);
  drawMoon(false);
  drawFx('sat', f => { const x = f.x + f.vx * f.t, y = f.y + f.vy * f.t, fl = f.flare > 0 ? Math.exp(-(((f.t / f.dur - f.flare) * 14) ** 2)) : 0; ctx.fillStyle = '#e8eeff'; ctx.globalAlpha = 0.55 + fl * 0.45; ctx.beginPath(); ctx.arc(x, y, 0.8 + fl * 2.2, 0, TAU); ctx.fill(); ctx.globalAlpha = 1; });
  drawFx('meteor', f => {
    const k = f.t / f.dur, x = f.x + f.vx * f.t, y = f.y + f.vy * f.t, a = Math.sin(k * Math.PI) * f.bright, L = 0.16;
    const g = ctx.createLinearGradient(x, y, x - f.vx * L, y - f.vy * L);
    g.addColorStop(0, f.green ? `rgba(200,255,220,${a})` : `rgba(255,255,245,${a})`); g.addColorStop(1, 'rgba(160,200,255,0)');
    ctx.strokeStyle = g; ctx.lineWidth = 1.3 * UNIT; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - f.vx * L, y - f.vy * L); ctx.stroke();
  });
  drawFx('fireball', f => {
    const x = f.x + f.vx * f.t, y = f.y + f.vy * f.t, k = f.t / f.dur;
    if (k < 1) f.trail.push([x, y, f.t]);
    ctx.lineCap = 'round';
    for (let i = 1; i < f.trail.length; i++) {
      const [x0, y0, t0] = f.trail[i - 1], [x1, y1] = f.trail[i], age = f.t - t0;
      ctx.strokeStyle = `rgba(170,190,220,${clamp(0.35 - age * 0.03, 0, 0.35)})`; ctx.lineWidth = (2 + age * 1.5) * UNIT;
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
    }
    if (k < 1) {
      const g = ctx.createRadialGradient(x, y, 0, x, y, 22 * UNIT);
      g.addColorStop(0, 'rgba(255,255,240,1)'); g.addColorStop(0.2, 'rgba(160,255,190,0.8)'); g.addColorStop(1, 'rgba(80,200,140,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, 22 * UNIT, 0, TAU); ctx.fill();
      if (chance(0.3)) addPart({ x, y, vx: f.vx * 0.6 + rand(-40, 40), vy: f.vy * 0.6 + rand(-20, 40), life: rand(0.3, 0.7), size: 1.6 * UNIT, col: '#fff6c0', alpha: 1, layer: 'sky' });
    }
  });
  for (const p of parts) if (p.layer === 'sky') { ctx.globalAlpha = p.alpha * (1 - p.t / p.life); ctx.fillStyle = p.col; ctx.fillRect(p.x, p.y, p.size, p.size); }
  ctx.globalAlpha = 1;
  // mountains, treeline, cabin
  ctx.drawImage(scene.top, 0, 0, W, scene.top.height / DPR);
  if (world.glow > 0.02 || world.flash > 0.01) {
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = clamp(world.glow * 0.16 + world.flash * 0.25, 0, 0.6);

  for (const p of parts) if (p.layer === 'smoke') { const k = p.t / p.life; ctx.globalAlpha = p.alpha * Math.sin(k * Math.PI); ctx.fillStyle = p.col; ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (1 + k * 3), 0, TAU); ctx.fill(); }

  for (const e of ents) if (e.layer === 'water') { drawLamp(e); e.draw(); }
  drawFx('wake', f => { const k = f.t / f.dur; ctx.strokeStyle = `rgba(150,170,200,${0.25 * (1 - k)})`; ctx.lineWidth = 1; ctx.beginPath(); ctx.ellipse(f.x, f.y, f.r * (1 + k * 3), f.r * (0.12 + k * 0.3), 0, 0, TAU); ctx.stroke(); });
  drawFx('ring', f => { const k = f.t / f.dur; ctx.strokeStyle = `rgba(150,170,200,${0.35 * (1 - k)})`; ctx.lineWidth = 1; ctx.beginPath(); ctx.ellipse(f.x, f.y, f.r * (0.3 + k * 2.5), f.r * (0.06 + k * 0.4), 0, 0, TAU); ctx.stroke(); });

  ctx.globalAlpha = 1;
  ctx.drawImage(scene.trees, 0, 0, W, H);
  for (const e of ents) if (e.layer === 'front') e.draw();
  drawFx('flash', f => { const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, 60 * UNIT); g.addColorStop(0, `rgba(230,240,255,${0.9 * (1 - f.t / f.dur)})`); g.addColorStop(1, 'rgba(230,240,255,0)'); ctx.fillStyle = g; ctx.fillRect(f.x - 60 * UNIT, f.y - 60 * UNIT, 120 * UNIT, 120 * UNIT); });
  drawFx('howl', f => { const k = f.t / f.dur; ctx.strokeStyle = `rgba(200,215,240,${0.45 * Math.sin(k * Math.PI)})`; ctx.lineWidth = 1; for (let i = 0; i < 3; i++) { const r = (8 + i * 7 + k * 10) * UNIT; ctx.beginPath(); ctx.arc(f.x, f.y, r, -1.2, -0.5); ctx.stroke(); } });
  for (const p of parts) if (p.layer === 'snow') { const tw = Math.sin(t * 1.5 + p.ph) * 12 * p.z; ctx.globalAlpha = p.alpha; ctx.fillStyle = p.col; ctx.beginPath(); ctx.arc(p.x + tw, p.y, p.size / 2, 0, TAU); ctx.fill(); }

  if (world.flash > 0.01) { ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = `rgba(90,140,120,${world.flash * 0.2})`; ctx.fillRect(0, 0, W, H); ctx.globalCompositeOperation = 'source-over'; }

}
function drawCabinLights(t, mirror) {
  const cab = scene.cabin; if (!cab) return;
  const fl = 0.85 + 0.1 * Math.sin(t * 7.3) * Math.sin(t * 3.1) + 0.05 * Math.sin(t * 17);
  const w = cab.win, d = cab.door;
  const Y = y => (mirror ? HY * 2 - y : y);

  ctx.fillRect(w.x, mirror ? Y(w.y + w.h) : w.y, w.w, w.h);
  if (scene.door > 0) ctx.fillRect(d.x, mirror ? Y(d.y + d.h) : d.y, d.w * scene.door, d.h);
  const g = ctx.createRadialGradient(w.x + w.w / 2, Y(w.y + w.h / 2), 0, w.x + w.w / 2, Y(w.y + w.h / 2), 26 * UNIT);
  g.addColorStop(0, `rgba(255,180,90,${0.25 * fl})`); g.addColorStop(1, 'rgba(255,180,90,0)');

function drawReflections(t) {

  ctx.beginPath(); ctx.rect(0, HY, W, SHORE - HY + H * 0.1); ctx.clip();
  drawStars(t, true);
  drawMoon(true);

  ctx.globalAlpha = 0.5;
  for (let y = HY; y < SHORE + H * 0.02; y += strip) {
    const dy = y - HY, srcY = HY - dy - strip;
    if (srcY < 0) break;
    const amp = (0.15 + dy * 0.012) * UNIT, off = Math.sin(y * 0.21 + t * 1.1) * amp + Math.sin(y * 0.063 - t * 0.5) * amp * 0.7;

  }

  ctx.translate(0, HY * 2); ctx.scale(1, -1);
  for (const e of ents) if (e.reflect && e.layer === 'far') e.draw();
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalAlpha = 1;
  // warm streak of the cabin window on the water
  const cab = scene.cabin;
  if (cab) {
    const x = cab.win.x + cab.win.w / 2;
    for (let i = 0; i < 26; i++) {
      const y = HY + 2 + i * 2.2 * UNIT, w = (cab.win.w * 0.8 + i * 0.5) * (0.6 + 0.4 * Math.sin(t * 2 + i * 1.7));
      ctx.fillStyle = `rgba(255,170,80,${0.32 * (1 - i / 26)})`; ctx.fillRect(x - w / 2 + Math.sin(t * 1.4 + i) * UNIT, y, w, 1);

  }

    ctx.save(); ctx.globalAlpha = 0.35; ctx.translate(0, e.y * 2); ctx.scale(1, -1); e.draw(); ctx.restore();
  }
  ctx.fillStyle = 'rgba(2,5,10,0.18)'; ctx.fillRect(0, HY, W, SHORE - HY + H * 0.1);   // water is darker than the air
  ctx.restore();
}
function drawLamp(e) {
  if (!e.lamp) return;
  const x = e.x + e.f * 0.5 * e.s, y = e.y - 15 * e.s, dir = e.f;
  const sweep = Math.sin(world.t * 0.4) * 0.3;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const L = 90 * e.s, a0 = (dir > 0 ? 0 : Math.PI) + sweep + 0.25 * dir;
  const g = ctx.createRadialGradient(x, y, 0, x, y, L);
  g.addColorStop(0, 'rgba(255,245,210,0.35)'); g.addColorStop(1, 'rgba(255,245,210,0)');

  ctx.fillStyle = 'rgba(255,250,230,0.9)'; ctx.beginPath(); ctx.arc(x, y, 1.2 * UNIT, 0, TAU); ctx.fill();
  for (let i = 0; i < 18; i++) { ctx.fillStyle = `rgba(255,240,200,${0.25 * (1 - i / 18)})`; ctx.fillRect(x - 2 + Math.sin(world.t * 2 + i) * UNIT, e.y + 2 + i * 2 * UNIT * e.s * 2, 4, 1); }

}
function drawSparkles(t) {
  if (!scene.sparkles) { scene.sparkles = []; for (let i = 0; i < W / 10; i++) { const x = rand(0, W); scene.sparkles.push({ x, y: rand(bankTop(x) + 6, H), ph: rand(0, TAU), sp: rand(0.3, 1.2) }); } }
  ctx.fillStyle = '#dce8ff';
  for (const s of scene.sparkles) { const a = Math.pow(Math.max(0, Math.sin(t * s.sp + s.ph)), 30); if (a < 0.05) continue; ctx.globalAlpha = a * 0.8; ctx.fillRect(s.x, s.y, 1.2, 1.2); }

}
function drawHud() {
  if (HUD === 'off') return;
  const kp = kpNow(world.t), m = 26, right = HUD.includes('r'), top = HUD.includes('t');
  const x = right ? W - m : m, y = top ? m : H - m - 44;
  const src = KP_FORCE !== null ? 'Kp set by #kp' : live.state === 'live' ? `Live from NOAA SWPC · ${Math.max(1, Math.round((Date.now() - live.time) / 60000))} min ago` : live.state === 'cache' ? 'NOAA SWPC (cached)' : 'Offline · a typical night';
  const moon = sky.moon ? `Moon ${Math.round(sky.moon.illum * 100)}% ${sky.moon.illum > 0.97 ? 'full' : sky.moon.illum < 0.03 ? 'new' : sky.moon.waxing ? 'waxing' : 'waning'}${sky.moon.alt < 0 ? ' · below horizon' : ''}` : '';

  ctx.font = '400 11px -apple-system, "SF Pro Text", "Helvetica Neue", Arial, sans-serif';
  ctx.fillStyle = 'rgba(190,210,230,0.42)';
  ctx.fillText(src, x, y + 17);
  ctx.fillText(`Sky over ${OBS_LAT === 69.65 && OBS_LON === 18.96 ? 'Tromsø' : `${OBS_LAT.toFixed(1)}°, ${OBS_LON.toFixed(1)}°`} right now${moon ? ' · ' + moon : ''}`, x, y + 32);
  if (DEBUG) ctx.fillText(`event ${director.name || '-'} · ents ${ents.length} · parts ${parts.length} · ${perf.ms.toFixed(1)} ms · arcs ${world.arcs.Z.map(v => v.toFixed(1)).join('/')}`, x, top ? y + 48 : y - 16);
  ctx.restore();
}

// ---------------------------------------------------------------- resize + loop
function resize() {
  DPR = window.devicePixelRatio || 1;
  W = innerWidth; H = innerHeight;
  RS = QUALITY === 'high' ? DPR : QUALITY === 'low' ? 0.5 : Math.min(DPR, 1) * 0.75;
  cv.width = Math.round(W * RS); cv.height = Math.round(H * RS);
  ov.width = Math.round(W * DPR); ov.height = Math.round(H * DPR);
  gl.viewport(0, 0, cv.width, cv.height);
  UNIT = H / 900; HY = Math.round(H * 0.63); F = H * 0.62; SHORE = Math.round(H * 0.86);
  ents.length = 0; parts.length = 0; fx.length = 0;
  director.cur = null; director.cool = 6;
  cleanup();
  const A = astro(Date.now());
  updateSky(A);
  scene.moonK = clamp(sky.moonLight || 0, 0, 1);
  scene.moonSide = sky.moon && sky.moon.dir[0] > 0 ? 1 : -1;
  scene.sparkles = null;
  buildLandscape();
  lastSky = -99;
}
scene.seed0 = seed;
buildFaintStars();
addEventListener('resize', resize);
resize();
const perf = { ms: 0 };
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  if (now - last < 1000 / FPS - 1) return;
  const dt = Math.min(0.1, (now - last) / 1000) * TIME_SCALE;
  last = now;
  const t0 = performance.now();
  try { update(dt); render(); } catch (e) { console.error(e); }
  perf.ms = lerp(perf.ms, performance.now() - t0, 0.1);
}
requestAnimationFrame(frame);
</script>
