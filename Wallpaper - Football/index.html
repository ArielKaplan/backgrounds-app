<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Pixel Football Wallpaper</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a3a1a; }
  canvas { width: 100vw; height: 100vh; display: block; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* =====================================================================
   PIXEL BOWL — a retro 8-bit football game that plays itself
   Two random teams play four short quarters, then a new game starts.
   Options (add to the end of the address):
     #pixels=200        vertical resolution in big pixels
     #quarter=2         minutes of game clock per quarter
     #teams=BAY-MTN     pick the two teams (3-letter codes)
     #weather=snow      clear rain snow fog wind night
     #play=flea         force the offense's play call (see PLAYS)
     #event=animal      make a sideshow happen often: animal injury penalty
     #speed=3           run time faster (for testing)
     #debug             show debug info
   ===================================================================== */
const params = new URLSearchParams(location.hash.slice(1));
const ROWS = parseInt(params.get('pixels')) || 200;
const QLEN = (parseFloat(params.get('quarter')) || 2) * 60;
const FORCE_TEAMS = params.get('teams');
const FORCE_WEATHER = params.get('weather');
const FORCE_PLAY = params.get('play');
const FORCE_EVENT = params.get('event');
const TIME_SCALE = parseFloat(params.get('speed')) || 1;
const DEBUG = params.has('debug');
const FPS = 30;
const PXY = 6, PYY = 3, FIELD_W = 53.33, HUDH = 13, MARG = 60;   // pixels per yard along / across the field

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, FY;   // FY = screen y of the far sideline

// ---------------------------------------------------------------- utils
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const chance = p => Math.random() < p;
const coin = () => (Math.random() < 0.5 ? 1 : -1);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function weighted(obj) {
  const e = Object.entries(obj).filter(([, w]) => w > 0);
  let r = Math.random() * e.reduce((a, [, w]) => a + w, 0);
  for (const [k, w] of e) if ((r -= w) < 0) return k;
  return e[0][0];
}
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v + 0.5) / 16);
const bayer = (x, y) => BAYER[((y & 3) * 4) + (x & 3)];
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
const hexRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
function mixHex(a, b, t) { const A = hexRgb(a), B = hexRgb(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * t))})`; }
function shade(hex, k) { return `rgb(${hexRgb(hex).map(v => clamp(Math.round(v * k), 0, 255))})`; }
function hash(a, b, c = 0) { let h = (a * 374761393 + b * 668265263 + c * 982451653) | 0; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function px(x, y, c) { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), 1, 1); }
function rect(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }
function* wait(s) { while (s > 0) s -= yield; }
function* until(fn, max = 60) { while (!fn() && max > 0) max -= yield; }

// ---------------------------------------------------------------- pixel font (3x5)
const FONT = {
  A: '.X.X.XXXXX.XX.X', B: 'XX.X.XXX.X.XXX.', C: '.XXX..X..X...XX', D: 'XX.X.XX.XX.XXX.', E: 'XXXX..XX.X..XXX', F: 'XXXX..XX.X..X..',
  G: '.XXX..X.XX.X.XX', H: 'X.XX.XXXXX.XX.X', I: 'XXX.X..X..X.XXX', J: '..X..X..XX.X.X.', K: 'X.XX.XXX.X.XX.X', L: 'X..X..X..X..XXX',
  M: 'X.XXXXXXXX.XX.X', N: 'XX.X.XX.XX.XX.X', O: '.X.X.XX.XX.X.X.', P: 'XX.X.XXX.X..X..', Q: '.X.X.XX.XXX..XX', R: 'XX.X.XXX.X.XX.X',
  S: '.XXX...X...XXX.', T: 'XXX.X..X..X..X.', U: 'X.XX.XX.XX.XXXX', V: 'X.XX.XX.XX.X.X.', W: 'X.XX.XXXXXXXX.X', X: 'X.XX.X.X.X.XX.X',
  Y: 'X.XX.X.X..X..X.', Z: 'XXX..X.X.X..XXX', 0: 'XXXX.XX.XX.XXXX', 1: '.X.XX..X..X.XXX', 2: 'XX...X.X.X..XXX', 3: 'XX...X.X...XXX.',
  4: 'X.XX.XXXX..X..X', 5: 'XXXX..XX...XXX.', 6: '.XXX..XXXX.XXXX', 7: 'XXX..X.X..X..X.', 8: 'XXXX.XXXXX.XXXX', 9: 'XXXX.XXXX..XXX.',
  '!': '.X..X..X.....X.', '-': '......XXX......', '.': '.............X.', '?': 'XX...X.X.....X.', ' ': '...............', ':': '....X.....X....',
  '&': '.X.X.X.X.X.X.XX', '+': '....X.XXX.X....', "'": '.X..X..........', '/': '..X..X.X.X..X..', '#': 'X.XXXXX.XXXXX.X',
};
const textW = (s, sc = 1) => (String(s).length * 4 - 1) * sc;
function text(str, x, y, col = '#ffffff', shadow = '#10141a', sc = 1, g = ctx) {
  str = String(str).toUpperCase();
  const draw = (ox, oy, c) => { g.fillStyle = c; for (let i = 0; i < str.length; i++) { const gl = FONT[str[i]] || FONT['?']; for (let k = 0; k < 15; k++) if (gl[k] === 'X') g.fillRect(Math.round(x + ox + (i * 4 + (k % 3)) * sc), Math.round(y + oy + Math.floor(k / 3) * sc), sc, sc); } };
  if (shadow) draw(sc, sc, shadow);
  draw(0, 0, col);
}
const textC = (s, cx, y, col, shadow, sc = 1, g) => text(s, Math.round(cx - textW(s, sc) / 2), y, col, shadow, sc, g);

// ---------------------------------------------------------------- teams (all made up)
const TEAMS = [
  { city: 'BAYSIDE', name: 'GULLS', ab: 'BAY', c1: '#2a5ab8', c2: '#f4f4f4', helm: '#2a5ab8', stripe: '#ffd23a' },
  { city: 'MOUNTAIN', name: 'GOATS', ab: 'MTN', c1: '#6a4a2a', c2: '#e8d8b0', helm: '#e8d8b0', stripe: '#6a4a2a' },
  { city: 'NEON CITY', name: 'VOLTS', ab: 'NEO', c1: '#1a1a24', c2: '#c8ff3a', helm: '#1a1a24', stripe: '#c8ff3a' },
  { city: 'RIVERTON', name: 'OTTERS', ab: 'RIV', c1: '#1a7a6a', c2: '#ffb040', helm: '#1a7a6a', stripe: '#ffffff' },
  { city: 'DESERT', name: 'SCORPIONS', ab: 'DES', c1: '#d8702a', c2: '#3a2a1a', helm: '#3a2a1a', stripe: '#d8702a' },
  { city: 'NORTHWOOD', name: 'MOOSE', ab: 'NWD', c1: '#2a5a2a', c2: '#f0e8d0', helm: '#2a5a2a', stripe: '#f0e8d0' },
  { city: 'CAPITAL', name: 'EAGLES', ab: 'CAP', c1: '#b02a3a', c2: '#ffffff', helm: '#ffffff', stripe: '#1a2a6a' },
  { city: 'GLACIER', name: 'YETIS', ab: 'GLA', c1: '#8ad0f0', c2: '#1a3a6a', helm: '#f4f8ff', stripe: '#1a3a6a' },
  { city: 'SUNSET', name: 'FLAMINGOS', ab: 'SUN', c1: '#ff7ab0', c2: '#2a2a3a', helm: '#ff7ab0', stripe: '#ffffff' },
  { city: 'IRONTON', name: 'ANVILS', ab: 'IRN', c1: '#5a5e6a', c2: '#ff5a2a', helm: '#5a5e6a', stripe: '#ff5a2a' },
  { city: 'PRAIRIE', name: 'BISON', ab: 'PRA', c1: '#7a2a2a', c2: '#e8c060', helm: '#e8c060', stripe: '#7a2a2a' },
  { city: 'HARBOR', name: 'KRAKEN', ab: 'HAR', c1: '#3a2a7a', c2: '#3ac8b0', helm: '#3a2a7a', stripe: '#3ac8b0' },
  { city: 'MAPLE', name: 'BEAVERS', ab: 'MAP', c1: '#c83a2a', c2: '#2a2a2a', helm: '#c83a2a', stripe: '#2a2a2a' },
  { city: 'SWAMP', name: 'GATORS', ab: 'SWP', c1: '#4a8a2a', c2: '#e8e060', helm: '#4a8a2a', stripe: '#e8e060' },
  { city: 'SKYLINE', name: 'ROCKETS', ab: 'SKY', c1: '#e8e8f0', c2: '#e8302a', helm: '#e8e8f0', stripe: '#e8302a' },
  { city: 'VOLCANO', name: 'MAGMA', ab: 'VOL', c1: '#2a1a1a', c2: '#ff8a1a', helm: '#ff8a1a', stripe: '#2a1a1a' },
];
const WEATHER = { clear: 5, rain: 1.3, snow: 1, fog: 0.8, wind: 1, night: 1.4 };

// ---------------------------------------------------------------- world, particles, text popups, banners
const world = { t: 0, parts: [], fx: [], flash: 0, shake: 0, cheer: 0, banner: null, weather: 'clear', snowCover: 0 };
function addPart(x, y, vx, vy, life, col, o = {}) {   // x, y in pixels (world space, not screen)
  if (world.parts.length > 900) world.parts.splice(0, 120);
  world.parts.push({ x, y, vx, vy, life, max: life, col, drag: o.drag ?? 1, grav: o.grav ?? 0, size: o.size || 1, fade: o.fade ?? true, screen: o.screen ?? false, floor: o.floor ?? null, flutter: o.flutter ?? 0, ph: rand(0, 6.28) });
}
function addFx(f) { f.t = f.t ?? 0; f.layer = f.layer || 'front'; world.fx.push(f); return f; }
function later(fn, secs) { addFx({ dur: secs, layer: 'none', done: fn }); }
function popText(wx, wy, s, col = '#ffffff', dur = 1.4) {   // world pixels
  addFx({ layer: 'front', dur, draw(f) { if (f.t > dur - 0.3 && Math.floor(f.t * 12) % 2) return; textC(s, wx - cam.x, wy - 6 - Math.min(1, f.t * 3) * 5, col); } });
}
function banner(title, sub = '', col = '#ffe040', dur = 2.6, sc = 2) { world.banner = { title, sub, col, t: 0, dur, sc }; }
function confetti(n = 60, cols = ['#ff5a8a', '#ffe040', '#5ac8ff', '#8aff6a', '#ffffff']) {
  for (let i = 0; i < n; i++) addPart(rand(0, W), rand(-20, 0), rand(-20, 20), rand(20, 60), rand(2, 4), pick(cols), { screen: true, flutter: 12, drag: 0.8 });
}

// ---------------------------------------------------------------- field (baked once per game)
const field = { cv: null, crowd: null, fans: [] };
const yx = yd => MARG + yd * PXY;          // yard line (0..120, goal lines at 10 and 110) -> world pixel x
const yy = yd => FY + yd * PYY;            // yards across the field (0 = far sideline) -> screen pixel y
function bakeField(home, away) {
  const w = 120 * PXY + MARG * 2, cv = mk(w, H), g = cv.getContext('2d');
  const R = (x, y, ww, hh, c) => { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), Math.round(ww), Math.round(hh)); };
  const top = yy(0), bot = yy(FIELD_W);
  // outer turf and track
  R(0, 0, w, H, '#2c6a2c');
  for (let y = top - 6; y < H; y += 1) for (let x = 0; x < w; x += 2) if (hash(x, y, 1) < 0.2) R(x + (y % 2), y, 1, 1, '#285f28');
  // grass stripes every 5 yards
  for (let k = 0; k < 24; k++) {
    const x0 = yx(k * 5), col = k % 2 ? '#3c8c3a' : '#358034';
    R(x0, top, 5 * PXY, bot - top, col);
    for (let y = top; y < bot; y += 2) for (let x = x0; x < x0 + 5 * PXY; x += 3) if (hash(x, y, 2) < 0.12) R(x, y, 1, 1, k % 2 ? '#43963f' : '#2f7630');
  }
  // end zones
  for (const [t, x0] of [[home, yx(0)], [away, yx(110)]]) {
    R(x0, top, 10 * PXY, bot - top, shade(t.c1, 0.8));
    for (let y = top; y < bot; y += 2) for (let x = x0; x < x0 + 10 * PXY; x++) if ((x + y) % 8 < 1) R(x, y, 1, 1, shade(t.c1, 0.7));
    const letters = t.name.slice(0, 8), cx = x0 + 5 * PXY, sc = 2, lh = 12, y0 = (top + bot) / 2 - (letters.length * lh) / 2;
    for (let i = 0; i < letters.length; i++) textC(letters[i], cx, y0 + i * lh, t.c2, shade(t.c1, 0.45), sc, g);
  }
  // lines, hash marks, numbers
  const white = '#f4f4ec';
  R(yx(0), top, 120 * PXY, 1, white); R(yx(0), bot, 120 * PXY + 1, 1, white);
  R(yx(0), top, 1, bot - top, white); R(yx(120), top, 1, bot - top + 1, white);
  for (let yd = 10; yd <= 110; yd++) {
    const x = yx(yd);
    if (yd % 5 === 0) { R(x, top, yd === 10 || yd === 110 ? 2 : 1, bot - top, white); continue; }
    R(x, top + 1, 1, 2, white); R(x, bot - 2, 1, 2, white);
    R(x, yy(23.6), 1, 2, white); R(x, yy(29.7), 1, 2, white);
  }
  for (let yd = 20; yd <= 100; yd += 10) {
    const n = String(yd <= 60 ? yd - 10 : 110 - yd), x = yx(yd);
    textC(n, x, yy(6), white, null, 2, g);
    textC(n, x, yy(FIELD_W - 6) - 10, white, null, 2, g);
  }
  // midfield logo: a big star in the home colours
  { const cx = yx(60), cy = (top + bot) / 2;
    for (let dy = -9; dy <= 9; dy++) for (let dx = -16; dx <= 16; dx++) { const r = Math.hypot(dx / 16, dy / 9); if (r <= 1) R(cx + dx, cy + dy, 1, 1, r > 0.86 ? home.c2 : r > 0.78 ? shade(home.c1, 0.6) : home.c1); }
    textC(home.ab, cx, cy - 4, home.c2, shade(home.c1, 0.4), 2, g); }
  // sideline strip, benches and coaches' area at the bottom
  R(0, bot + 1, w, H - bot - 1, '#2a2e36');
  for (let x = 0; x < w; x += 4) R(x, bot + 1, 2, 1, '#d8d8d0');
  for (const [t, x0] of [[home, yx(25)], [away, yx(70)]]) { R(x0, bot + 4, 25 * PXY, 3, shade(t.c1, 0.7)); R(x0, bot + 4, 25 * PXY, 1, t.c2); }
  field.cv = cv;
  bakeCrowd(home, away, w);
}
function bakeCrowd(home, away, w) {
  const cv = mk(w, FY), g = cv.getContext('2d');
  const R = (x, y, ww, hh, c) => { g.fillStyle = c; g.fillRect(x, y, ww, hh); };
  R(0, 0, w, FY, '#30303c');
  field.fans = [];
  const skin = ['#ffd2a8', '#e0a878', '#a86a42', '#6a4228', '#f0c090'];
  for (let y = HUDH + 2, row = 0; y < FY - 7; y += 4, row++) {
    R(0, y + 3, w, 1, '#24242e');
    for (let x = (row % 2) * 2; x < w; x += 4) {
      if (hash(x, y, 3) < 0.08) continue;
      const shirt = hash(x, y, 4) < 0.55 ? (x < w / 2 ? home.c1 : away.c1) : hash(x, y, 5) < 0.5 ? (x < w / 2 ? home.c2 : away.c2) : pick(['#e8e8e8', '#3a3a4a', '#c8483a', '#4a8ac8']);
      R(x, y + 1, 2, 2, shirt); R(x, y, 2, 1, pick(skin));
      if (hash(x, y, 6) < 0.25) field.fans.push({ x, y, shirt });
    }
  }
  R(0, FY - 6, w, 6, '#1e2a24'); R(0, FY - 6, w, 1, '#4a5a4a');
  for (let x = 20; x < w; x += 90) { R(x, FY - 5, 30, 4, '#e8e8e0'); R(x + 1, FY - 4, 28, 2, pick([home.c1, away.c1, '#c8302a'])); }
  field.crowd = cv;
}
function drawCrowd() {
  ctx.drawImage(field.crowd, Math.round(-cam.x), 0);
  const x0 = cam.x - 4, x1 = cam.x + W + 4, jump = world.cheer;
  for (const f of field.fans) {
    if (f.x < x0 || f.x > x1) continue;
    const ph = Math.sin(world.t * (6 + (f.x % 5)) + f.x);
    if (jump > 0.1 && ph > 1 - jump * 1.2) { rect(f.x - cam.x - 1, f.y - 1, 1, 1, f.shirt); rect(f.x - cam.x + 2, f.y - 1, 1, 1, f.shirt); }
    else if (ph > 0.97) rect(f.x - cam.x, f.y - 1, 1, 1, f.shirt);
  }
}

// ---------------------------------------------------------------- camera
const cam = { x: 0, tx: 0 };
function updateCamera(dt, focusX) {
  const w = 120 * PXY + MARG * 2;
  cam.tx = clamp(focusX - W / 2, 0, w - W);
  cam.x = lerp(cam.x, cam.tx, Math.min(1, dt * 3));
  if (world.shake > 0) cam.x += rand(-world.shake, world.shake);
}

// ---------------------------------------------------------------- sprite builder
const INK = '#10141a';
class SB {
  constructor(w, h) { this.w = w; this.h = h; this.g = new Array(w * h).fill(null); }
  set(x, y, c) { x = Math.round(x); y = Math.round(y); if (x >= 0 && y >= 0 && x < this.w && y < this.h) this.g[y * this.w + x] = c; return this; }
  get(x, y) { return x >= 0 && y >= 0 && x < this.w && y < this.h ? this.g[y * this.w + x] : null; }
  rect(x, y, w, h, c) { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) this.set(x + i, y + j, c); return this; }
  ell(cx, cy, rx, ry, c, sh) {
    for (let y = Math.floor(cy - ry - 1); y <= Math.ceil(cy + ry + 1); y++) for (let x = Math.floor(cx - rx - 1); x <= Math.ceil(cx + rx + 1); x++) {
      const dx = (x - cx) / (rx + 0.35), dy = (y - cy) / (ry + 0.35);
      if (dx * dx + dy * dy <= 1) this.set(x, y, sh && dx * 0.4 + dy * 0.9 > 0.45 ? sh : c);
    }
    return this;
  }
  pix(list, c) { for (const [x, y] of list) this.set(x, y, c); return this; }
  outline(c = INK) {
    const add = [];
    for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) if (!this.get(x, y) && (this.get(x - 1, y) || this.get(x + 1, y) || this.get(x, y - 1) || this.get(x, y + 1))) add.push([x, y]);
    for (const [x, y] of add) this.set(x, y, c);
    return this;
  }
}
function bake(b, ax, ay) {
  const r = mk(b.w, b.h), l = mk(b.w, b.h), rc = r.getContext('2d'), lc = l.getContext('2d');
  for (let y = 0; y < b.h; y++) for (let x = 0; x < b.w; x++) { const c = b.g[y * b.w + x]; if (!c) continue; rc.fillStyle = c; rc.fillRect(x, y, 1, 1); lc.fillStyle = c; lc.fillRect(b.w - 1 - x, y, 1, 1); }
  return { r, l, w: b.w, h: b.h, ax, ay };
}
function drawSpr(s, sx, sy, facing = 1, alpha = 1) {   // screen coords, feet at (sx, sy)
  const X = Math.round(sx - (facing > 0 ? s.ax : s.w - 1 - s.ax)), Y = Math.round(sy - s.ay);
  if (alpha < 1) ctx.globalAlpha = alpha;
  ctx.drawImage(facing > 0 ? s.r : s.l, X, Y);
  if (alpha < 1) ctx.globalAlpha = 1;
}

// ---------------------------------------------------------------- football players (face right, feet at 6,14)
const SKINS = ['#ffd2a8', '#e8b088', '#c08858', '#8a5a36', '#5e3a22'];
const BALL_BROWN = '#8a4a22';
const POSE_LIST = ['stand', 'run1', 'run2', 'carry1', 'carry2', 'crouch', 'throw', 'dive', 'down', 'cheer', 'kick', 'block', 'hurt'];
function playerSpr(t, pose, skin) {
  const b = new SB(15, 15), J = t.c1, JS = shade(t.c1, 0.7), P = t.c2, PS = shade(t.c2, 0.75), HM = t.helm, HS = shade(t.helm, 0.7), ST = t.stripe;
  const SO = '#f0f0ea', SH = '#1e1e22', MASK = '#b8bcc8';
  const head = (hx, hy, face = 1) => {
    b.ell(hx, hy, 2.6, 2.3, HM, HS);
    b.pix([[hx - 1, hy - 2], [hx, hy - 2], [hx + 1, hy - 2]], ST);
    b.set(hx + 1.6 * face, hy, skin); b.set(hx + 2.6 * face, hy - 0.5, MASK); b.set(hx + 2.6 * face, hy + 0.8, MASK);
  };
  const torso = (tx, ty) => { b.rect(tx - 4, ty - 2, 9, 2, J); b.ell(tx, ty + 1, 3.2, 2.4, J, JS); b.pix([[tx - 1, ty], [tx + 1, ty]], shade(J, 1.25)); };
  const legs = list => { for (const [x, y, c] of list) b.set(x, y, c); };
  const ball = (x, y) => { b.rect(x, y, 2, 1, BALL_BROWN); b.set(x + 2, y, '#6a3418'); b.set(x - 1, y, '#6a3418'); b.set(x + 1, y - 1, BALL_BROWN); b.set(x, y, '#f0e8d0'); };
  switch (pose) {
    case 'stand': case 'hurt':
      legs([[4, 10, P], [5, 10, P], [7, 10, P], [8, 10, P], [4, 11, PS], [8, 11, PS], [4, 12, SO], [8, 12, SO], [4, 13, SH], [5, 13, SH], [8, 13, SH], [9, 13, SH]]);
      torso(6, 6); b.pix([[1, 6], [1, 7]], J); b.set(1, 8, skin); b.pix([[11, 6], [11, 7]], J); b.set(11, 8, skin);
      head(6.5, 2.5);
      if (pose === 'hurt') { b.set(8, 2, '#ffffff'); }
      break;
    case 'run1': case 'carry1':

// ---------------------------------------------------------------- the game

// ---------------------------------------------------------------- play calling
function choosePlay() {

  if ((half || (late && lead >= -3 && lead <= 0 && G.clock < 10)) && ytg + 17 <= 52 && G.down >= 1) return 'fg';

}

// ---------------------------------------------------------------- quarters and the whole game
function* gameLoop() {
  for (;;) {
    newGame();
    G.phase = 'intro';
    const [A, B] = G.teams;
    cam.x = yx(60) - W / 2;
    banner(`${A.name} VS ${B.name}`, `${A.city} AT ${B.city}`.replace(/^(.*) AT (.*)$/, '$1 VS $2') + (world.weather !== 'clear' ? '  -  ' + WEATHER_TEXT[world.weather] : ''), '#ffffff', 3.5, 2);
    yield* wait(3.8);
    G.firstRecv = randi(0, 1);
    popText(yx(60), yy(20), `${G.teams[G.firstRecv].ab} WINS THE TOSS`, '#ffe040', 2);
    yield* wait(1.5);
    yield* kickoff(1 - G.firstRecv);
    while (!G.over) {
      if (G.clock <= 0) { yield* endQuarter(); continue; }
      yield* snapCycle();

}

function* maybeInjury(res) {
  if (!chance(FORCE_EVENT === 'injury' ? 0.4 : 0.03)) return;
  const victim = pick([res.carrier, S.tackler].filter(p => p && p.onField && p.team && p.team.off));
  if (!victim) return;
  G.clockRun = false; G.runoff = 0;
  victim.setPose('down', 99); victim.emote = 'sweat'; victim.emoteT = 99;
  banner('INJURY TIMEOUT', `#${victim.num} ${victim.name}`, '#ff8a8a', 2.4, 1);
  const cart = { x: victim.x - 12, y: FIELD_W + 3, t: 0, carry: false };
  const fx = { draw() { const s = cartSet()[Math.floor(cart.t * 8) % 2], sx = yx(cart.x) - cam.x, sy = yy(cart.y); drawSpr(s, sx, sy, 1); if (cart.carry) { rect(sx - 5, sy - 9, 8, 2, victim.team.c1); rect(sx + 3, sy - 10, 3, 3, victim.team.helm); } } };
  extras.push(fx);
  const others = onField.filter(p => p.team === victim.team && p !== victim).slice(0, 3);
  let t = 0;
  while (t < 12) {
    const dt = yield; t += dt;
    for (const p of others) { steer(p, victim.x + (p.x > victim.x ? 1.5 : -1.5), victim.y + (p.y > victim.y ? 1 : -1), 3, dt); p.update(dt); }
    const tx = victim.x - 1, ty = victim.y + 1.2, d = Math.hypot(tx - cart.x, ty - cart.y);
    if (!cart.carry) {
      if (d > 0.4) { cart.x += ((tx - cart.x) / d) * 6 * dt; cart.y += ((ty - cart.y) / d) * 6 * dt; cart.t += dt; }
      else if (t > 4) { cart.carry = true; victim.onField = false; onField.splice(onField.indexOf(victim), 1); victim.emoteT = 0; world.cheer = 0.8; popText(yx(cart.x), yy(cart.y) - 20, 'CLAP CLAP CLAP', '#ffffff', 1.6); }
    } else { cart.x += 6 * dt; cart.y += 4 * dt; cart.t += dt; if (cart.y > FIELD_W + 6) break; }
  }
  extras.splice(extras.indexOf(fx), 1);
  const sub = substitute(victim);
  victim.pose = null;
  if (sub) popText(yx(G.los), yy(20), `#${sub.num} ${sub.name} IS IN`, '#8ae4ff', 1.8);
}

// ---------------------------------------------------------------- celebrations, halftime, the winners' ice bath
function* celebrate(scorer) {
  const team = scorer.team, mates = onField.filter(p => p.team === team && p !== scorer), foes = onField.filter(p => p.team !== team);
  const style = pick(['spike', 'dance', 'leap', 'pile']);
  for (const p of foes) if (chance(0.6)) { p.emote = pick(['sweat', 'mad']); p.emoteT = 2; }
  const leapY = -2.5;
  let t = 0, spiked = false;
  while (t < 3.6) {
    const dt = yield; t += dt;
    if (style === 'spike' && !spiked && t > 0.4) { spiked = true; scorer.setPose('throw', 0.4); ball.x = scorer.x; ball.y = scorer.y; looseBall(scorer.x, scorer.y); ball.loose.vz = 9; popText(yx(scorer.x), yy(scorer.y) - 18, 'SPIKE!', '#ffffff', 1); }
    if (style === 'dance') scorer.setPose(Math.floor(t * 4) % 2 ? 'cheer' : 'stand', 0.3);
    if (style === 'leap') { if (scorer.y > leapY + 0.5) steer(scorer, scorer.x, leapY, 7, dt); else { scorer.setPose('cheer', 0.5); world.cheer = 2; } }
    if (style === 'pile') { brake(scorer, dt); scorer.setPose('cheer', 0.3); }
    if (style !== 'leap') brake(scorer, dt);
    for (const p of mates) { if (dist2(p, scorer) > 1.8) steer(p, scorer.x + (p.y > scorer.y ? 0.8 : -0.8), scorer.y + (p.y > scorer.y ? 1.2 : -1.2), p.speed * 0.8, dt); else p.setPose(style === 'pile' ? 'down' : 'cheer', 0.4); p.update(dt); }
    for (const p of foes) { brake(p, dt); p.update(dt); }
    scorer.update(dt); updateBall(dt);
  }
}
function* halftimeShow() {
  const home = G.teams[0], band = [];
  for (let r = 0; r < 4; r++) for (let c = 0; c < 8; c++) band.push({ r, c });
  onField.length = 0; ball.state = 'dead'; ball.hidden = true;
  const fx = { draw() {
    const x0 = 60 - 30 + band.t * 5;
    for (const b of band) {
      const sx = yx(x0 + b.c * 2.2) - cam.x, sy = yy(18 + b.r * 5), step = Math.floor(band.t * 4 + b.c) % 2;
      rect(sx - 1, sy - 6, 3, 4, b.r % 2 ? home.c1 : home.c2); rect(sx - 1, sy - 8, 3, 2, '#f4f4f4'); px(sx, sy - 9, home.c1);
      rect(sx - 1 + step, sy - 2, 1, 2, '#1e1e22'); rect(sx + 1 - step, sy - 2, 1, 2, '#1e1e22');
      if (b.r === 1) { px(sx + 2, sy - 5, '#ffd83a'); px(sx + 3, sy - 6, '#ffd83a'); }
    }
  }, y: 0 };
  band.t = 0;
  extras.push(fx);
  let t = 0;
  while (t < 12) { const dt = yield; t += dt; band.t = t; cam.tx = yx(60 - 30 + t * 5 + 8) - W / 2; if (chance(dt * 3)) popText(yx(60 - 30 + t * 5 + rand(0, 16)), yy(14), '♪', '#ffffff', 1); }
  extras.splice(extras.indexOf(fx), 1); ball.hidden = false;
}
function* gatorade(win) {
  const coach = new Guard(GUARD_T, 'S'); coach.x = S.los || 60; coach.y = FIELD_W + 1.5; coach.skin = 1;
  const a = new Player(win, 'OL'), b = new Player(win, 'OL');
  a.x = coach.x - 6; a.y = FIELD_W + 1; b.x = coach.x + 6; b.y = FIELD_W + 2;
  extras.push(coach, a, b);
  let t = 0, dumped = false;
  while (t < 4) {
    const dt = yield; t += dt;
    if (t < 1.8) { steer(a, coach.x - 1.5, coach.y - 0.3, 4, dt); steer(b, coach.x + 1.5, coach.y + 0.3, 4, dt); }
    else if (!dumped) { dumped = true; a.setPose('cheer', 1); b.setPose('cheer', 1); coach.setPose('hurt', 2);
      for (let i = 0; i < 50; i++) addPart(yx(coach.x) + rand(-4, 4), yy(coach.y) - 16, rand(-20, 20), rand(-10, 20), rand(0.5, 1.2), ['#ff9a1a', '#ffc04a', '#ffffff'], { grav: 120 });
      popText(yx(coach.x), yy(coach.y) - 24, 'SPLOOSH!', '#ffc04a', 1.6); }
    for (const p of [coach, a, b]) p.update(dt);
    for (const p of onField) p.update(dt);
  }
}

// @@EVENTS_END@@

// ---------------------------------------------------------------- field overlays, goalposts, HUD, banner
const KICK_NAMES = ['KICKOFF', 'ONSIDE KICK', 'PUNT', 'EXTRA POINT'];
function drawLines() {
  if (!['presnap', 'play'].includes(G.phase) || !S.off || KICK_NAMES.includes(G.playName) || G.playName.includes('FIELD GOAL')) return;
  const top = yy(0) + 1, bot = yy(FIELD_W), off = S.off;
  ctx.globalAlpha = 0.6;
  rect(yx(S.los) - cam.x, top, 1, bot - top, '#5a9aff');
  if (G.togo < yardsToGoal(S.los, off) && G.playName !== 'TWO POINT TRY') rect(yx(S.los + attackDir(off) * G.togo) - cam.x, top, 1, bot - top, '#ffe020');
  ctx.globalAlpha = 1;
}
function drawGoalposts() {
  for (const gx of [0, 120]) {
    const sx = Math.round(yx(gx) - cam.x), lean = gx === 0 ? -1 : 1;
    if (sx < -20 || sx > W + 20) continue;
    const y0 = yy(23.6), y1 = yy(29.7), yc = yy(26.67);
    rect(sx, yc - 10, 1, 10, '#c8a820');
    for (let y = y0; y <= y1; y++) rect(sx, y - 10, 1, 1, '#ffe040');
    for (let k = 0; k < 16; k++) { rect(sx + Math.round((lean * k) / 8), y0 - 10 - k, 1, 1, '#ffe040'); rect(sx + Math.round((lean * k) / 8), y1 - 10 - k, 1, 1, '#ffe040'); }
  }
}
const ORD = ['', '1ST', '2ND', '3RD', '4TH'];
function drawHUD() {
  rect(0, 0, W, HUDH, '#10141a'); rect(0, HUDH - 1, W, 1, '#3a4050');
  const [A, B] = G.teams;
  if (!A) return;
  const box = (t, s, x, side) => {
    rect(x, 1, 36, HUDH - 3, t.c1); rect(x, 1, 36, 1, shade(t.c1, 1.3));
    text(t.ab, x + 2, 3, t.c2, INK); const sc = String(s); text(sc, x + 34 - textW(sc), 3, '#ffffff', INK);
    if (G.poss === side && !G.over) { rect(x + 37, 5, 3, 2, BALL_BROWN); px(x + 38, 5, '#f0e8d0'); }
  };
  box(A, G.score[0], 2, 0); box(B, G.score[1], 44, 1);
  const m = Math.floor(G.clock / 60), s = Math.floor(G.clock % 60);
  text(G.over ? 'FINAL' : `${QNAMES[G.q]} ${m}:${String(s).padStart(2, '0')}`, 88, 3, G.clock < 15 && !G.over ? '#ff8a5a' : '#ffe040', INK);
  if (!G.over && G.teams[G.poss]) {
    const off = G.teams[G.poss], ytg = yardsToGoal(G.los, off);
    const dd = `${ORD[Math.min(4, G.down)]} & ${G.togo >= ytg ? 'GOAL' : Math.max(1, Math.round(G.togo))}`;
    text(dd, 136, 3, '#ffffff', INK);
    if (W > 250) text(spotName(G.los, off), 184, 3, '#a8b0c0', INK);
  }
  if (W > 300 && G.playName && ['presnap', 'play', 'dead'].includes(G.phase)) text(G.playName, W - 2 - textW(G.playName), 3, '#8ae4ff', INK);
}
function drawBanner() {
  const b = world.banner;
  if (!b) return;
  const k = Math.min(1, b.t * 5, (b.dur - b.t) * 5), cy = Math.round(FY + (H - FY) * 0.42), hgt = Math.round((b.sc * 5 + (b.sub ? 16 : 10)) * k);
  ctx.globalAlpha = 0.72; rect(0, cy - hgt / 2, W, hgt, '#0c1018'); ctx.globalAlpha = 1;
  if (k < 1) return;
  const flash = b.title.includes('TOUCHDOWN') && Math.floor(b.t * 6) % 2;
  let sc = b.sc; while (sc > 1 && textW(b.title, sc) > W - 8) sc--;
  textC(b.title, W / 2, cy - hgt / 2 + 4, flash ? '#ffffff' : b.col, INK, sc);
  if (b.sub) textC(b.sub, W / 2, cy - hgt / 2 + 6 + sc * 5, '#e8e8f0', INK, 1);
}

// ---------------------------------------------------------------- main loop
const _tickClock = tickClock, _updateRefs = updateRefs;
tickClock = () => {};        // the generators call these; the main loop runs each exactly once per frame instead
updateRefs = () => {};
let game = null;
function update(dt) {
  world.t += dt;
  if (world.banner && (world.banner.t += dt) > world.banner.dur) world.banner = null;
  world.cheer = Math.max(0, world.cheer - dt * 0.4); world.shake = Math.max(0, world.shake - dt * 3); world.flash = Math.max(0, world.flash - dt * 1.5);
  if (!game) game = gameLoop();
  try { game.next(dt); } catch (e) { console.error(e); game = gameLoop(); }
  if (G.phase === 'play') _tickClock(dt);
  _updateRefs(dt);
  let focus = yx(S.los || 60);
  if (ball.state === 'held' && ball.holder && G.phase !== 'presnap') focus = yx(ball.holder.x);
  else if (ball.state === 'air' || ball.state === 'loose' || ball.state === 'arrived') focus = yx(ball.x);
  if (G.phase === 'intro') focus = yx(60);
  updateCamera(dt, focus);
  updateWeather(dt);
  for (const p of world.parts) {
    p.life -= dt;
    if (p.drag !== 1) { const k = Math.pow(p.drag, dt); p.vx *= k; p.vy *= k; }
    p.vy += p.grav * dt; p.x += (p.vx + (p.flutter ? Math.sin(world.t * 4 + p.ph) * p.flutter : 0)) * dt; p.y += p.vy * dt;
  }
  for (const f of world.fx) f.t += dt;
  const done = world.fx.filter(f => f.t > f.dur && f.done);
  world.parts = world.parts.filter(p => p.life > 0 && (p.screen || p.y < H + 20));
  world.fx = world.fx.filter(f => f.t <= f.dur);
  for (const f of done) f.done();
}
function render(dt) {
  if (!field.cv) return;
  ctx.fillStyle = '#1a3a1a'; ctx.fillRect(0, 0, W, H);
  ctx.drawImage(field.cv, Math.round(-cam.x), 0);
  drawWeatherBack();
  drawCrowd();
  drawLines();
  const list = [...onField, ...refs, ...extras].sort((a, b) => (a.y ?? 99) - (b.y ?? 99));
  for (const e of list) if (e.draw) e.draw();
  drawBall();
  drawGoalposts();
  for (const p of world.parts) {
    const k = p.life / p.max, X = Math.round(p.screen ? p.x : p.x - cam.x), Y = Math.round(p.y);
    if (p.fade && k < 0.4 && bayer(X, Y) > k * 2.5) continue;
    ctx.fillStyle = Array.isArray(p.col) ? p.col[Math.min(p.col.length - 1, Math.floor((1 - k) * p.col.length))] : p.col;
    ctx.fillRect(X, Y, p.size, p.size);
  }
  for (const f of world.fx) if (f.layer === 'front' && f.t >= 0 && f.draw) f.draw(f);
  drawWeatherFront();
  drawBanner();
  drawHUD();
  if (world.flash > 0.01) { ctx.globalAlpha = world.flash * 0.5; rect(0, 0, W, H, '#ffffff'); ctx.globalAlpha = 1; }
  if (DEBUG) text(`${G.phase} ${S.call || ''} ${ball.state} ents:${onField.length} parts:${world.parts.length}`, 2, H - 7, '#7aff7a', INK);
}
function resize() {
  H = ROWS;
  W = Math.round((ROWS * innerWidth) / innerHeight);
  FY = H - Math.round(FIELD_W * PYY) - 9;
  canvas.width = W; canvas.height = H;
  ctx.imageSmoothingEnabled = false;
  if (G.teams.length) { bakeField(G.teams[0], G.teams[1]); resetWeatherFx(); }
}
addEventListener('resize', resize);
resize();

let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  if (now - last < 1000 / FPS - 1) return;
  const dt = Math.min(0.1, (now - last) / 1000) * TIME_SCALE;
  last = now;
  try { update(dt); render(dt); } catch (e) { console.error(e); }
}
requestAnimationFrame(frame);
</script>
