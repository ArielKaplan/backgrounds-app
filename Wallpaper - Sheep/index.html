<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Pixel Sheep Wallpaper</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9ad4f5; }
  canvas { width: 100vw; height: 100vh; display: block; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* =====================================================================
   PIXEL SHEEP — a flock of very fluffy, not very bright sheep
   Options (add to the end of the address):
     #pixels=190        vertical resolution in big pixels (smaller = bigger sheep)
     #event=follow      test mode: repeat one event (or "all" to cycle through every event)
     #speed=3           run time faster (for testing)
     #debug             show the current event name
   Events: follow stack butterfly chorus dog nap stuck ball pronk faint
   Rare:   shear wolf float count snow
   ===================================================================== */
const params = new URLSearchParams(location.hash.slice(1));
const ROWS = parseInt(params.get('pixels')) || 190;
const FORCE = params.get('event');
const TIME_SCALE = parseFloat(params.get('speed')) || 1;
const DEBUG = params.has('debug');
const FPS = 30, G = 420;

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, HY, GY;   // HY = horizon, GY = top of the ground strip the flock walks along

// ---------------------------------------------------------------- utils
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const chance = p => Math.random() < p;
const coin = () => (Math.random() < 0.5 ? 1 : -1);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function weighted(obj) {
  const e = Object.entries(obj).filter(([, w]) => w > 0);
  let r = Math.random() * e.reduce((a, [, w]) => a + w, 0);
  for (const [k, w] of e) if ((r -= w) < 0) return k;
  return e[0][0];
}
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v + 0.5) / 16);
const bayer = (x, y) => BAYER[((y & 3) * 4) + (x & 3)];
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
const hexRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
function mixHex(a, b, t) { const A = hexRgb(a), B = hexRgb(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * t))})`; }
function px(x, y, c) { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), 1, 1); }
function rect(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }
const PERM = Array.from({ length: 512 }, () => Math.random());
const h2 = (x, y) => PERM[((x * 73856093) ^ (y * 19349663)) & 511];
function noise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = h2(xi, yi), b = h2(xi + 1, yi), c = h2(xi, yi + 1), d = h2(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}

// ---------------------------------------------------------------- pixel font (3x5)
const FONT = {
  A: '.X.X.XXXXX.XX.X', B: 'XX.X.XXX.X.XXX.', C: '.XXX..X..X...XX', D: 'XX.X.XX.XX.XXX.', E: 'XXXX..XX.X..XXX', F: 'XXXX..XX.X..X..',
  G: '.XXX..X.XX.X.XX', H: 'X.XX.XXXXX.XX.X', I: 'XXX.X..X..X.XXX', J: '..X..X..XX.X.X.', K: 'X.XX.XXX.X.XX.X', L: 'X..X..X..X..XXX',
  M: 'X.XXXXXXXX.XX.X', N: 'XX.X.XX.XX.XX.X', O: '.X.X.XX.XX.X.X.', P: 'XX.X.XXX.X..X..', Q: '.X.X.XX.XXX..XX', R: 'XX.X.XXX.X.XX.X',
  S: '.XXX...X...XXX.', T: 'XXX.X..X..X..X.', U: 'X.XX.XX.XX.XXXX', V: 'X.XX.XX.XX.X.X.', W: 'X.XX.XXXXXXXX.X', X: 'X.XX.X.X.X.XX.X',
  Y: 'X.XX.X.X..X..X.', Z: 'XXX..X.X.X..XXX', 0: 'XXXX.XX.XX.XXXX', 1: '.X.XX..X..X.XXX', 2: 'XX...X.X.X..XXX', 3: 'XX...X.X...XXX.',
  4: 'X.XX.XXXX..X..X', 5: 'XXXX..XX...XXX.', 6: '.XXX..XXXX.XXXX', 7: 'XXX..X.X..X..X.', 8: 'XXXX.XXXXX.XXXX', 9: 'XXXX.XXXX..XXX.',
  '!': '.X..X..X.....X.', '-': '......XXX......', '.': '.............X.', '?': 'XX...X.X.....X.', ' ': '...............', '~': '...XX.X.XX.....',
};
const textW = s => s.length * 4 - 1;
function text(str, x, y, col = '#ffffff', shadow = '#3d3140') {
  str = String(str).toUpperCase();
  const draw = (ox, oy, c) => { ctx.fillStyle = c; for (let i = 0; i < str.length; i++) { const gl = FONT[str[i]] || FONT['?']; for (let k = 0; k < 15; k++) if (gl[k] === 'X') ctx.fillRect(Math.round(x + ox + i * 4 + (k % 3)), Math.round(y + oy + Math.floor(k / 3)), 1, 1); } };
  if (shadow) draw(1, 1, shadow);
  draw(0, 0, col);
}

// ---------------------------------------------------------------- world
const world = { t: 0, ents: [], parts: [], fx: [], dark: 0, gloom: 0, wind: 0.3, windBase: 0.3, gust: 0, snow: 0, snowCover: 0, flash: 0 };
function addPart(x, y, vx, vy, life, col, o = {}) {
  if (world.parts.length > 1200) world.parts.splice(0, 150);
  world.parts.push({ x, y, vx, vy, life, max: life, col, drag: o.drag ?? 1, grav: o.grav ?? 0, floor: o.floor ?? null, size: o.size || 1, fade: o.fade ?? true, wind: o.wind ?? 0, flutter: o.flutter ?? 0, glow: o.glow ?? false, ph: rand(0, 6.28) });
}
function addFx(f) { f.t = f.t ?? 0; f.layer = f.layer || 'front'; world.fx.push(f); return f; }
function later(fn, secs) { addFx({ dur: secs, layer: 'none', done: fn }); }
function popText(x, y, s, col = '#ffffff', dur = 1.4) {
  addFx({ layer: 'front', dur, draw(f) { if (f.t > dur - 0.3 && Math.floor(f.t * 12) % 2) return; text(s, Math.round(x - textW(s) / 2), Math.round(y - 6 - Math.min(1, f.t * 3) * 4), col); } });
}
function dust(x, y, n = 6, col = ['#e8dcc0', '#c8b890']) { for (let i = 0; i < n; i++) addPart(x + rand(-5, 5), y, rand(-14, 14), rand(-10, -2), rand(0.3, 0.6), col, { drag: 0.2 }); }
function woolFluff(x, y, n = 6) { for (let i = 0; i < n; i++) addPart(x + rand(-5, 5), y + rand(-4, 2), rand(-10, 10), rand(-14, -2), rand(0.8, 1.6), ['#ffffff', '#eeeaf4'], { drag: 0.5, grav: 8, flutter: 6 }); }

// ---------------------------------------------------------------- scenery
const scene = { bg: null, props: null, flowers: [], clouds: [], sun: { x: 0, y: 0 }, stars: [], tree: null };
let plats = [], GROUND, CLIFF, BOULDER, HAY_LOW, HAY_TOP, FENCE, STUMP, props = {};

function addPlat(x0, x1, y, kind, o = {}) { const p = { x0, x1, y, kind, ...o }; plats.push(p); return p; }
function layoutProps() {
  plats = []; props = {};
  GROUND = addPlat(-60, W + 60, GY, 'ground', { ground: true });
  const side = coin(), cw = 46, ch = 38;
  props.cliff = { side, x0: side < 0 ? -4 : W - cw, x1: side < 0 ? cw : W + 4, top: GY - ch };
  CLIFF = addPlat(props.cliff.x0, props.cliff.x1, GY - ch, 'cliff', { wall: side < 0 ? 'L' : 'R' });   // the screen edge acts like a wall
  const bw = 26, bh = 16, bx = side < 0 ? cw + 4 : W - cw - 4 - bw;
  props.boulder = { x: bx, w: bw, h: bh };
  BOULDER = addPlat(bx + 4, bx + bw - 4, GY - bh + 1, 'boulder');
  const a = side < 0 ? bx + bw + 8 : 8, b = side < 0 ? W - 8 : bx - 8;
  let items = shuffle(['hay', 'fence', 'stump']);
  const widths = { hay: 36, fence: 42, stump: 12 };
  if (items.reduce((s, k) => s + widths[k], 0) + 40 > b - a) items = items.filter(k => k !== 'stump');
  const free = (b - a) - items.reduce((s, k) => s + widths[k], 0), gap = free / (items.length + 1);
  let x = a + gap;
  for (const k of items) {
    const X = Math.round(x + rand(-gap * 0.25, gap * 0.25));
    if (k === 'hay') {
      const dir = coin();
      props.hay = { x: X, dir };
      if (dir > 0) { HAY_LOW = addPlat(X, X + 18, GY - 10, 'hay', { wall: 'R' }); HAY_TOP = addPlat(X + 18, X + 36, GY - 21, 'hay'); }
      else { HAY_LOW = addPlat(X + 18, X + 36, GY - 10, 'hay', { wall: 'L' }); HAY_TOP = addPlat(X, X + 18, GY - 21, 'hay'); }
    } else if (k === 'fence') {
      props.fence = { x: X, w: 42 };
      FENCE = addPlat(X, X + 42, GY - 15, 'fence', { thin: true });
    } else {
      props.stump = { x: X };
      STUMP = addPlat(X + 1, X + 11, GY - 8, 'stump');
    }
    x += widths[k] + gap;
  }
}
const staticPlats = () => plats;

function buildBackground() {
  const s = mk(W, H), c = s.getContext('2d'), img = c.createImageData(W, H), d = img.data;
  const set = (x, y, col) => { if (x < 0 || y < 0 || x >= W || y >= H) return; const o = (y * W + x) * 4; d[o] = col[0]; d[o + 1] = col[1]; d[o + 2] = col[2]; d[o + 3] = 255; };
  const top = hexRgb('#62b6ee'), mid = hexRgb('#9fd8fa'), bot = hexRgb('#e2f5ff');
  for (let y = 0; y < H; y++) {
    const t = clamp(y / (HY + 6), 0, 1);
    for (let x = 0; x < W; x++) {
      const q = clamp(Math.floor(t * 8 + bayer(x, y) - 0.5), 0, 8) / 8;
      set(x, y, q < 0.65 ? top.map((v, i) => lerp(v, mid[i], q / 0.65)) : mid.map((v, i) => lerp(v, bot[i], (q - 0.65) / 0.35)));
    }
  }
  const far = ['#bde3b6', '#b0dcaa'].map(hexRgb), midc = ['#9fd48c', '#93cc80', '#88c476'].map(hexRgb);
  const field = ['#86c86a', '#7ec163', '#77ba5c'].map(hexRgb), gnd = ['#72b956', '#6ab14f', '#63a949', '#5ca243'].map(hexRgb);
  const s1 = rand(0, 50), s2 = rand(0, 50), s3 = rand(0, 50), farTop = [], midTop = [];
  const ridge = (x, base, amp, f, seed) => base + Math.sin(x * f + seed) * amp + (noise(x * f * 3 + seed, seed) - 0.5) * amp * 1.4;
  for (let x = 0; x < W; x++) {
    const yf = Math.round(ridge(x, HY - 14, 7, 0.018, s1)), ym = Math.round(ridge(x, HY - 2, 5, 0.03, s2)), yn = Math.round(ridge(x, HY + 14, 3, 0.04, s3));
    farTop[x] = yf; midTop[x] = ym;
    for (let y = yf; y < ym; y++) set(x, y, far[bayer(x, y) < (y - yf) / (ym - yf + 1) ? 1 : 0]);
    for (let y = ym; y < yn; y++) set(x, y, midc[clamp(Math.floor(((y - ym) / (yn - ym + 1)) * 3 + bayer(x, y) - 0.5), 0, 2)]);
    for (let y = yn; y < GY; y++) set(x, y, field[clamp(Math.floor(((y - yn) / (GY - yn)) * 3 + bayer(x, y) - 0.5), 0, 2)]);
    for (let y = GY; y < H; y++) set(x, y, gnd[clamp(Math.floor(((y - GY) / (H - GY)) * 4 + bayer(x, y) - 0.5), 0, 3)]);
    set(x, GY, hexRgb('#8ed06e'));
  }
  const dark = hexRgb('#4f9440'), light = hexRgb('#94d677');
  for (let i = 0; i < W * 1.2; i++) { const x = randi(0, W - 1), y = randi(HY + 16, H - 1); set(x, y, chance(0.5) ? light : dark); if (y > GY + 3 && chance(0.4)) { set(x - 1, y - 1, dark); set(x + 1, y - 1, dark); } }
  c.putImageData(img, 0, 0);
  const P = (x, y, w, h, col) => { c.fillStyle = col; c.fillRect(Math.round(x), Math.round(y), w, h); };
  // tiny far trees
  for (let i = 0; i < W / 26; i++) {
    const x = randi(3, W - 3), t = farTop[x], r = randi(2, 3);
    P(x, t + 1 - 1, 1, 2, '#8cbf88');
    for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) if (dx * dx + dy * dy <= r * r + 1) P(x + dx, t - r + dy, 1, 1, dx + dy < -1 ? '#b4dfae' : '#93c78e');
  }
  // a little red barn and silo on the hill, away from the cliff
  const bx = props.cliff.side < 0 ? Math.round(W * rand(0.55, 0.8)) : Math.round(W * rand(0.2, 0.45)), by = midTop[bx] + 3;
  P(bx, by - 10, 16, 10, '#c8503e'); P(bx + 12, by - 10, 4, 10, '#a83e30');
  for (let k = 0; k < 6; k++) P(bx - 1 + k, by - 11 - k, 18 - k * 2, 1, k % 2 ? '#8a3a36' : '#7a3030');
  P(bx + 5, by - 7, 6, 7, '#f4efe6'); P(bx + 6, by - 6, 4, 6, '#8a3a2e'); P(bx + 6, by - 6, 1, 1, '#f4efe6'); P(bx + 9, by - 6, 1, 1, '#f4efe6');
  P(bx + 18, by - 16, 5, 16, '#c8c4bc'); P(bx + 21, by - 16, 2, 16, '#a8a49c'); P(bx + 18, by - 18, 5, 2, '#8a8680'); P(bx + 19, by - 19, 3, 1, '#8a8680');
  // far away sheep dots on the hill
  for (let i = 0; i < 5; i++) { const x = clamp(bx + randi(-60, 60), 2, W - 3), y = midTop[x] + randi(4, 12); P(x, y, 2, 1, '#ffffff'); P(x + 2, y, 1, 1, '#4c4250'); }
  scene.bg = s;
  scene.stars = Array.from({ length: Math.round(W * HY / 160) }, () => ({ x: randi(0, W), y: randi(0, HY - 6), tw: rand(0.5, 3), ph: rand(0, 6.28), big: chance(0.08) }));
}

function buildProps() {
  const s = mk(W, H), c = s.getContext('2d');
  const P = (x, y, w, h, col) => { c.fillStyle = col; c.fillRect(Math.round(x), Math.round(y), w, h); };
  // ---- cliff with a tree
  { const C = props.cliff, face = C.side < 0 ? C.x1 : C.x0;
    const faceX = y => face - C.side * Math.round((y - C.top) * 0.14 + noise(y * 0.3, 5) * 2);
    // tree first (behind the grass lip)
    const tx = C.side < 0 ? 16 : W - 16, ty = C.top;
    scene.tree = { x: tx, y: ty - 26 };
    for (let y = ty - 20; y <= ty; y++) for (let dx = -1; dx <= 1; dx++) P(tx + dx, y, 1, 1, dx < 0 ? '#a0704a' : dx > 0 ? '#6a4428' : '#86583a');
    const blobs = [[0, -28, 11], [-8, -22, 8], [8, -21, 8], [-4, -34, 7], [5, -33, 7]];
    for (let dy = -42; dy <= -12; dy++) for (let dx = -18; dx <= 18; dx++) {
      let q = 9; for (const [bx, by, br] of blobs) q = Math.min(q, ((dx - bx) ** 2 + (dy - by) ** 2) / (br * br));
      if (q > 1) continue;
      const l = (dx + dy + 26) / 12 + bayer(dx + 64, dy + 64) * 0.5;
      P(tx + dx, ty + dy, 1, 1, l < -0.9 ? '#9ada72' : l < 0.3 ? '#68b654' : l < 1 ? '#529e46' : '#42883a');
    }
    for (let i = 0; i < 6; i++) { const [bx, by, br] = pick(blobs), a = rand(0, 6.28), r = rand(0.2, 0.8) * br; P(tx + bx + Math.cos(a) * r, ty + by + Math.sin(a) * r, 1, 1, '#ffb0c8'); }
    for (let y = C.top; y <= GY; y++) {
      const fx = faceX(y), x0 = C.side < 0 ? C.x0 : fx, x1 = C.side < 0 ? fx : C.x1;
      for (let x = x0; x <= x1; x++) {
        const edge = C.side < 0 ? fx - x : x - fx, strata = (y + Math.round(noise(x * 0.15, 2) * 3)) % 7 === 0;
        let col = bayer(x, y) < 0.5 ? '#a49484' : '#9a8a7a';
        if (strata) col = '#86786c';
        if (edge < 3) col = edge < 1 ? '#6e6258' : '#827468';
        if (noise(x * 0.4, y * 0.4) > 0.78) col = '#b8a898';
        P(x, y, 1, 1, col);
      }
    }
    const lip = C.side < 0 ? [C.x0, face + 1] : [face - 1, C.x1];
    for (let x = lip[0]; x <= lip[1]; x++) {
      P(x, C.top - 1, 1, 1, '#9ae07a'); P(x, C.top, 1, 2, '#7cc85e'); P(x, C.top + 2, 1, 1, '#5aa848');
      if (hash01(x, 3) < 0.25) P(x, C.top - 2, 1, 1, '#7cc85e');
    }
    for (let k = 0; k < 4; k++) { const x = face - C.side * randi(0, 2), len = randi(2, 5), y0 = C.top + 2 + k * 3; for (let j = 0; j < len; j++) P(x - C.side * (j > 2 ? 1 : 0), y0 + j, 1, 1, '#5aa848'); }
    for (let k = 0; k < 3; k++) { const x = randi(Math.max(4, C.x0 + 4), Math.min(W - 4, C.x1 - 4)); P(x, C.top - 2, 1, 1, pick(['#ffffff', '#ffd23a', '#ff8ac0'])); }
  }
  // ---- boulder
  { const B = props.boulder, cx = B.x + B.w / 2;
    for (let dy = -B.h; dy <= 0; dy++) for (let dx = -B.w / 2; dx <= B.w / 2; dx++) {
      const q = (dx / (B.w / 2)) ** 2 + ((dy + B.h * 0.42) / (B.h * 0.62)) ** 2;
      if (q > 1 || dy > 0) continue;
      const l = (dx * 0.8 + dy) / B.h + bayer(dx + 40, dy + 40) * 0.35;
      let col = l < -0.75 ? '#c2bec8' : l < -0.3 ? '#a8a4b0' : l < 0.15 ? '#8e8a98' : '#737080';
      if (q > 0.86) col = '#5e5a6a';
      if (dy < -B.h + 3 && q < 0.8 && bayer(dx + 3, dy) < 0.6) col = dy < -B.h + 2 ? '#8ed06e' : '#6cb454';
      P(cx + dx, GY + dy, 1, 1, col);
    }
  }
  // ---- haystack
  if (props.hay) {
    const { x, dir } = props.hay, bale = (bx, by) => {   // by = bottom
      P(bx, by - 10, 18, 11, '#8a6a2a'); P(bx + 1, by - 9, 16, 9, '#e8c460'); P(bx + 1, by - 9, 16, 2, '#f8e08a'); P(bx + 1, by - 2, 16, 2, '#c8a040');
      for (let k = 0; k < 14; k++) P(bx + 2 + hash01(bx + k, 5) * 14, by - 8 + hash01(bx, k) * 6, 1, 2, k % 2 ? '#d8b04a' : '#fff0a8');
      P(bx + 5, by - 9, 1, 9, '#a8702e'); P(bx + 12, by - 9, 1, 9, '#a8702e');
    };
    bale(x, GY); bale(x + 18, GY);
    bale(dir > 0 ? x + 18 : x, GY - 11);
    for (let k = 0; k < 10; k++) P(x + rand(-4, 40), GY - rand(0, 1), 2, 1, '#e8c460');
  }
  // ---- fence
  if (props.fence) {
    const { x, w } = props.fence;
    for (const ry of [GY - 15, GY - 8]) { P(x - 1, ry, w + 2, 2, '#9a6a3e'); P(x - 1, ry, w + 2, 1, '#c0905e'); }
    for (let k = 0; k <= w; k += 14) { const X = x + Math.min(k, w - 3); P(X, GY - 16, 3, 17, '#7a5230'); P(X, GY - 16, 1, 17, '#a8764a'); P(X, GY - 16, 3, 1, '#c89a6a'); }
  }
  // ---- stump
  if (props.stump) {
    const { x } = props.stump;
    P(x, GY - 7, 12, 8, '#7a4e2e'); P(x, GY - 7, 2, 8, '#9a6a42'); for (let k = 3; k < 12; k += 3) P(x + k, GY - 5, 1, 6, '#5e3a22');
    P(x - 1, GY - 9, 14, 3, '#5e3a22'); P(x, GY - 9, 12, 2, '#e0b884'); P(x + 3, GY - 9, 6, 1, '#c89a64'); P(x + 5, GY - 9, 2, 1, '#e0b884');
    P(x + 12, GY - 2, 1, 2, '#f4ead8'); P(x + 11, GY - 3, 3, 1, '#e8483a'); P(x + 11, GY - 3, 1, 1, '#ffffff');
  }
  scene.props = s;
}
function hash01(a, b) { let h = (a * 374761393 + b * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }

function buildFlowers() {
  scene.flowers = [];
  const n = Math.round(W / 5);
  for (let i = 0; i < n; i++) scene.flowers.push({ x: rand(2, W - 2), y: Math.round(rand(GY + 2, H - 2)), type: weighted({ grass: 5, daisy: 2, clover: 1.4, butter: 1.2, bell: 0.8 }), ph: rand(0, 6.28), eaten: 0 });
  scene.flowers.sort((a, b) => a.y - b.y);
}
function drawFlower(f) {
  const X = Math.round(f.x), Y = f.y;
  if (f.eaten > 0) { px(X, Y, '#4f9440'); return; }
  const sw = Math.round(Math.sin(world.t * 1.6 + f.ph + f.x * 0.05) * (0.3 + world.wind));
  if (f.type === 'grass') { px(X - 1, Y - 1, '#5aa84a'); px(X + 1, Y - 1, '#5aa84a'); px(X + sw, Y - 2, '#7ccc5e'); return; }

  drawFx('glow');

  if (DEBUG) text(`${director.name || '-'} ents:${world.ents.length} parts:${world.parts.length}`, 3, 3, '#ffffff');
}
function resize() {
  H = ROWS;
  W = Math.round((ROWS * innerWidth) / innerHeight);
  GY = H - 26; HY = Math.round(H * 0.5);
  canvas.width = W; canvas.height = H;
  ctx.imageSmoothingEnabled = false;
  scene.sun = { x: Math.round(W * rand(0.3, 0.7)), y: Math.round(HY * 0.28) };
  world.ents = []; world.parts = []; world.fx = [];
  director.cur = null; director.name = ''; director.cool = 8;
  Object.assign(world, { dark: 0, gloom: 0, gust: 0, windBase: 0.3, snow: 0, snowCover: 0, flash: 0 });
  HAY_LOW = HAY_TOP = FENCE = STUMP = null; scene.snowLayers = null;
  layoutProps(); buildBackground(); buildProps(); buildFlowers(); buildClouds();
  populate();
}
addEventListener('resize', resize);
resize();

let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  if (now - last < 1000 / FPS - 1) return;
  const dt = Math.min(0.1, (now - last) / 1000) * TIME_SCALE;
  last = now;
  try { update(dt); render(); } catch (e) { console.error(e); }
}
requestAnimationFrame(frame);
</script>
