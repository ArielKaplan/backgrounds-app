<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Pixel Train Wallpaper</title>
<script type="application/json" id="wallpaper-settings">
{
 "about": "Settings panel for the Backgrounds app. Each param is one #key=value option of this page.",
 "name": "Train",
 "description": "A little steam train on an endless journey.",
 "params": [
  {"key": "pixels", "label": "Pixel size", "type": "range", "min": 100, "max": 400, "step": 10, "default": 200, "help": "Rows of big pixels on screen. Smaller = chunkier, bigger characters."},
  {"key": "biome", "label": "Start in", "type": "select", "default": "", "options": [["", "Beginning of the route"], ["farm", "farm"], ["forest", "forest"], ["mountain", "mountain"], ["lake", "lake"], ["snow", "snow"], ["town", "town"], ["coast", "coast"], ["desert", "desert"]]},
  {"key": "loco", "label": "Engine colour", "type": "select", "default": "", "options": [["", "Random"], ["green", "green"], ["red", "red"], ["blue", "blue"], ["black", "black"]]},
  {"key": "time", "label": "Pretend time", "type": "time", "default": "", "help": "Leave empty to follow your real clock."},
  {"key": "event", "label": "Repeat one event", "type": "select", "group": "testing", "default": "", "options": [["", "Off (normal)"], ["freight", "freight"], ["cows", "cows"], ["balloons", "balloons"], ["birds", "birds"], ["wave", "wave"], ["crossing", "crossing"], ["station", "station"], ["tunnel", "tunnel"], ["bridge", "bridge"], ["rain", "rain"], ["plane", "plane"], ["ufo", "ufo"], ["dragon", "dragon"], ["whale", "whale"], ["race", "race"], ["rocket", "rocket"], ["all", "all"]], "help": "Test mode: keeps repeating one event. 'all' cycles through every event."},
  {"key": "speed", "label": "Time speed", "type": "range", "min": 0.25, "max": 10, "step": 0.25, "default": 1, "group": "testing", "help": "Runs time faster (for testing)."},
  {"key": "debug", "label": "Debug overlay", "type": "toggle", "default": false, "group": "testing"}
 ]
}
</script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #6fb4e8; }
  canvas { width: 100vw; height: 100vh; display: block; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* =====================================================================
   PIXEL TRAIN — a little steam train on an endless journey
   The camera rides alongside the train while the world scrolls past in parallax.
   The route loops through farmland, forest, mountains (tunnels), a lake (river bridge),
   snow, a town (station stop), the coast and the desert, about 10 minutes a lap.
   Day and night follow your clock; trees follow the real season.
   Options (add to the end of the address, combine with &):
     #pixels=200        vertical resolution in big pixels
     #biome=coast       start in a biome: farm forest mountain lake snow town coast desert
     #loco=green        engine colour: green red blue black
     #time=21:00        pretend local time
     #event=station     test mode: repeat one event (or "all")
     #speed=3           run time faster (testing)
     #debug             event name, biome, speed
   Events: freight cows balloons birds wave crossing station tunnel bridge rain plane
   Rare:   ufo dragon whale race rocket
   ===================================================================== */
const params = new URLSearchParams(location.hash.slice(1));
const num = (k, d) => { const v = parseFloat(params.get(k)); return Number.isFinite(v) ? v : d; };
const ROWS = Math.round(num('pixels', 200));
const FORCE = params.get('event');
const TIME_SCALE = num('speed', 1);
const DEBUG = params.has('debug');
const TIME_FORCE = params.get('time');
const FPS = 30;

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, RY;

// ---------------------------------------------------------------- utils
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const chance = p => Math.random() < p;
const coin = () => (Math.random() < 0.5 ? 1 : -1);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const TAU = Math.PI * 2;
function weighted(obj) {
  const e = Object.entries(obj).filter(([, w]) => w > 0);
  let r = Math.random() * e.reduce((a, [, w]) => a + w, 0);
  for (const [k, w] of e) if ((r -= w) < 0) return k;
  return e[0][0];
}
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v + 0.5) / 16);
const bayer = (x, y) => BAYER[((y & 3) * 4) + (x & 3)];
const hexRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const rgbStr = c => `rgb(${c.map(v => Math.round(clamp(v, 0, 255))).join(',')})`;
const mixRgb = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
function mixHex(a, b, t) { return rgbStr(mixRgb(hexRgb(a), hexRgb(b), t)); }
function px(x, y, c) { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), 1, 1); }
function rect(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }
function disc(cx, cy, r, c) { if (c) ctx.fillStyle = c; cx = Math.round(cx); cy = Math.round(cy); for (let dy = -Math.floor(r); dy <= r; dy++) { const w = Math.floor(Math.sqrt(Math.max(0, r * r - dy * dy))); ctx.fillRect(cx - w, cy + dy, w * 2 + 1, 1); } }
const hash = n => { n = Math.sin(n * 127.1 + 311.7) * 43758.5453; return n - Math.floor(n); };
function vnoise(x) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(hash(i), hash(i + 1), u); }
function fbm(x) { return vnoise(x) * 0.55 + vnoise(x * 2.1 + 13) * 0.3 + vnoise(x * 4.3 + 7) * 0.15; }
const FONT = {
  A: '.X.X.XXXXX.XX.X', B: 'XX.X.XXX.X.XXX.', C: '.XXX..X..X...XX', D: 'XX.X.XX.XX.XXX.', E: 'XXXX..XX.X..XXX', F: 'XXXX..XX.X..X..',
  G: '.XXX..X.XX.X.XX', H: 'X.XX.XXXXX.XX.X', I: 'XXX.X..X..X.XXX', J: '..X..X..XX.X.X.', K: 'X.XX.XXX.X.XX.X', L: 'X..X..X..X..XXX',
  M: 'X.XXXXXXXX.XX.X', N: 'XX.X.XX.XX.XX.X', O: '.X.X.XX.XX.X.X.', P: 'XX.X.XXX.X..X..', Q: '.X.X.XX.XXX..XX', R: 'XX.X.XXX.X.XX.X',
  S: '.XXX...X...XXX.', T: 'XXX.X..X..X..X.', U: 'X.XX.XX.XX.XXXX', V: 'X.XX.XX.XX.X.X.', W: 'X.XX.XXXXXXXX.X', X: 'X.XX.X.X.X.XX.X',
  Y: 'X.XX.X.X..X..X.', Z: 'XXX..X.X.X..XXX', ' ': '...............', '!': '.X..X..X.....X.', '-': '......XXX......', '.': '.............X.',
  0: 'XXXX.XX.XX.XXXX', 1: '.X.XX..X..X.XXX', 2: 'XX...X.X.X..XXX', 3: 'XX...X.X...XXX.', 4: 'X.XX.XXXX..X..X', 5: 'XXXX..XX...XXX.',
  6: '.XXX..XXXX.XXXX', 7: 'XXX..X.X..X..X.', 8: 'XXXX.XXXXX.XXXX', 9: 'XXXX.XXXX..XXX.', ':': '....X.....X....', '?': 'XX...X.X.....X.',
};
const textW = s => String(s).length * 4 - 1;
function text(str, x, y, col = '#ffffff', shadow = null) {
  str = String(str).toUpperCase();
  const draw = (ox, oy, c) => { ctx.fillStyle = c; for (let i = 0; i < str.length; i++) { const g = FONT[str[i]] || FONT['?']; for (let k = 0; k < 15; k++) if (g[k] === 'X') ctx.fillRect(Math.round(x + ox + i * 4 + (k % 3)), Math.round(y + oy + Math.floor(k / 3)), 1, 1); } };
  if (shadow) draw(1, 1, shadow);
  draw(0, 0, col);
}

// ---------------------------------------------------------------- the route
const ROUTE = [['farm', 4200], ['forest', 3600], ['mountain', 4200], ['lake', 3200], ['snow', 3400], ['forest', 2400], ['town', 2800], ['coast', 4200], ['desert', 4200]];
const ROUTE_LEN = ROUTE.reduce((a, [, l]) => a + l, 0);
function biomeAt(d) {
  d = ((d % ROUTE_LEN) + ROUTE_LEN) % ROUTE_LEN;
  for (let i = 0; i < ROUTE.length; i++) { if (d < ROUTE[i][1]) return { b: ROUTE[i][0], into: d, left: ROUTE[i][1] - d, next: ROUTE[(i + 1) % ROUTE.length][0] }; d -= ROUTE[i][1]; }
  return { b: 'farm', into: 0, left: 1, next: 'forest' };
}
const SEASON = (() => { const m = new Date().getMonth(); return m >= 2 && m <= 4 ? 'spring' : m >= 5 && m <= 7 ? 'summer' : m >= 8 && m <= 10 ? 'autumn' : 'winter'; })();
const LEAF = { spring: ['#6cbf4f', '#f2b8c8', '#8ad05a'], summer: ['#3f8f3a', '#4fa845', '#2f7a32'], autumn: ['#e07a2a', '#f0b43a', '#c84a2a', '#8ab04a'], winter: ['#6a5a4a'] }[SEASON];
const B = {
  farm: { far: ['#8fb6d8', 0.35, 30], mid: '#7fbf5a', mid2: '#6aaa4a', field: '#78b84e', field2: '#6aa844', ground: '#5c9a3c' },
  forest: { far: ['#7aa4c4', 0.5, 45], mid: '#3f7a44', mid2: '#356a3a', field: '#4f8f40', field2: '#447e38', ground: '#3f7a34' },
  mountain: { far: ['#8a9cc0', 1.0, 80], mid: '#6a7a6a', mid2: '#5a6a5a', field: '#6a8a52', field2: '#5f7c4a', ground: '#57703e' },
  lake: { far: ['#86a8cc', 0.55, 50], mid: '#4f8fc0', mid2: '#3f7ab0', field: '#6aaa50', field2: '#5f9a48', ground: '#548e40', water: true },
  snow: { far: ['#b8c8e0', 0.85, 70], mid: '#e8eef6', mid2: '#d4dcea', field: '#eef3fa', field2: '#dfe7f2', ground: '#e4ebf5', snow: true },
  town: { far: ['#90acd0', 0.3, 28], mid: '#8a9ab0', mid2: '#7a8aa0', field: '#8ab860', field2: '#7aa856', ground: '#6a9a48' },
  coast: { far: ['#7ab0e0', 0.12, 18], mid: '#3f94c8', mid2: '#2f84b8', field: '#e8d8a0', field2: '#dcc890', ground: '#d8c488', sea: true },
  desert: { far: ['#d8a878', 0.45, 45], mid: '#e0b070', mid2: '#d0a060', field: '#e8c890', field2: '#dcb880', ground: '#d4ac70', mesa: true },
};

// ---------------------------------------------------------------- world state
const LOCO = { green: ['#2f6b4a', '#23553a'], red: ['#a8322a', '#842620'], blue: ['#2f5a9a', '#23467a'], black: ['#34343c', '#24242a'] };
const LOCO_COL = LOCO[params.get('loco')] || LOCO[pick(Object.keys(LOCO))];
const COACH_COL = pick([['#7a2a2a', '#e8dcc0'], ['#2f5a3a', '#e8dcc0'], ['#2f4a7a', '#f0ece0'], ['#6a3a6a', '#f0e0c8']]);
const world = { t: 0, dist: 0, v: 55, vTarget: 55, stop: null, parts: [], fx: [], ents: [], pieces: [], rain: 0, night: 0, lightning: 0 };
const START = params.get('biome');
if (START) { let d = 0; for (const [b, l] of ROUTE) { if (b === START) break; d += l; } world.dist = d + 200; }
else world.dist = rand(0, ROUTE_LEN);
const train = { cars: [], front: 0, whistle: 0, smoke: 1, doorsOpen: 0 };

// ---------------------------------------------------------------- parallax layers (streamed items)
const layers = {
  back: { p: 0.42, items: [], next: 0 },
  ground: { p: 1, items: [], next: 0 },
  front: { p: 1.7, items: [], next: 0 },
};
function layerX(L) { return world.dist * L.p; }
function genItems(L, key) {
  const lx = layerX(L);
  while (L.next < lx + W + 80) {
    const x = L.next;
    const bm = biomeAt(key === 'back' ? world.dist + (x - lx) : x / L.p).b;
    const it = spawnItem(key, bm, x);
    L.next += it ? it.gap : 8;
    if (it) L.items.push(it);
  }
  L.items = L.items.filter(it => it.x + (it.w || 40) > lx - 80);
}
function spawnItem(layer, bm, x) {
  const s = Math.random();
  if (layer === 'back') {
    const T = {
      farm: { tree: 3, barn: 0.5, windmill: 0.35, cow: 1.2, hay: 1, house: 0.4, orchard: 1, none: 1.5 },
      forest: { pine: 6, tree: 3, none: 0.3 },
      mountain: { pine: 3, rock: 1.5, none: 1.5 },
      lake: { tree: 1, pine: 1, boat: 0.4, none: 2 },
      snow: { spine: 5, snowman: 0.15, none: 1 },
      town: { house: 4, church: 0.3, tree: 1, shop: 1.5, none: 0.5 },
      coast: { palm: 2, lighthouse: 0.12, umbrella: 0.8, none: 2 },
      desert: { cactus: 3, rock: 1.2, skull: 0.15, none: 2.5 },
    }[bm];
    const k = weighted(T);
    if (k === 'none') return { kind: 'none', x, gap: randi(10, 30) };
    const it = { kind: k, x, s, bm, gap: randi(8, 26) };
    if (k === 'house' || k === 'shop') it.gap = randi(26, 40);
    if (k === 'church' || k === 'barn' || k === 'lighthouse') it.gap = randi(40, 60);
    if (k === 'pine' || k === 'spine') it.gap = randi(5, 14);
    if (k === 'orchard') it.gap = randi(10, 14);
    it.lit = chance(0.6); it.w = 40;
    return it;
  }
  if (layer === 'ground') {
    const k = (Math.floor(x) % 64 < 8 && !['coast', 'desert'].includes(bm)) || (bm === 'desert' && Math.floor(x) % 96 < 8) ? 'pole' : weighted({ bush: bm === 'snow' || bm === 'desert' ? 0.4 : 1.2, flowers: bm === 'farm' || bm === 'town' ? 1 : 0.2, stone: 0.5, none: 3, lamp: bm === 'town' ? 1.5 : 0, fence: bm === 'farm' ? 1 : 0 });
    return { kind: k, x, s, bm, gap: k === 'pole' ? 8 : randi(6, 18), w: k === 'fence' ? 30 : 10 };
  }
  // front: fast close-up bushes and grass tufts at the very bottom
  const k = weighted({ tuft: bm === 'desert' || bm === 'snow' ? 0.5 : 2, bush: 0.4, none: 3 });
  return { kind: k, x, s, bm, gap: randi(10, 40), w: 20 };
}

// ---------------------------------------------------------------- scenery drawing
const FIELD_TOP = () => RY - 50;
function sky(t) {
  const h = localHour();
  const day = smooth(5.5, 7.5, h) * (1 - smooth(18.5, 20.5, h));
  const dusk = Math.max(Math.exp(-(((h - 6.7) / 0.9) ** 2)), Math.exp(-(((h - 19.3) / 0.9) ** 2)));
  world.night = 1 - day; world.dusk = dusk;
  const top = mixRgb(mixRgb(hexRgb('#0b1030'), hexRgb('#4a9ee6'), day), hexRgb('#5a4a9a'), dusk * 0.5);
  const bot = mixRgb(mixRgb(hexRgb('#1f2a58'), hexRgb('#bfe6fa'), day), hexRgb('#f6a676'), dusk * 0.85);
  const grey = world.rain * 0.6;
  for (let y = 0; y < RY; y++) {
    const k = clamp(y / (RY * 0.8) + (bayer(y, y) - 0.5) * 0.06, 0, 1);
    ctx.fillStyle = rgbStr(mixRgb(mixRgb(top, bot, k), [130, 136, 150], grey));
    ctx.fillRect(0, y, W, 1);
  }
  world.skyBot = bot;
  if (day < 0.5) {
    for (const s of scene.stars) { const a = (1 - day * 2) * (0.5 + 0.5 * Math.sin(t * 2 + s.ph)) * (1 - world.rain); if (a > 0.2) { ctx.globalAlpha = a; px(s.x, s.y, '#ffffff'); } }
    ctx.globalAlpha = 1;
  }
  const dayFrac = clamp((h - 6) / 13.5, 0, 1), nightFrac = ((h + 24 - 19.5) % 24) / 10.5;
  if (day > 0.05) { ctx.globalAlpha = day * (1 - world.rain * 0.8); disc(W * (0.12 + dayFrac * 0.76), RY * (0.62 - Math.sin(dayFrac * Math.PI) * 0.5), 6, dusk > 0.3 ? '#ffb070' : '#fff2c0'); ctx.globalAlpha = 1; }
  else if (nightFrac < 1) { const x = W * (0.12 + nightFrac * 0.76), y = RY * (0.62 - Math.sin(nightFrac * Math.PI) * 0.5); disc(x, y, 5, '#f4f2e0'); disc(x + 3, y - 2, 4.3, rgbStr(top)); }
  // clouds (barely move: they're far away)
  const cc = rgbStr(mixRgb(mixRgb(hexRgb('#ffffff'), hexRgb('#3a4266'), world.night), [150, 156, 170], world.rain));
  ctx.fillStyle = cc;
  for (const c of scene.clouds) {
    const x = ((c.x - world.dist * 0.02) % (W + 80) + W + 80) % (W + 80) - 40;
    for (const p of c.puffs) disc(x + p[0], c.y + p[1], p[2] + world.rain * 2);
  }
}
function ridge(p, base, amp, freq, seed, colFn) {
  // a continuous silhouette whose shape follows the biome under it; right-facing slopes are shaded
  const lx = world.dist * p;
  const hAt = (x, b) => {
    const wx = lx + x;
    if (p < 0.1) {
      const [, a, hmax] = b.far;
      if (b.sea) return 3 + (fbm(wx * 0.02 + seed) > 0.7 ? 10 : 0);
      if (b.mesa) return fbm(wx * 0.01 + seed) > 0.55 ? hmax * 0.8 : hmax * 0.2 + fbm(wx * 0.03) * 10;
      return Math.pow(fbm(wx * freq + seed), 1.5) * hmax * (0.45 + a) * 1.05 + 12;
    }
    return amp * (0.4 + fbm(wx * freq + seed)) * (b.sea || b.water ? 0.25 : b.mesa ? 0.7 : 1);
  };
  for (let x = 0; x < W; x++) {
    const b = B[biomeAt(world.dist + (x - W * 0.5) * (p < 0.1 ? 0.35 : 0.8) + (p < 0.1 ? 500 : 150)).b];
    const col = colFn(b, x, lx + x);
    if (!col) continue;
    const h = hAt(x, b), hn = hAt(x + 1, b), top = Math.round(base - h);
    ctx.fillStyle = hn < h - 0.15 && col.shade ? col.shade : col.fill;
    ctx.fillRect(x, top, 1, base - top + 1);
    if (col.cap && h > col.capAt) { ctx.fillStyle = hn < h - 0.15 ? col.capShade : col.cap; ctx.fillRect(x, top, 1, Math.max(1, Math.round((h - col.capAt) * 0.45))); }
  }
}
function drawFar() {
  const haze = world.skyBot;
  ridge(0.05, FIELD_TOP() - 4, 0, 0.012, 3, b => {
    const c = mixRgb(hexRgb(b.far[0]), haze, 0.35 + world.night * 0.2), snowy = b.snow || b.far[1] > 0.8;
    return { fill: rgbStr(c), shade: rgbStr(mixRgb(c, [30, 30, 60], 0.18)), cap: snowy ? rgbStr(mixRgb(c, [255, 255, 255], 0.65)) : null, capShade: rgbStr(mixRgb(c, [230, 236, 250], 0.4)), capAt: b.snow ? 40 : 62 };
  });
}
function drawMid() {
  const base = FIELD_TOP() + 2;
  // sea / lake water with glints, otherwise hills
  ridge(0.16, base, 30, 0.028, 11, (b, x, wx) => {
    if (b.sea || b.water) return null;
    const c = hexRgb((Math.floor(wx / 23) % 2 && b === B.farm) ? b.mid2 : b.mid);
    const f = mixRgb(c, world.skyBot, 0.15);
    return { fill: rgbStr(f), shade: rgbStr(mixRgb(f, [0, 0, 0], 0.1)) };
  });
  for (let x = 0; x < W; x++) {
    const b = B[biomeAt(world.dist + (x - W * 0.5) * 0.8 + 150).b];
    if (!(b.sea || b.water)) continue;
    const top = b.sea ? FIELD_TOP() - 20 : FIELD_TOP() - 8;
    for (let y = top; y <= base; y++) {
      const k = (y - top) / (base - top + 1);
      let c = mixRgb(hexRgb(b.mid), hexRgb(b.mid2), k);
      c = mixRgb(c, world.skyBot, 0.25 * (1 - k));
      if (Math.sin((x + world.dist * 0.16) * 0.4 + y * 2.3 + world.t * 1.5) > 0.93) c = mixRgb(c, [255, 255, 255], 0.5);
      ctx.fillStyle = rgbStr(c); ctx.fillRect(x, y, 1, 1);
    }
  }
}
function drawField() {
  const top = FIELD_TOP();
  for (let x = 0; x < W; x++) {
    const bm = biomeAt(world.dist + x - W * 0.3).b, b = B[bm];
    if (b.sea) { rect(x, top + 2, 1, RY - top, b.field); if (Math.sin((x + world.dist * 0.42) * 0.6 + world.t * 3) > 0.8) px(x, top + 2, '#ffffff'); continue; }
    const f = hexRgb(b.field), f2 = hexRgb(b.field2);
    for (let y = top + 2; y < RY - 2; y++) {
      const stripe = bm === 'farm' ? Math.floor((x + world.dist * 0.42) / 18 + (y - top) * 0.15) % 2 : bayer(x + Math.floor(world.dist * 0.42), y) > 0.7;
      ctx.fillStyle = rgbStr(stripe ? f2 : f); ctx.fillRect(x, y, 1, 1);
    }

// ---- items
function drawBackItem(it, sx) {
  const s = it.s, base = FIELD_TOP() + 16 + Math.round(((it.depth ?? (it.depth = Math.random())) * 26));
  const leaf = LEAF[Math.floor(s * LEAF.length)];
  switch (it.kind) {
    case 'tree': {
      rect(sx, base - 8, 2, 8, '#6a4a32');
      const r = 5 + Math.round(s * 4), col = SEASON === 'winter' && it.bm !== 'town' ? null : leaf;
      if (!col) { rect(sx - 3, base - 12, 1, 5, '#6a4a32'); rect(sx + 3, base - 13, 1, 6, '#6a4a32'); rect(sx - 2, base - 16, 5, 1, '#6a4a32'); break; }
      disc(sx + 1, base - 9 - r * 0.6, r, mixHex(col, '#000000', 0.2)); disc(sx, base - 10 - r * 0.7, r - 1, col); px(sx - 2, base - 12 - r * 0.7, '#ffffff40');
      break;
    }
    case 'orchard': { rect(sx, base - 6, 1, 6, '#6a4a32'); disc(sx, base - 9, 4, leaf); if (SEASON !== 'winter') { px(sx - 2, base - 9, '#e03a3a'); px(sx + 2, base - 10, '#e03a3a'); } break; }
    case 'pine': case 'spine': {

    const base = RY - 13, x = Math.round(this.x), g = Math.floor(this.t * 10) % 2;
    rect(x - 6, base - 6, 11, 4, '#7a4a2a'); rect(x + 4, base - 9, 3, 4, '#7a4a2a'); rect(x + 6, base - 8, 2, 2, '#7a4a2a');
    for (const [lx, o] of [[-5, g], [-3, 1 - g], [2, g], [4, 1 - g]]) rect(x + lx + (o ? 1 : -1), base - 2, 1, 3, '#5a3a1a');
    rect(x - 7, base - 7, 2, 3, '#3a2a1a');
    rect(x - 1, base - 12, 3, 5, '#c84a3a'); rect(x - 1, base - 15, 3, 3, '#f4d0b0'); rect(x - 3, base - 16, 7, 1, '#8a5a2a'); rect(x - 1, base - 17, 3, 1, '#8a5a2a');
    if (chance(0.3)) addPart(x - 6, base, -rand(10, 20), -rand(2, 6), 0.5, '#d8c090', { puff: 1, grow: 2 });
  };
  r.layer = 'field'; world.ents.push(r);
  yield* until(() => r.dead, 40);
}
function* evRocket() {
  const x = W * rand(0.2, 0.6);
  const rk = new Ent({ x, y: FIELD_TOP() - 4, t: 0, trail: [] });
  rk.update = function (dt) { this.t += dt; this.x -= world.v * 0.05 * dt; if (this.t > 1.5) { const v = (this.t - 1.5) * 18; this.y -= v * dt; this.x += v * 0.25 * dt; this.trail.push([this.x, this.y + 3]); } if (this.y < -30) this.dead = true; };
  rk.draw = function () {
    for (const [i, [tx, ty]] of this.trail.entries()) { const age = (this.trail.length - i) / 60; disc(tx - world.v * 0.05 * age, ty, 1 + age * 2.5, `rgba(240,240,246,${clamp(0.8 - age * 0.25, 0, 0.8)})`); }
    rect(this.x - 1, this.y - 7, 3, 7, '#f0f0f4'); px(this.x, this.y - 8, '#e84a3a'); if (this.t > 1.5) { px(this.x, this.y + 1, '#ffd040'); px(this.x, this.y + 2, '#ff8030'); }
  };
  rk.layer = 'mid'; world.ents.push(rk);
  yield* until(() => rk.dead, 60);
}
const COMMON = { freight: 1.2, cows: 1, balloons: 1, birds: 1.2, wave: 1, crossing: 1, station: 1.3, tunnel: 1.1, bridge: 1.1, rain: 0.8, plane: 0.8 };
const RARE = { ufo: 1, dragon: 0.8, whale: 1, race: 1, rocket: 1 };
const FITS = {   // where an event makes sense
  cows: b => b === 'farm', tunnel: b => b === 'mountain' || b === 'snow' || b === 'forest', bridge: b => b === 'lake' || b === 'forest' || b === 'farm',
  station: b => b === 'town' || b === 'farm' || b === 'coast', crossing: b => b === 'farm' || b === 'town' || b === 'desert', whale: b => b === 'coast',
  race: b => b === 'desert' || b === 'farm', dragon: b => b === 'mountain' || b === 'snow', freight: b => b !== 'coast',
};
const EVENTS = { freight: evFreight, cows: evCows, balloons: evBalloons, birds: evBirds, wave: evWave, crossing: () => evPiece('crossing'), station: () => evPiece('station'), tunnel: () => evPiece('tunnel'), bridge: () => evPiece('bridge'), rain: evRain, plane: evPlane,
  ufo: evUfo, dragon: evDragon, whale: evWhale, race: evRace, rocket: evRocket };
const director = { cur: null, name: '', cool: 6, last: '', idx: 0 };
function runDirector(dt) {
  if (director.cur) {
    let r;
    try { r = director.cur.next(dt); } catch (e) { console.error(director.name, e); r = { done: true }; }
    if (r.done) { director.cur = null; director.name = ''; director.cool = FORCE ? 3 : rand(8, 20); cleanupEvent(); }
  } else if ((director.cool -= dt) <= 0) {
    const bm = biomeAt(world.dist + W).b, all = Object.keys(EVENTS);
    let name;
    if (FORCE) name = FORCE === 'all' ? all[director.idx++ % all.length] : FORCE;
    else {
      const fit = (tbl) => Object.fromEntries(Object.entries(tbl).map(([k, w]) => [k, FITS[k] && !FITS[k](bm) ? 0 : w]));
      do { name = chance(0.1) ? weighted(fit(RARE)) : weighted(fit(COMMON)); } while (name === director.last);
    }
    if (!EVENTS[name]) { director.cool = 5; return; }
    director.last = director.name = name;
    director.cur = EVENTS[name]();
    try { director.cur.next(0); } catch (e) { console.error(name, e); director.cur = null; cleanupEvent(); }
  }
}
function cleanupEvent() { world.rain = 0; if (world.vTarget < 55 && !world.stop) world.vTarget = 55; }
// scenery set pieces also appear on their own when the route passes through their home biome
function autoPieces() {
  const b = biomeAt(world.dist + W + 60);
  if (director.cur && ['station', 'tunnel', 'bridge', 'crossing'].includes(director.name)) return;
  if (b.b === 'mountain' && b.into > 600 && b.into < 700 && !world.pieces.some(p => p.kind === 'tunnel')) placePiece('tunnel', 60);
  if (b.b === 'lake' && b.into > 900 && b.into < 1000 && !world.pieces.some(p => p.kind === 'bridge')) placePiece('bridge', 60);
  if (b.b === 'town' && b.into > 1200 && b.into < 1300 && !director.cur) { director.cur = stationStop(placePiece('station', 60) || { x0: world.dist + W + 60, len: 230, name: 'SNUGWICK', kind: 'station' }); director.name = 'station'; }
}

// ---------------------------------------------------------------- main loop
function localHour() {
  const d = new Date();
  if (TIME_FORCE) { const [h, m] = TIME_FORCE.split(':').map(Number); return ((h || 0) + (m || 0) / 60 + world.t / 3600 * (TIME_SCALE > 1 ? 20 : 1)) % 24; }
  return d.getHours() + d.getMinutes() / 60;
}
const scene = { stars: [], clouds: [] };
function update(dt) {
  world.t += dt;
  world.wind = 0.3 + Math.sin(world.t * 0.1) * 0.2;
  // speed: cruise, or brake smoothly for a station
  if (world.stop !== null && world.stop !== undefined) {
    const d = world.stop - world.dist;
    world.v = d > 0 ? Math.min(world.v, Math.sqrt(2 * 9 * d) + 0.3) : 0;
  } else world.v = lerp(world.v, world.vTarget, 1 - Math.exp(-dt / 3));
  world.dist += world.v * dt;
  autoPieces();
  runDirector(dt);
  for (const [k, L] of Object.entries(layers)) genItems(L, k);
  for (const e of world.ents) if (!e.dead) e.update(dt);
  world.ents = world.ents.filter(e => !e.dead);
  for (const it of layers.back.items) if (it.moo > 0) it.moo -= dt;
  for (const c of train.cars) for (const s of c.seats || []) if (s && s.wave > 0) s.wave -= dt;
  for (const p of world.parts) { p.life -= dt; p.vy += p.grav * dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.puff) p.vy *= Math.pow(0.4, dt); }
  world.parts = world.parts.filter(p => p.life > 0);
  if (world.rain > 0) for (let i = 0; i < world.rain * dt * 140 * (W / 300); i++) addPart(rand(0, W + 40), -2, -40 - world.v * 0.8, rand(160, 200), 1.2, '#b8c8e0', { rain: true });
  for (const f of world.fx) f.t += dt;
  world.fx = world.fx.filter(f => f.t < f.dur);
  world.lightning = Math.max(0, world.lightning - dt * 2);
}
function render() {
  const t = world.t;
  sky(t);
  for (const f of world.fx) if (f.rainbow) drawRainbow(f);
  for (const e of world.ents) if (!e.layer) e.draw();
  drawFar();
  drawMid();
  for (const e of world.ents) if (e.layer === 'mid') e.draw();
  drawField();
  for (const e of world.ents) if (e.layer === 'fieldBack') e.draw();
  const lb = layerX(layers.back);
  for (const it of layers.back.items) { const sx = Math.round(it.x - lb); if (sx > -40 && sx < W + 40) drawBackItem(it, sx); }
  for (const e of world.ents) if (e.layer === 'field') e.draw();
  drawPiecesBack();
  // track bed
  rect(0, RY - 2, W, 10, '#6a625a');
  for (let x = -((world.dist % 6) + 6); x < W; x += 6) rect(x, RY + 1, 4, 2, '#5a3e2a');
  rect(0, RY, W, 1, '#c8ccd4'); rect(0, RY + 1, W, 1, '#8a8e96');
  const lg = layerX(layers.ground);
  for (const it of layers.ground.items) { const sx = Math.round(it.x - lg); if (sx > -20 && sx < W + 20 && !pieceAt(it.x)) drawGroundItem(it, sx); }
  drawWires(layers.ground.items);
  drawTrain(t);
  drawPiecesFront();
  // near ground
  for (let x = 0; x < W; x++) { const b = B[biomeAt(world.dist + x).b]; const pc = pieceAt(world.dist + x); if (pc && pc.kind === 'bridge') continue; rect(x, RY + 7, 1, H - RY - 7, b.ground); }
  const lf = layerX(layers.front);
  for (const it of layers.front.items) { const sx = Math.round(it.x - lf); if (sx > -30 && sx < W + 30) drawFrontItem(it, sx); }
  // smoke + particles
  for (const p of world.parts) {
    const k = p.life / p.max;
    if (p.rain) { ctx.fillStyle = '#b8c8e0'; ctx.fillRect(Math.round(p.x), Math.round(p.y), 1, 3); continue; }
    if (p.puff) { ctx.globalAlpha = clamp(k * 1.4, 0, 0.85); disc(p.x, p.y, p.puff + (1 - k) * p.grow, p.col); ctx.globalAlpha = 1; continue; }
    px(p.x, p.y, p.col);
  }
  for (const f of world.fx) if (f.toot) { const k = f.t / f.dur; if (Math.floor(k * 8) % 2 === 0) text('TOOT TOOT!', train.front - 30, RY - 50 - k * 6, '#ffffff', '#00000080'); }
  // night: darken, then lights
  if (world.night > 0.02) {
    ctx.globalCompositeOperation = 'multiply';
    ctx.fillStyle = rgbStr(mixRgb([255, 255, 255], [60, 70, 130], world.night * 0.88));
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'source-over';
    // lit windows cut through the dark
    for (const [x, y, pax, wx, wy] of train.windows || []) { if (tunnelCovers(x)) continue; rect(x - 2, y - 4, 5, 8, '#ffd88a'); drawPassenger(pax, wx, wy, world.t); }
  }
  for (const [x, y] of train.windows || []) glowAt(x, y, 10, '#ffc860', 0.35);
  flushGlows();
  if (world.dusk > 0.05 && world.night < 0.9) { ctx.globalCompositeOperation = 'soft-light'; ctx.globalAlpha = world.dusk * 0.4; rect(0, 0, W, H, '#ff9a5a'); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; }
  if (world.lightning > 0.02) { ctx.globalAlpha = world.lightning * 0.4; rect(0, 0, W, H, '#e8ecff'); ctx.globalAlpha = 1; }
  if (DEBUG) text(`${director.name || '-'} ${biomeAt(world.dist).b} V${Math.round(world.v)}`, 3, 3, '#ffffff', '#000000');
}
function drawRainbow(f) {
  const a = Math.sin(clamp(f.t / f.dur, 0, 1) * Math.PI) * 0.45, cx = W * 0.4, cy = RY + 20, R = RY * 0.9;
  const cols = ['#ff5a5a', '#ffa040', '#ffe060', '#6ad06a', '#5aa0ff', '#8a6aff'];
  ctx.globalAlpha = a;
  for (const [i, c] of cols.entries()) { ctx.strokeStyle = c; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(cx, cy, R - i * 2, Math.PI, TAU); ctx.stroke(); }
  ctx.globalAlpha = 1;
}
function resize() {
  H = ROWS; W = Math.round((ROWS * innerWidth) / innerHeight);
  canvas.width = W; canvas.height = H;
  ctx.imageSmoothingEnabled = false;
  RY = H - 18;
  train.front = Math.round(W * 0.8);
  buildTrain();
  scene.stars = Array.from({ length: Math.round(W * RY / 50) }, () => ({ x: randi(0, W - 1), y: randi(0, Math.round(RY * 0.7)), ph: rand(0, TAU) }));
  scene.clouds = Array.from({ length: 6 }, () => ({ x: rand(0, W + 80), y: rand(RY * 0.08, RY * 0.4), puffs: Array.from({ length: randi(3, 5) }, (_, i) => [i * 5 + rand(-2, 2), rand(-2, 2), rand(3, 6)]) }));
  for (const L of Object.values(layers)) { L.items = []; L.next = layerX(L) - 60; }
  world.pieces = []; world.ents = []; world.parts = [];
  director.cur = null; director.cool = 6;
}
addEventListener('resize', resize);
resize();
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  if (now - last < 1000 / FPS - 1) return;
  const dt = Math.min(0.1, (now - last) / 1000) * TIME_SCALE;
  last = now;
  try { const steps = Math.ceil(dt / 0.05); for (let i = 0; i < steps; i++) update(dt / steps); render(); } catch (e) { console.error(e); }
}
requestAnimationFrame(frame);
</script>
</body>
