  {"key": "event", "label": "Repeat one event", "type": "select", "group": "testing", "default": "", "options": [["", "Off (normal)"], ["freight", "freight"], ["cows", "cows"], ["balloons", "balloons"], ["birds", "birds"], ["wave", "wave"], ["crossing", "crossing"], ["station", "station"], ["tunnel", "tunnel"], ["bridge", "bridge"], ["rain", "rain"], ["plane", "plane"], ["ufo", "ufo"], ["dragon", "dragon"], ["whale", "whale"], ["race", "race"], ["rocket", "rocket"], ["all", "all"]], "help": "Test mode: keeps repeating one event. 'all' cycles through every event."},

<canvas id="c"></canvas>
<script>
/* =====================================================================
   PIXEL TRAIN — a little steam train on an endless journey
   The camera rides alongside the train while the world scrolls past in parallax.
   The route loops through farmland, forest, mountains (tunnels), a lake (river bridge),
   snow, a town (station stop), the coast and the desert, about 10 minutes a lap.
   Day and night follow your clock; trees follow the real season.
   Options (add to the end of the address, combine with &):
     #pixels=200        vertical resolution in big pixels
     #biome=coast       start in a biome: farm forest mountain lake snow town coast desert
     #loco=green        engine colour: green red blue black
     #time=21:00        pretend local time
     #event=station     test mode: repeat one event (or "all")
     #speed=3           run time faster (testing)
     #debug             event name, biome, speed
   Events: freight cows balloons birds wave crossing station tunnel bridge rain plane
   Rare:   ufo dragon whale race rocket
   ===================================================================== */
const params = new URLSearchParams(location.hash.slice(1));
const num = (k, d) => { const v = parseFloat(params.get(k)); return Number.isFinite(v) ? v : d; };
const ROWS = Math.round(num('pixels', 200));
const FORCE = params.get('event');
const TIME_SCALE = num('speed', 1);
const DEBUG = params.has('debug');
const TIME_FORCE = params.get('time');
const FPS = 30;

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, RY;

// ---------------------------------------------------------------- utils
const rand = (a, b) => a + Math.random() * (b - a);

// ---------------------------------------------------------------- the route

  lake: { far: ['#86a8cc', 0.55, 50], mid: '#4f8fc0', mid2: '#3f7ab0', field: '#6aaa50', field2: '#5f9a48', ground: '#548e40', water: true },

  town: { far: ['#90acd0', 0.3, 28], mid: '#8a9ab0', mid2: '#7a8aa0', field: '#8ab860', field2: '#7aa856', ground: '#6a9a48' },
  coast: { far: ['#7ab0e0', 0.12, 18], mid: '#3f94c8', mid2: '#2f84b8', field: '#e8d8a0', field2: '#dcc890', ground: '#d8c488', sea: true },
  desert: { far: ['#d8a878', 0.45, 45], mid: '#e0b070', mid2: '#d0a060', field: '#e8c890', field2: '#dcb880', ground: '#d4ac70', mesa: true },

// ---------------------------------------------------------------- world state
const LOCO = { green: ['#2f6b4a', '#23553a'], red: ['#a8322a', '#842620'], blue: ['#2f5a9a', '#23467a'], black: ['#34343c', '#24242a'] };
const LOCO_COL = LOCO[params.get('loco')] || LOCO[pick(Object.keys(LOCO))];
const COACH_COL = pick([['#7a2a2a', '#e8dcc0'], ['#2f5a3a', '#e8dcc0'], ['#2f4a7a', '#f0ece0'], ['#6a3a6a', '#f0e0c8']]);

const START = params.get('biome');

const train = { cars: [], front: 0, whistle: 0, smoke: 1, doorsOpen: 0 };

// ---------------------------------------------------------------- parallax layers (streamed items)
const layers = {
  back: { p: 0.42, items: [], next: 0 },
  ground: { p: 1, items: [], next: 0 },
  front: { p: 1.7, items: [], next: 0 },
};
function layerX(L) { return world.dist * L.p; }
function genItems(L, key) {
  const lx = layerX(L);
  while (L.next < lx + W + 80) {
    const x = L.next;
    const bm = biomeAt(key === 'back' ? world.dist + (x - lx) : x / L.p).b;
    const it = spawnItem(key, bm, x);
    L.next += it ? it.gap : 8;
    if (it) L.items.push(it);
  }
  L.items = L.items.filter(it => it.x + (it.w || 40) > lx - 80);
}

      farm: { tree: 3, barn: 0.5, windmill: 0.35, cow: 1.2, hay: 1, house: 0.4, orchard: 1, none: 1.5 },
      forest: { pine: 6, tree: 3, none: 0.3 },
      mountain: { pine: 3, rock: 1.5, none: 1.5 },
      lake: { tree: 1, pine: 1, boat: 0.4, none: 2 },
      snow: { spine: 5, snowman: 0.15, none: 1 },
      town: { house: 4, church: 0.3, tree: 1, shop: 1.5, none: 0.5 },
      coast: { palm: 2, lighthouse: 0.12, umbrella: 0.8, none: 2 },
      desert: { cactus: 3, rock: 1.2, skull: 0.15, none: 2.5 },

    if (k === 'house' || k === 'shop') it.gap = randi(26, 40);
    if (k === 'church' || k === 'barn' || k === 'lighthouse') it.gap = randi(40, 60);
    if (k === 'pine' || k === 'spine') it.gap = randi(5, 14);

    if (this.t > 5 && this.t < 10) { ctx.save(); ctx.globalAlpha = 0.18; ctx.fillStyle = '#b0ffd0'; ctx.beginPath(); ctx.moveTo(x - 3, y + 2); ctx.lineTo(x + 3, y + 2); ctx.lineTo(x + 12, RY - 10); ctx.lineTo(x - 12, RY - 10); ctx.fill(); ctx.restore(); }
    for (let k = -8; k <= 8; k++) rect(x + k, y + 1 - (Math.abs(k) < 6 ? 1 : 0), 1, 2, '#a8b0c0'); disc(x, y - 1, 3, '#9fe0ff');
    for (let k = -6; k <= 6; k += 3) px(x + k, y + 2, Math.floor(world.t * 6 + k) % 2 ? '#ffe060' : '#ff6060');
  };
  u.layer = 'field'; world.ents.push(u);
  yield* until(() => u.dead, 30);
}
function* evDragon() {
  const d = new Ent({ x: W + 30, y: RY * 0.3, t: 0 });
  d.update = function (dt) { this.t += dt; this.x -= (world.v * 0.12 + 16) * dt; this.y = RY * 0.3 + Math.sin(this.t * 0.8) * 8; if (this.x < -40) this.dead = true; if (chance(dt * 0.4)) for (let i = 0; i < 12; i++) addPart(this.x - 14, this.y + 1, -rand(30, 60), rand(-6, 6), rand(0.3, 0.6), pick(['#ffd040', '#ff8030', '#ff4020']), {}); };
  d.draw = function () {
    const x = Math.round(this.x), y = Math.round(this.y), f = Math.sin(this.t * 5);
    rect(x - 8, y - 2, 16, 4, '#4a8a4a'); rect(x - 14, y - 3, 6, 4, '#4a8a4a'); px(x - 13, y - 2, '#ffd040'); rect(x - 16, y - 1, 2, 2, '#4a8a4a');
    for (let k = 0; k < 10; k++) px(x + 8 + k, y + Math.round(Math.sin(k * 0.6 + this.t * 3) * 1.5), '#4a8a4a');
    for (let k = 0; k < 9; k++) { rect(x - 4 + k, y - 2 - Math.round((9 - k) * f * 0.8), 1, 1 + Math.round(Math.abs(f) * 2), '#3a7a3a'); }
  };
  d.layer = 'field'; world.ents.push(d);
  yield* until(() => d.dead, 60);
}
function* evWhale() {
  const whale = new Ent({ x: W * rand(0.3, 0.7), t: 0 });
  whale.update = function (dt) { this.t += dt; this.x -= world.v * 0.16 * dt; if (this.t > 7) this.dead = true; };
  whale.draw = function () {
    const base = FIELD_TOP() - 6, k = Math.sin(clamp(this.t / 5, 0, 1) * Math.PI), x = Math.round(this.x);
    if (this.t < 5) { for (let i = 0; i < 16; i++) rect(x - 8 + i, base - Math.round(Math.sin(i / 16 * Math.PI) * 10 * k), 1, Math.round(Math.sin(i / 16 * Math.PI) * 10 * k), '#3a5a7a'); if (k > 0.5) for (let i = 0; i < 3; i++) px(x - 3 + i * 2, base - 10 * k - 3 - i % 2, '#e8f4ff'); }
    else { rect(x + 6, base - 6, 2, 6, '#3a5a7a'); rect(x + 3, base - 7, 8, 2, '#3a5a7a'); }
    if (this.t > 4.6 && this.t < 5.4) for (let i = 0; i < 6; i++) addPart(x + rand(-8, 8), base, rand(-10, 10), rand(-30, -15), 0.6, '#e8f4ff', { grav: 60 });
  };
  whale.layer = 'mid'; world.ents.push(whale);
  yield* until(() => whale.dead, 20);
}
function* evRace() {
  // a rider on horseback races the train, loses gracefully
  const r = new Ent({ x: -20, t: 0 });
  r.update = function (dt) { this.t += dt; this.x += (world.v * 0.42 + (this.t < 10 ? 34 : -10)) * dt - world.v * 0.42 * dt; if (this.x < -30 && this.t > 10) this.dead = true; };
  r.draw = function () {
    const base = RY - 13, x = Math.round(this.x), g = Math.floor(this.t * 10) % 2;
    rect(x - 6, base - 6, 11, 4, '#7a4a2a'); rect(x + 4, base - 9, 3, 4, '#7a4a2a'); rect(x + 6, base - 8, 2, 2, '#7a4a2a');
    for (const [lx, o] of [[-5, g], [-3, 1 - g], [2, g], [4, 1 - g]]) rect(x + lx + (o ? 1 : -1), base - 2, 1, 3, '#5a3a1a');
    rect(x - 7, base - 7, 2, 3, '#3a2a1a');
    rect(x - 1, base - 12, 3, 5, '#c84a3a'); rect(x - 1, base - 15, 3, 3, '#f4d0b0'); rect(x - 3, base - 16, 7, 1, '#8a5a2a'); rect(x - 1, base - 17, 3, 1, '#8a5a2a');
    if (chance(0.3)) addPart(x - 6, base, -rand(10, 20), -rand(2, 6), 0.5, '#d8c090', { puff: 1, grow: 2 });
  };
  r.layer = 'field'; world.ents.push(r);
  yield* until(() => r.dead, 40);
}
function* evRocket() {
  const x = W * rand(0.2, 0.6);
  const rk = new Ent({ x, y: FIELD_TOP() - 4, t: 0, trail: [] });
  rk.update = function (dt) { this.t += dt; this.x -= world.v * 0.05 * dt; if (this.t > 1.5) { const v = (this.t - 1.5) * 18; this.y -= v * dt; this.x += v * 0.25 * dt; this.trail.push([this.x, this.y + 3]); } if (this.y < -30) this.dead = true; };
  rk.draw = function () {
    for (const [i, [tx, ty]] of this.trail.entries()) { const age = (this.trail.length - i) / 60; disc(tx - world.v * 0.05 * age, ty, 1 + age * 2.5, `rgba(240,240,246,${clamp(0.8 - age * 0.25, 0, 0.8)})`); }
    rect(this.x - 1, this.y - 7, 3, 7, '#f0f0f4'); px(this.x, this.y - 8, '#e84a3a'); if (this.t > 1.5) { px(this.x, this.y + 1, '#ffd040'); px(this.x, this.y + 2, '#ff8030'); }
  };
  rk.layer = 'mid'; world.ents.push(rk);
  yield* until(() => rk.dead, 60);
}
const COMMON = { freight: 1.2, cows: 1, balloons: 1, birds: 1.2, wave: 1, crossing: 1, station: 1.3, tunnel: 1.1, bridge: 1.1, rain: 0.8, plane: 0.8 };
const RARE = { ufo: 1, dragon: 0.8, whale: 1, race: 1, rocket: 1 };
const FITS = {   // where an event makes sense
  cows: b => b === 'farm', tunnel: b => b === 'mountain' || b === 'snow' || b === 'forest', bridge: b => b === 'lake' || b === 'forest' || b === 'farm',
  station: b => b === 'town' || b === 'farm' || b === 'coast', crossing: b => b === 'farm' || b === 'town' || b === 'desert', whale: b => b === 'coast',
  race: b => b === 'desert' || b === 'farm', dragon: b => b === 'mountain' || b === 'snow', freight: b => b !== 'coast',
};
const EVENTS = { freight: evFreight, cows: evCows, balloons: evBalloons, birds: evBirds, wave: evWave, crossing: () => evPiece('crossing'), station: () => evPiece('station'), tunnel: () => evPiece('tunnel'), bridge: () => evPiece('bridge'), rain: evRain, plane: evPlane,
  ufo: evUfo, dragon: evDragon, whale: evWhale, race: evRace, rocket: evRocket };
const director = { cur: null, name: '', cool: 6, last: '', idx: 0 };
function runDirector(dt) {
  if (director.cur) {
    let r;
    try { r = director.cur.next(dt); } catch (e) { console.error(director.name, e); r = { done: true }; }
    if (r.done) { director.cur = null; director.name = ''; director.cool = FORCE ? 3 : rand(8, 20); cleanupEvent(); }
  } else if ((director.cool -= dt) <= 0) {
    const bm = biomeAt(world.dist + W).b, all = Object.keys(EVENTS);
    let name;
    if (FORCE) name = FORCE === 'all' ? all[director.idx++ % all.length] : FORCE;
    else {
      const fit = (tbl) => Object.fromEntries(Object.entries(tbl).map(([k, w]) => [k, FITS[k] && !FITS[k](bm) ? 0 : w]));
      do { name = chance(0.1) ? weighted(fit(RARE)) : weighted(fit(COMMON)); } while (name === director.last);
    }
    if (!EVENTS[name]) { director.cool = 5; return; }
    director.last = director.name = name;
    director.cur = EVENTS[name]();
    try { director.cur.next(0); } catch (e) { console.error(name, e); director.cur = null; cleanupEvent(); }
  }
}
function cleanupEvent() { world.rain = 0; if (world.vTarget < 55 && !world.stop) world.vTarget = 55; }
// scenery set pieces also appear on their own when the route passes through their home biome
function autoPieces() {
  const b = biomeAt(world.dist + W + 60);
  if (director.cur && ['station', 'tunnel', 'bridge', 'crossing'].includes(director.name)) return;
  if (b.b === 'mountain' && b.into > 600 && b.into < 700 && !world.pieces.some(p => p.kind === 'tunnel')) placePiece('tunnel', 60);
  if (b.b === 'lake' && b.into > 900 && b.into < 1000 && !world.pieces.some(p => p.kind === 'bridge')) placePiece('bridge', 60);
  if (b.b === 'town' && b.into > 1200 && b.into < 1300 && !director.cur) { director.cur = stationStop(placePiece('station', 60) || { x0: world.dist + W + 60, len: 230, name: 'SNUGWICK', kind: 'station' }); director.name = 'station'; }
}

// ---------------------------------------------------------------- main loop
function localHour() {
  const d = new Date();
  if (TIME_FORCE) { const [h, m] = TIME_FORCE.split(':').map(Number); return ((h || 0) + (m || 0) / 60 + world.t / 3600 * (TIME_SCALE > 1 ? 20 : 1)) % 24; }
  return d.getHours() + d.getMinutes() / 60;
}
const scene = { stars: [], clouds: [] };
function update(dt) {
  world.t += dt;
  world.wind = 0.3 + Math.sin(world.t * 0.1) * 0.2;
  // speed: cruise, or brake smoothly for a station
  if (world.stop !== null && world.stop !== undefined) {
    const d = world.stop - world.dist;
    world.v = d > 0 ? Math.min(world.v, Math.sqrt(2 * 9 * d) + 0.3) : 0;
  } else world.v = lerp(world.v, world.vTarget, 1 - Math.exp(-dt / 3));
  world.dist += world.v * dt;
  autoPieces();
  runDirector(dt);
  for (const [k, L] of Object.entries(layers)) genItems(L, k);
  for (const e of world.ents) if (!e.dead) e.update(dt);
  world.ents = world.ents.filter(e => !e.dead);
  for (const it of layers.back.items) if (it.moo > 0) it.moo -= dt;
  for (const c of train.cars) for (const s of c.seats || []) if (s && s.wave > 0) s.wave -= dt;
  for (const p of world.parts) { p.life -= dt; p.vy += p.grav * dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.puff) p.vy *= Math.pow(0.4, dt); }
  world.parts = world.parts.filter(p => p.life > 0);
  if (world.rain > 0) for (let i = 0; i < world.rain * dt * 140 * (W / 300); i++) addPart(rand(0, W + 40), -2, -40 - world.v * 0.8, rand(160, 200), 1.2, '#b8c8e0', { rain: true });
  for (const f of world.fx) f.t += dt;
  world.fx = world.fx.filter(f => f.t < f.dur);
  world.lightning = Math.max(0, world.lightning - dt * 2);
}
function render() {
  const t = world.t;
  sky(t);
  for (const f of world.fx) if (f.rainbow) drawRainbow(f);
  for (const e of world.ents) if (!e.layer) e.draw();
  drawFar();
  drawMid();
  for (const e of world.ents) if (e.layer === 'mid') e.draw();
  drawField();
  for (const e of world.ents) if (e.layer === 'fieldBack') e.draw();
  const lb = layerX(layers.back);
  for (const it of layers.back.items) { const sx = Math.round(it.x - lb); if (sx > -40 && sx < W + 40) drawBackItem(it, sx); }
  for (const e of world.ents) if (e.layer === 'field') e.draw();
  drawPiecesBack();
  drawTrack();
  const lg = layerX(layers.ground);
  for (const it of layers.ground.items) { const sx = Math.round(it.x - lg); if (sx > -20 && sx < W + 20 && !pieceAt(it.x)) drawGroundItem(it, sx); }
  drawWires(layers.ground.items);
  drawTrain(t);
  drawPiecesFront();
  const lf = layerX(layers.front);
  for (const it of layers.front.items) { const sx = Math.round(it.x - lf); if (sx > -30 && sx < W + 30) drawFrontItem(it, sx); }
  // smoke + particles
  for (const p of world.parts) {
    const k = p.life / p.max;
    if (p.rain) { ctx.fillStyle = '#b8c8e0'; ctx.fillRect(Math.round(p.x), Math.round(p.y), 1, 3); continue; }
    if (p.puff) { ctx.globalAlpha = clamp(k * 1.4, 0, 0.85); disc(p.x, p.y, p.puff + (1 - k) * p.grow, p.col); ctx.globalAlpha = 1; continue; }
    px(p.x, p.y, p.col);
  }
  for (const f of world.fx) if (f.toot) { const k = f.t / f.dur; if (Math.floor(k * 8) % 2 === 0) text('TOOT TOOT!', train.front - 34, RY - 60 - k * 6, '#ffffff', '#00000080'); }
  // night: darken, then lights
  if (world.night > 0.02) {
    ctx.globalCompositeOperation = 'multiply';
    ctx.fillStyle = rgbStr(mixRgb([255, 255, 255], [60, 70, 130], world.night * 0.88));
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'source-over';
    // lit windows cut through the dark
    for (const [x, y, pax, wx, wy] of train.windows || []) { if (tunnelCovers(x)) continue; rect(x - 2, y - 4, 5, 8, '#ffd88a'); drawPassenger(pax, wx, wy, world.t); }
  }
  for (const [x, y] of train.windows || []) glowAt(x, y, 10, '#ffc860', 0.35);
  flushGlows();
  if (world.dusk > 0.05 && world.night < 0.9) { ctx.globalCompositeOperation = 'soft-light'; ctx.globalAlpha = world.dusk * 0.4; rect(0, 0, W, H, '#ff9a5a'); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; }
  if (world.lightning > 0.02) { ctx.globalAlpha = world.lightning * 0.4; rect(0, 0, W, H, '#e8ecff'); ctx.globalAlpha = 1; }
  if (DEBUG) text(`${director.name || '-'} ${biomeAt(world.dist).b} V${Math.round(world.v)}`, 3, 3, '#ffffff', '#000000');
}
function drawRainbow(f) {
  const a = Math.sin(clamp(f.t / f.dur, 0, 1) * Math.PI) * 0.45, cx = W * 0.4, cy = RY + 20, R = RY * 0.9;
  const cols = ['#ff5a5a', '#ffa040', '#ffe060', '#6ad06a', '#5aa0ff', '#8a6aff'];
  ctx.globalAlpha = a;
  for (const [i, c] of cols.entries()) { ctx.strokeStyle = c; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(cx, cy, R - i * 2, Math.PI, TAU); ctx.stroke(); }
  ctx.globalAlpha = 1;
}
function resize() {
  H = ROWS; W = Math.round((ROWS * innerWidth) / innerHeight);
  canvas.width = W; canvas.height = H;
  ctx.imageSmoothingEnabled = false;
  RY = H - 34;
  train.front = Math.round(W * 0.8);
  buildTrain();
  scene.stars = Array.from({ length: Math.round(W * RY / 50) }, () => ({ x: randi(0, W - 1), y: randi(0, Math.round(RY * 0.7)), ph: rand(0, TAU) }));
  scene.clouds = Array.from({ length: 6 }, () => ({ x: rand(0, W + 80), y: rand(RY * 0.08, RY * 0.4), puffs: Array.from({ length: randi(3, 5) }, (_, i) => [i * 5 + rand(-2, 2), rand(-2, 2), rand(3, 6)]) }));
  for (const L of Object.values(layers)) { L.items = []; L.next = layerX(L) - 60; }
  world.pieces = []; world.ents = []; world.parts = [];
  director.cur = null; director.cool = 6;
}
addEventListener('resize', resize);
resize();
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  if (now - last < 1000 / FPS - 1) return;
  const dt = Math.min(0.1, (now - last) / 1000) * TIME_SCALE;
  last = now;
  try { const steps = Math.ceil(dt / 0.05); for (let i = 0; i < steps; i++) update(dt / steps); render(); } catch (e) { console.error(e); }
}
requestAnimationFrame(frame);
</script>
</body>
