/* =====================================================================
   PIXEL DINO VALLEY — a prehistoric valley under a smoking volcano

   compys scurry, pterosaurs glide over the lake and a nest of eggs waits in the ferns.
   Day and night follow your clock; at night the herd sleeps and the volcano glows.
   Options (add to the end of the address, combine with &):
     #pixels=200        vertical resolution in big pixels
     #herd=many         resident dinosaurs: few / many

     #event=trex        test mode: repeat one event (or "all")

const params = new URLSearchParams(location.hash.slice(1));

  6: '.XXX..XXXX.XXXX', 7: 'XXX..X.X..X..X.', 8: 'XXXX.XXXXX.XXXX', 9: 'XXXX.XXXX..XXX.', ':': '....X.....X....', '?': 'XX...X.X.....X.',

const textW = s => String(s).length * 4 - 1;

icon('heart', ['.X.X.', 'XoXXX', 'XXXXX', '.XXX.', '..X..'], '#ff5a8a');

// ---------------------------------------------------------------- dinosaur sprites (all face right; anchor = feet)
// walk phase for a leg: returns [dx, lift]
function legPhase(pose, k) {

  if (world.rain > 0) for (let i = 0; i < world.rain * dt * 150 * (W / 320); i++) addPart(rand(-10, W + 20), -3, -18, rand(160, 200), 1.6, '#b8c8dc', { rain: true, land: rand(HOR, H) });
  for (const p of world.parts) if (p.rain && p.y > p.land) { p.life = 0; if (onLake(p.x, p.y)) addRipple(p.x, p.y); }
  if (world.ash > 0) for (let i = 0; i < world.ash * dt * 40; i++) addPart(rand(0, W), -2, rand(-4, 4), rand(8, 14), 12, '#8a8488', { ash: true });
  for (const p of world.popups) p.t += dt; world.popups = world.popups.filter(p => p.t < 1.6);
  for (const r of ripples) r.r += dt * 6; for (let i = ripples.length - 1; i >= 0; i--) if (ripples[i].r > ripples[i].max) ripples.splice(i, 1);
  for (const c of scene.clouds) { c.x += dt * (2 + world.cloud * 4); if (c.x > W + 50) { c.x = -50; c.y = rand(H * 0.05, H * 0.3); } }
  for (const e of world.eggs) if (e.rolling) { e.rolling.t += dt; if (e.rolling.t > 2.5) e.rolling = null; }
  world.shake = Math.max(0, world.shake - dt * 1.5);
  world.lightning = Math.max(0, world.lightning - dt * 3);
  world.flash = Math.max(0, world.flash - dt * 3);
  if (world.boltT > 0) world.boltT -= dt;
  if (world.rainbow > 0) world.rainbow = Math.max(0, world.rainbow - dt / 30);
  // fireflies/dragonflies
  for (const f of scene.flies) { f.ph += dt; f.x += (Math.sin(f.ph * 0.7 + f.s) * 10 + Math.sin(f.ph * 2.3) * 4) * dt; f.y += Math.cos(f.ph * 0.9 + f.s) * 6 * dt; if (f.x < 0) f.x = W; if (f.x > W) f.x = 0; f.y = clamp(f.y, HOR - 10, H - 10); }
}
function drawSky() {
  const n = world.night, d = world.dusk, g = world.cloud;
  let top = mixRgb([96, 168, 226], [10, 12, 36], n), bot = mixRgb([214, 236, 222], [40, 38, 78], n);
  top = mixRgb(top, [120, 80, 140], d * 0.4); bot = mixRgb(bot, [250, 160, 110], d * 0.85);
  top = mixRgb(top, mixRgb([110, 116, 126], [22, 24, 34], n), g * 0.75); bot = mixRgb(bot, mixRgb([150, 150, 150], [36, 36, 48], n), g * 0.75);
  if (world.ash > 0) { top = mixRgb(top, [110, 90, 90], world.ash * 0.5); bot = mixRgb(bot, [200, 120, 80], world.ash * 0.5); }
  for (let y = 0; y < HOR; y++) { const k = clamp(y / (HOR * 0.95) + (bayer(y, y * 3) - 0.5) * 0.05, 0, 1); ctx.fillStyle = rgbStr(mixRgb(top, bot, k)); ctx.fillRect(0, y, W, 1); }
  if (n > 0.3) { const a = (n - 0.3) / 0.7 * (1 - g); for (const s of scene.stars) { const tw = 0.5 + 0.5 * Math.sin(world.t * 1.3 + s.ph); if (tw * a > 0.35) px(s.x, s.y, tw * a > 0.7 ? '#ffffff' : '#a0a8d8'); } }
  const sp = world.sunP; if (sp > -0.1 && sp < 1.1 && g < 0.8) { const x = W * (0.06 + 0.88 * sp), y = HOR - 10 - Math.sin(Math.PI * clamp(sp, 0, 1)) * HOR * 0.8; ctx.globalAlpha = 1 - g; disc(x, y, 8, d > 0.3 ? '#ffc890' : '#fff0c8'); disc(x, y, 6, d > 0.3 ? '#ffb070' : '#fffbe8'); ctx.globalAlpha = 1; }
  const mp = world.moonP; if (mp > -0.1 && mp < 1.1 && n > 0.3) { const x = W * (0.06 + 0.88 * mp), y = HOR - 10 - Math.sin(Math.PI * clamp(mp, 0, 1)) * HOR * 0.75; ctx.globalAlpha = clamp((n - 0.3) * 2, 0, 1) * (1 - g * 0.8); disc(x, y, 6, '#f4f0dc'); px(x - 2, y - 1, '#d8d4c0'); px(x + 1, y + 2, '#d8d4c0'); px(x + 2, y - 2, '#e0dcc8'); ctx.globalAlpha = 1; }
  if (world.meteor) { const m = world.meteor; disc(m.x, m.y, 3, '#ffffff'); disc(m.x, m.y, 2, '#fff8d0'); glowAt(m.x, m.y, 30, '#ffc070', 0.9, true); }
  for (const c of scene.clouds) {
    const col = rgbStr(mixRgb(mixRgb([255, 255, 255], [60, 64, 96], n), [150, 150, 158], g * 0.7)), sh = rgbStr(mixRgb(mixRgb([220, 226, 240], [44, 46, 72], n), [118, 118, 128], g * 0.7));
    for (const [dx, dy, r] of c.puffs) ellipse(c.x + dx, c.y + dy + 2, r * 1.7, r * 0.8, sh);
    for (const [dx, dy, r] of c.puffs) ellipse(c.x + dx, c.y + dy, r * 1.6, r * 0.75, col);
  }
  if (world.rainbow > 0) { const a = Math.min(1, world.rainbow * 3) * 0.35, cx = W * 0.45, cy = HOR + 10, R = HOR * 0.9; ctx.globalAlpha = a; ['#ff5a5a', '#ffa040', '#ffe060', '#6ad06a', '#5aa0ff', '#8a6aff'].forEach((c, i) => { ctx.strokeStyle = c; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(cx, cy, R - i * 2, Math.PI, TAU); ctx.stroke(); }); ctx.globalAlpha = 1; }
}
function drawLakeAndFalls() {
  // waterfall
  const top = Math.round(world.wfTop), bot = HOR + 3;
  for (let y = top; y < bot; y++) for (let x = WFX - 3; x <= WFX + 3; x++) {
    const streak = hash(x * 13.1) * 40, s = ((y - world.t * 46 + streak) % 9 + 9) % 9, edge = Math.abs(x - WFX) === 3;
    px(x, y, edge ? '#6a9ac0' : s < 1.5 ? '#f4fbff' : s < 4 ? '#b8dcf0' : x < WFX ? '#8ac0e0' : '#76acd4');
  }
  for (let x = WFX - 3; x <= WFX + 3; x++) px(x, top, '#e8f6ff');
  // foam pool + drifting mist at the foot of the falls
  ellipse(WFX, bot, 7, 2, '#d8eef8');
  for (let i = 0; i < 7; i++) { const a = world.t * 3 + i * 0.9, r = 4 + Math.sin(a) * 2; px(WFX + Math.cos(a * 1.3) * (r + 2), bot - 1 + Math.sin(a) * 1.2, '#ffffff'); }
  ctx.globalAlpha = 0.35; for (let i = 0; i < 4; i++) { const k = ((world.t * 0.2 + i / 4) % 1); disc(WFX + (i - 1.5) * 4 + k * 6, bot - 2 - k * 10, 2 + k * 3, '#f0f8ff'); } ctx.globalAlpha = 1;
  // river sparkle
  const rv = world.river; for (let i = 0; i < 6; i++) { const k = ((world.t * 0.15 + i / 6) % 1); px(lerp(rv.x0, rv.x1, k), lerp(rv.y0, rv.y1, k) + Math.sin(k * 20), '#c8e8f8'); }
  ctx.drawImage(lakeCanvas, LAKEX - LAKERX - 1, LAKEY - LAKERY - 1);
  // reflections of the sky glow + shimmer
  for (let i = 0; i < 12; i++) { const x = LAKEX - LAKERX + ((i * 41 + world.t * 3) % (LAKERX * 2)), y = LAKEY - LAKERY + 1 + ((i * 17) % (LAKERY * 2 - 1)); if (onLake(x, y)) { ctx.globalAlpha = 0.35; rect(x, y, 3, 1, '#d0ecf8'); ctx.globalAlpha = 1; } }
  if (world.lava > 0.3 || world.night > 0.5) { const k = Math.max(world.lava - 0.2, world.night * 0.25); const rx = LAKEX + (VX - LAKEX) * 0.55; for (let y = LAKEY - LAKERY + 1; y < LAKEY + LAKERY; y += 1) { if (!onLake(rx, y) || hash2(y, Math.floor(world.t * 6)) < 0.35) continue; ctx.globalAlpha = clamp(k * 0.8, 0, 0.7); rect(rx - 2 + Math.sin(y * 1.7 + world.t * 3) * 1.5, y, 3 + (y % 2), 1, '#ff9050'); } ctx.globalAlpha = 1; }
  for (const r of ripples) { ctx.globalAlpha = 0.6 * (1 - r.r / r.max); ctx.strokeStyle = '#e0f4ff'; for (let a = 0; a < TAU; a += 0.5) px(r.x + Math.cos(a) * r.r, r.y + Math.sin(a) * r.r * 0.35, '#e0f4ff'); ctx.globalAlpha = 1; }
}
function drawNest() {
  const x = NESTX, y = NESTY;
  ellipse(x, y + 1, 12, 3, '#6a4a2a'); ellipse(x, y, 11, 2.4, '#9a7040');
  for (let i = 0; i < 16; i++) { const a = (i / 16) * TAU; line(x + Math.cos(a) * 9, y + Math.sin(a) * 2, x + Math.cos(a + 0.4) * 12, y + Math.sin(a + 0.4) * 3, '#b88a50'); }
  for (const e of world.eggs) {
    if (e.hatched) { px(e.x - 1, e.y + 1, '#f4ecd8'); px(e.x + 1, e.y + 1, '#e8dcc0'); continue; }
    if (e.stolen) continue;
    let ex = e.x, ey = e.y;
    if (e.rolling) { const k = smooth(0, 2.5, e.rolling.t); ex = lerp(e.rolling.x, e.x, k); ey = e.y + Math.abs(Math.sin(k * 12)) * -2; }
    ex += e.wob || 0;
    ellipse(ex, ey - 2, 2, 2.6, '#6a5a44'); ellipse(ex, ey - 2, 1.6, 2.2, '#f4ecd8'); px(ex - 0.5, ey - 3.5, '#ffffff'); px(ex + 0.5, ey - 1, '#b8a888');
    if (e.crack > 0.3) { px(ex - 1, ey - 2, INK); px(ex, ey - 2.5, INK); px(ex + 1, ey - 2, INK); }
  }
}
function render() {
  ctx = mainCtx;
  ctx.save();
  if (world.shake > 0.01) ctx.translate(Math.round(rand(-1, 1) * world.shake * 3), Math.round(rand(-1, 1) * world.shake * 2));
  drawSky();
  drawVolcanoSmoke();
  ctx.drawImage(bgCanvas, 0, 0);
  // crater glow
  const lv = world.lava;
  ellipse(VX, world.craterY, 3 + lv * 2, 1.2, lv > 0.5 ? '#ffd060' : '#e0602a');
  glowAt(VX, world.craterY, 14 + lv * 30, '#ff7030', 0.35 + lv * 0.5, lv > 0.5);
  drawLakeAndFalls();
  // skyfliers first, then ground y-sorted
  for (const a of world.ents) if (a.layer === 'sky' && !a.dead) { a.draw(); if (a.fish) { px(a.x + a.f * 12, a.y + 2, '#c0d8e0'); px(a.x + a.f * 13, a.y + 2, '#a8c0c8'); } }
  for (const a of world.ents) if (a.layer === 'lake' && !a.dead) drawPlesio(a);
  const list = world.ents.filter(a => a.layer === 'ground' && !a.dead && !a.hidden);
  list.push({ y: NESTY, draw: drawNest });
  list.sort((a, b) => a.y - b.y);
  for (const a of list) a.draw();
  if (world.portal) { const p = world.portal; for (let k = 0; k < 4; k++) { ctx.globalAlpha = 0.5 - k * 0.1; ellipse(p.x, p.y, p.r * 0.55 - k, p.r - k * 1.5, ['#8a5aff', '#5ab0ff', '#b8f0ff', '#ffffff'][k]); } ctx.globalAlpha = 1; glowAt(p.x, p.y, p.r * 2.5, '#8ab0ff', 0.7, true); }
  ctx.drawImage(frontCanvas, 0, 0);
  // particles
  for (const p of world.parts) {
    if (p.rain) { ctx.fillStyle = p.col; ctx.fillRect(Math.round(p.x), Math.round(p.y), 1, 3); continue; }
    if (p.dust || p.smoke) { ctx.globalAlpha = clamp(p.life / p.max, 0, 0.7); disc(p.x, p.y, 1.5 + (1 - p.life / p.max) * 2, p.col); ctx.globalAlpha = 1; continue; }
    if (p.lava || p.bomb) { px(p.x, p.y, p.col); if (p.bomb) { disc(p.x, p.y, 1.5, '#ff8a40'); glowAt(p.x, p.y, 8, '#ff6020', 0.6, true); } continue; }
    if (p.glow) { ctx.globalAlpha = clamp(p.life / p.max, 0, 1); px(p.x, p.y, p.col); ctx.globalAlpha = 1; continue; }
    px(p.x, p.y, p.col);
  }
  // lightning bolt
  if (world.boltT > 0) { let x = world.boltX, y = 0; ctx.fillStyle = '#f8f8ff'; while (y < HOR + 10) { const nx = x + rand(-5, 5), ny = y + rand(4, 9); line(x, y, nx, ny, '#f8f8ff'); x = nx; y = ny; } }
  // night + lights
  if (world.night > 0.02 || world.cloud > 0.05) {
    ctx.globalCompositeOperation = 'multiply';
    const k = Math.max(world.night * 0.86, world.cloud * 0.3);
    ctx.fillStyle = rgbStr(mixRgb([255, 255, 255], [56, 64, 124], k));
    ctx.fillRect(-4, -4, W + 8, H + 8);
    ctx.globalCompositeOperation = 'source-over';
    for (const f of scene.flies) { const b = Math.max(0, Math.sin(world.t * 2 + f.s * 3)); if (world.night > 0.5 && b > 0.3) { px(f.x, f.y, '#e8ff90'); glowAt(f.x, f.y, 4, '#c8ff60', b * 0.6); } }
    // crater + lava glow cut through the dark
    ellipse(VX, world.craterY, 3 + lv * 2, 1.2, '#ffb050');
    glowAt(VX, world.craterY + 6, 26 + lv * 30, '#ff6020', 0.5 + lv * 0.4, true);
  }
  flushGlows();
  if (world.dusk > 0.05 && world.night < 0.95) { ctx.globalCompositeOperation = 'soft-light'; ctx.globalAlpha = world.dusk * 0.4; rect(-4, -4, W + 8, H + 8, '#ff9a5a'); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; }
  if (world.lightning > 0.02) { ctx.globalAlpha = world.lightning * 0.45; rect(-4, -4, W + 8, H + 8, '#e8ecff'); ctx.globalAlpha = 1; }
  if (world.flash > 0.02) { ctx.globalAlpha = world.flash * 0.6; rect(-4, -4, W + 8, H + 8, '#ffffff'); ctx.globalAlpha = 1; }
  for (const p of world.parts) if (p.ash) { ctx.globalAlpha = 0.6; px(p.x, p.y, p.col); ctx.globalAlpha = 1; }
  for (const a of world.ents) if (!a.dead && !a.hidden) a.drawEmotes();
  for (const p of world.popups) { const k = p.t / 1.6; if (k > 0.7 && Math.floor(world.t * 10) % 2) continue; text(p.str, p.x - textW(p.str) / 2 + 6, p.y - k * 6, p.col, '#00000080'); }
  ctx.restore();
  if (DEBUG) { const h = localHour(); text(`${director.name || '-'} ${String(Math.floor(h)).padStart(2, '0')}:${String(Math.floor((h % 1) * 60)).padStart(2, '0')} N${world.ents.length}`, 3, 3, '#ffffff', '#000000'); }
}
function drawPlesio(a) {
  const s = a.sprite(), rise = a.rise == null ? 1 : a.rise, sh = Math.round((1 - rise) * s.h);
  const X = Math.round(a.x - (a.f > 0 ? s.ax : s.w - 1 - s.ax)), Y = Math.round(LAKEY + 1 - s.h + sh);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, LAKEY + 1); ctx.clip();
  ctx.drawImage(a.f > 0 ? s.r : s.l, X, Y);
  ctx.restore();
  ellipse(a.x, LAKEY + 1, 5, 1, '#8ac8e8');
}

// ---------------------------------------------------------------- setup + main loop
function resize() {
  H = ROWS; W = Math.max(120, Math.round((ROWS * innerWidth) / Math.max(1, innerHeight)));
  canvas.width = W; canvas.height = H;
  mainCtx.imageSmoothingEnabled = false;
  layout();
  bakeBackground();
  scene.stars = Array.from({ length: Math.round(W * HOR / 60) }, () => ({ x: randi(0, W - 1), y: randi(0, HOR - 20), ph: rand(0, TAU) }));
  scene.clouds = Array.from({ length: 5 }, () => ({ x: rand(-20, W + 20), y: rand(H * 0.05, H * 0.3), puffs: Array.from({ length: randi(3, 5) }, (_, i) => [i * 7 + rand(-2, 2), rand(-1.5, 1.5), rand(3, 5)]) }));
  scene.flies = Array.from({ length: 14 }, () => ({ x: rand(0, W), y: rand(HOR, H), ph: rand(0, 10), s: rand(0, 10) }));
  world.parts = []; world.popups = []; ripples.length = 0;
  evActors.length = 0;
  makeResidents();
  director.cur = null; director.cool = FORCE ? 3 : 6;
  for (let i = 0; i < 60; i++) update(1 / 30);
}
addEventListener('resize', resize);
resize();
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  if (now - last < 1000 / FPS - 1) return;
  const dt = Math.min(0.1, (now - last) / 1000) * TIME_SCALE;
  last = now;
  try { const steps = Math.ceil(dt / 0.05); for (let i = 0; i < steps; i++) update(dt / steps); render(); } catch (e) { console.error(e); }
}
requestAnimationFrame(frame);
</script>
