<!doctype html>
<html>
<head>

<title>Pixel Pirate Voyage Wallpaper</title>
<script type="application/json" id="wallpaper-settings">
{
 "about": "Settings panel for the Backgrounds app. Each param is one #key=value option of this page.",
 "name": "Pirate Voyage",
 "description": "A pirate ship on an endless voyage: crew, parrot, dolphins, storms and sea monsters.",
 "params": [

  {"key": "sails", "label": "Sail colour", "type": "select", "default": "", "options": [["", "Random"], ["canvas", "Canvas"], ["black", "Black"], ["red", "Red"], ["striped", "Striped"]]},
  {"key": "sea", "label": "Sea", "type": "select", "default": "", "options": [["", "Changes by itself"], ["calm", "Calm"], ["rough", "Rough"]]},

  {"key": "event", "label": "Repeat one event", "type": "select", "group": "testing", "default": "", "options": [["", "Off (normal)"], ["dolphins", "dolphins"], ["whale", "whale"], ["island", "island"], ["storm", "storm"], ["navy", "navy"], ["treasure", "treasure"], ["shanty", "shanty"], ["bottle", "bottle"], ["overboard", "overboard"], ["gull", "gull"], ["fishing", "fishing"], ["kraken", "kraken"], ["ghost", "ghost"], ["serpent", "serpent"], ["mermaid", "mermaid"], ["glow", "glow"], ["all", "all"]], "help": "Test mode: keeps repeating one event. 'all' cycles through every event."},
  {"key": "speed", "label": "Time speed", "type": "range", "min": 0.25, "max": 10, "step": 0.25, "default": 1, "group": "testing", "help": "Runs time faster (for testing)."},

<body>
<canvas id="c"></canvas>
<script>
/* =====================================================================
   PIXEL PIRATE VOYAGE — a pirate ship on an endless voyage
   The camera sails alongside a little galleon. The ship rides the swell (it pitches
   pixel-perfectly), the crew works the deck, the captain holds the wheel with a parrot
   on hand and the ship's monkey climbs the rigging. Day and night follow your clock.
   Options (add to the end of the address, combine with &):
     #pixels=200        vertical resolution in big pixels
     #sails=black       sail colour: canvas black red striped
     #sea=rough         calm or rough (default: changes by itself)
     #time=21:00        pretend local time
     #event=kraken      test mode: repeat one event (or "all")
     #speed=3           run time faster (testing)
     #debug             event name, time
   Events: dolphins whale island storm navy treasure shanty bottle overboard gull fishing
   Rare:   kraken  ghost (ghost ship)  serpent  mermaid  glow (glowing sea)
   ===================================================================== */
const params = new URLSearchParams(location.hash.slice(1));
const num = (k, d) => { const v = parseFloat(params.get(k)); return Number.isFinite(v) ? v : d; };
const ROWS = Math.round(Math.min(600, Math.max(80, num('pixels', 200))));
const FORCE = params.get('event');
const TIME_SCALE = num('speed', 1);
const DEBUG = params.has('debug');
const TIME_FORCE = params.get('time');
const SAILS = params.get('sails') || '';
const SEA = params.get('sea') || '';
const FPS = 30;

const canvas = document.getElementById('c');
const mainCtx = canvas.getContext('2d');
let ctx = mainCtx;
let W, H;

// ---------------------------------------------------------------- utils
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const chance = p => Math.random() < p;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const TAU = Math.PI * 2;
function weighted(obj) {
  const e = Object.entries(obj).filter(([, w]) => w > 0);
  if (!e.length) return null;
  let r = Math.random() * e.reduce((a, [, w]) => a + w, 0);
  for (const [k, w] of e) if ((r -= w) < 0) return k;
  return e[0][0];
}
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v + 0.5) / 16);
const bayer = (x, y) => BAYER[((y & 3) * 4) + (x & 3)];
const hexRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const rgbStr = c => `rgb(${c.map(v => Math.round(clamp(v, 0, 255))).join(',')})`;
const mixRgb = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
const mixHex = (a, b, t) => rgbStr(mixRgb(hexRgb(a), hexRgb(b), t));
function px(x, y, c) { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), 1, 1); }
function rect(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }
function disc(cx, cy, r, c) { if (c) ctx.fillStyle = c; cx = Math.round(cx); cy = Math.round(cy); for (let dy = -Math.floor(r); dy <= r; dy++) { const w = Math.floor(Math.sqrt(Math.max(0, r * r - dy * dy))); ctx.fillRect(cx - w, cy + dy, w * 2 + 1, 1); } }
function ellipse(cx, cy, rx, ry, c) { ctx.fillStyle = c; for (let dy = -Math.ceil(ry); dy <= ry; dy++) { const k = 1 - (dy * dy) / (ry * ry); if (k < 0) continue; const w = Math.round(rx * Math.sqrt(k)); ctx.fillRect(Math.round(cx - w), Math.round(cy + dy), w * 2 + 1, 1); } }
function line(x0, y0, x1, y1, c, w = 1) { const n = Math.ceil(Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0))) || 1; ctx.fillStyle = c; for (let i = 0; i <= n; i++) ctx.fillRect(Math.round(lerp(x0, x1, i / n) - (w - 1) / 2), Math.round(lerp(y0, y1, i / n) - (w - 1) / 2), w, w); }
const hash = n => { n = Math.sin(n * 127.1 + 311.7) * 43758.5453; return n - Math.floor(n); };
const hash2 = (x, y) => hash(x * 57.3 + y * 131.7);
function vnoise(x) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(hash(i), hash(i + 1), u); }
function mk(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; }
function withCtx(c, fn) { const old = ctx; ctx = c.getContext('2d'); ctx.imageSmoothingEnabled = false; try { fn(); } finally { ctx = old; } }
const FONT = {
  A: '.X.X.XXXXX.XX.X', B: 'XX.X.XXX.X.XXX.', C: '.XXX..X..X...XX', D: 'XX.X.XX.XX.XXX.', E: 'XXXX..XX.X..XXX', F: 'XXXX..XX.X..X..',
  G: '.XXX..X.XX.X.XX', H: 'X.XX.XXXXX.XX.X', I: 'XXX.X..X..X.XXX', J: '..X..X..XX.X.X.', K: 'X.XX.XXX.X.XX.X', L: 'X..X..X..X..XXX',
  M: 'X.XXXXXXXX.XX.X', N: 'XX.X.XX.XX.XX.X', O: '.X.X.XX.XX.X.X.', P: 'XX.X.XXX.X..X..', Q: '.X.X.XX.XXX..XX', R: 'XX.X.XXX.X.XX.X',
  S: '.XXX...X...XXX.', T: 'XXX.X..X..X..X.', U: 'X.XX.XX.XX.XXXX', V: 'X.XX.XX.XX.X.X.', W: 'X.XX.XXXXXXXX.X', X: 'X.XX.X.X.X.XX.X',
  Y: 'X.XX.X.X..X..X.', Z: 'XXX..X.X.X..XXX', ' ': '...............', '!': '.X..X..X.....X.', '-': '......XXX......', '.': '.............X.',
  0: 'XXXX.XX.XX.XXXX', 1: '.X.XX..X..X.XXX', 2: 'XX...X.X.X..XXX', 3: 'XX...X.X...XXX.', 4: 'X.XX.XXXX..X..X', 5: 'XXXX..XX...XXX.',
  6: '.XXX..XXXX.XXXX', 7: 'XXX..X.X..X..X.', 8: 'XXXX.XXXXX.XXXX', 9: 'XXXX.XXXX..XXX.', ':': '....X.....X....', '?': 'XX...X.X.....X.', "'": '.X..X..........',
};
const textW = s => String(s).length * 4 - 1;
function text(str, x, y, col = '#ffffff', shadow = null) {
  str = String(str).toUpperCase();
  const draw = (ox, oy, c) => { ctx.fillStyle = c; for (let i = 0; i < str.length; i++) { const g = FONT[str[i]] || FONT['?']; for (let k = 0; k < 15; k++) if (g[k] === 'X') ctx.fillRect(Math.round(x + ox + i * 4 + (k % 3)), Math.round(y + oy + Math.floor(k / 3)), 1, 1); } };
  if (shadow) draw(1, 1, shadow);
  draw(0, 0, col);
}

// ---------------------------------------------------------------- sprite builder
const INK = '#22181a';
class SB {
  constructor(w, h) { this.w = w; this.h = h; this.g = new Array(w * h).fill(null); }
  set(x, y, c) { x = Math.round(x); y = Math.round(y); if (x >= 0 && y >= 0 && x < this.w && y < this.h) this.g[y * this.w + x] = c; return this; }
  get(x, y) { return x >= 0 && y >= 0 && x < this.w && y < this.h ? this.g[y * this.w + x] : null; }
  ell(cx, cy, rx, ry, c, shade) {
    for (let y = Math.floor(cy - ry - 1); y <= Math.ceil(cy + ry + 1); y++)
      for (let x = Math.floor(cx - rx - 1); x <= Math.ceil(cx + rx + 1); x++) {
        const dx = (x - cx) / (rx + 0.35), dy = (y - cy) / (ry + 0.35);
        if (dx * dx + dy * dy > 1) continue;
        this.set(x, y, shade && dx * 0.35 + dy * 0.95 > 0.5 ? shade : c);
      }
    return this;
  }
  rect(x, y, w, h, c) { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) this.set(x + i, y + j, c); return this; }
  seg(x0, y0, x1, y1, r, c, shade) { const n = Math.ceil(Math.hypot(x1 - x0, y1 - y0) * 2) + 1; for (let i = 0; i <= n; i++) { const t = i / n; this.ell(lerp(x0, x1, t), lerp(y0, y1, t), r, r, c, shade); } return this; }
  line(x0, y0, x1, y1, c) { const n = Math.ceil(Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0))) || 1; for (let i = 0; i <= n; i++) this.set(lerp(x0, x1, i / n), lerp(y0, y1, i / n), c); return this; }
  outline(c = INK) {
    const add = [];
    for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) {
      if (this.get(x, y)) continue;
      if (this.get(x - 1, y) || this.get(x + 1, y) || this.get(x, y - 1) || this.get(x, y + 1)) add.push([x, y]);
    }
    for (const [x, y] of add) this.set(x, y, c);
    return this;
  }
}
function bake(b, ax, ay) {
  const r = mk(b.w, b.h), l = mk(b.w, b.h), rc = r.getContext('2d'), lc = l.getContext('2d');
  for (let y = 0; y < b.h; y++) for (let x = 0; x < b.w; x++) {
    const c = b.g[y * b.w + x]; if (!c) continue;
    rc.fillStyle = c; rc.fillRect(x, y, 1, 1); lc.fillStyle = c; lc.fillRect(b.w - 1 - x, y, 1, 1);
  }
  return { r, l, w: b.w, h: b.h, ax, ay };
}
function drawSpr(s, x, y, facing = 1, alpha = 1) {
  const X = Math.round(x - (facing > 0 ? s.ax : s.w - 1 - s.ax)), Y = Math.round(y - s.ay);
  if (alpha < 1) ctx.globalAlpha = Math.max(0, alpha);
  ctx.drawImage(facing > 0 ? s.r : s.l, X, Y);
  if (alpha < 1) ctx.globalAlpha = 1;
}
const ICONS = {};
function icon(name, rows, col) {
  const b = new SB(rows[0].length + 2, rows.length + 2);
  rows.forEach((r, y) => [...r].forEach((ch, x) => { if (ch !== '.') b.set(x + 1, y + 1, ch === 'o' ? '#ffffff' : col); }));
  ICONS[name] = bake(b.outline('#ffffff'), Math.floor(b.w / 2), b.h - 1);
}
icon('heart', ['.X.X.', 'XoXXX', 'XXXXX', '.XXX.', '..X..'], '#ff5a8a');
icon('note', ['..XX', '..XX', '..X.', 'XXX.', 'XX..'], '#6a5aff');
icon('bang', ['X', 'X', 'X', '.', 'X'], '#ff4a3a');
icon('q', ['XXX', '..X', '.X.', '...', '.X.'], '#3a6aff');
icon('sparkle', ['.X.', 'XoX', '.X.'], '#ffc83a');
icon('dots', ['X.X.X'], '#6a6070');
icon('sweat', ['.X', 'XX', 'XX'], '#5ab0ff');
icon('anger', ['X.X', '...', 'X.X'], '#ff4a3a');
icon('skull', ['XXX', 'oXo', 'XXX', 'X.X'], '#f4f0e8');
icon('coin', ['.XX.', 'XoXX', 'XXXX', '.XX.'], '#ffd23a');

// ---------------------------------------------------------------- world
const world = { t: 0, night: 0, dusk: 0, dist: 0, v: 22, parts: [], popups: [], fx: [], swell: 1, swellT: 1, rain: 0, cloud: 0, lightning: 0, glow: 0, fog: 0, shake: 0 };
let HOR, WL, SHIPX;     // horizon, waterline under the ship, ship anchor x
const SAIL_SETS = { canvas: ['#f2e8cc', '#d8c8a4', '#bfae88'], black: ['#3a3438', '#2a2428', '#1c181a'], red: ['#c8443a', '#a8342c', '#882820'], striped: ['#f2e8cc', '#d8c8a4', '#c8443a'] };
const SAIL = SAILS in SAIL_SETS ? SAILS : pick(['canvas', 'canvas', 'black', 'red', 'striped']);
function layout() {
  HOR = Math.round(H * 0.5);
  WL = Math.round(H * 0.72);
  SHIPX = Math.round(W * 0.42);
}
function localHour() {
  if (TIME_FORCE) { const [h, m] = TIME_FORCE.split(':').map(Number); return ((((h || 0) + (m || 0) / 60 + world.t / 3600) % 24) + 24) % 24; }
  const d = new Date(); return d.getHours() + d.getMinutes() / 60 + d.getSeconds() / 3600;
}
function updateLight() {
  const h = localHour();
  const day = smooth(5.3, 7.3, h) * (1 - smooth(18, 20, h));
  world.night = 1 - day;
  world.dusk = Math.max(Math.exp(-(((h - 6.4) / 0.8) ** 2)), Math.exp(-(((h - 19) / 0.8) ** 2))) * (1 - world.cloud * 0.7);
  world.sunP = (h - 6) / 12; world.moonP = (((h - 18) / 12) % 2 + 2) % 2;
}
// sea height at screen x for a row depth k (0 horizon .. 1 near)
function wave(x, k) {
  const X = x + world.dist * (0.3 + k * 1.0), s = world.swell * (0.3 + k * 1.2);
  return (Math.sin(X * 0.045 + world.t * 1.1) * 2.2 + Math.sin(X * 0.083 - world.t * 1.7 + 1.3) * 1.3 + Math.sin(X * 0.021 + world.t * 0.6) * 2.4) * s;
}

// ---------------------------------------------------------------- the ship (faces right; bow on the right)
let shipCanvas, sailFrames = [], hullW = 150, hullH = 110;
const DECK = 72, CASTLE = 58, MAST = { mizzen: 30, main: 70, fore: 108 };
function buildShip() {
  const w = hullW, h = hullH;
  shipCanvas = mk(w, h);
  withCtx(shipCanvas, () => {
    const WOOD = '#7a4a2c', WOODD = '#5a3420', WOODL = '#9a6238', GOLD = '#d8a840', RED = '#8a2e22';
    // hull profile: stern (left) high, bow (right) sweeping up, keel curve
    const top = x => x < 34 ? CASTLE : x > 118 ? lerp(DECK, DECK - 8, (x - 118) / 22) : DECK;
    const keel = x => DECK + 22 - Math.pow(Math.abs(x - 72) / 70, 2.2) * 18;
    for (let x = 6; x < 140; x++) {
      const t0 = Math.round(top(x)), k = Math.round(keel(x));
      for (let y = t0; y <= k; y++) {
        let c = WOOD;
        if ((y - t0) % 4 === 3) c = WOODD; else if ((y - t0) % 4 === 0) c = WOODL;
        if (y > k - 4) c = y > k - 2 ? '#5a2418' : RED;                       // copper-red bottom
        if (y >= DECK + 4 && y <= DECK + 6) c = y === DECK + 5 ? GOLD : '#a07a30';   // gold stripe
        if (x < 34 && y >= CASTLE + 3 && y <= CASTLE + 4) c = GOLD;
        ctx.fillStyle = c; ctx.fillRect(x, y, 1, 1);
      }
      ctx.fillStyle = INK; ctx.fillRect(x, t0 - 1, 1, 1); ctx.fillRect(x, k + 1, 1, 1);
    }
    for (const x of [6, 139]) rect(x - 1, top(x) - 1, 1, keel(x) - top(x) + 2, INK);
    // bulwark rails
    for (let x = 34; x < 118; x++) { px(x, DECK - 4, WOODD); if (x % 6 === 0) rect(x, DECK - 4, 1, 4, WOODD); }
    for (let x = 6; x < 34; x++) { px(x, CASTLE - 4, WOODD); if (x % 5 === 0) rect(x, CASTLE - 4, 1, 4, WOODD); }
    rect(33, CASTLE - 4, 2, DECK - CASTLE + 4, WOODD);
    // gun ports with cannon muzzles
    for (let x = 42; x < 118; x += 13) { rect(x, DECK + 9, 5, 4, '#2a1a14'); rect(x + 1, DECK + 10, 3, 2, '#1a1010'); px(x + 2, DECK + 11, '#5a5a66'); rect(x - 1, DECK + 8, 7, 1, WOODL); }
    // stern windows (lit at night — drawn again later)
    for (let i = 0; i < 3; i++) { rect(10 + i * 7, CASTLE + 7, 4, 5, '#2a1a14'); rect(11 + i * 7, CASTLE + 8, 2, 3, '#e8c878'); }
    rect(6, CASTLE + 6, 28, 1, GOLD);
    // stern lantern
    rect(4, CASTLE - 12, 1, 8, WOODD); rect(2, CASTLE - 14, 5, 5, GOLD); rect(3, CASTLE - 13, 3, 3, '#fff0b0');
    // figurehead + bowsprit
    line(136, DECK - 10, 150, DECK - 20, WOODD, 2);
    rect(138, DECK - 7, 3, 4, GOLD); px(141, DECK - 7, GOLD); px(139, DECK - 8, '#f0d070');
    // anchor
    line(126, DECK + 2, 126, DECK + 10, '#5a5a66'); line(123, DECK + 10, 129, DECK + 10, '#5a5a66'); px(123, DECK + 9, '#5a5a66'); px(129, DECK + 9, '#5a5a66');
    // helm wheel on the castle deck
    const wx = 26, wy = CASTLE - 7;
    for (let a = 0; a < TAU; a += 0.35) px(wx + Math.cos(a) * 4, wy + Math.sin(a) * 4, WOODD);
    for (let a = 0; a < TAU; a += Math.PI / 4) { line(wx, wy, wx + Math.cos(a) * 5.5, wy + Math.sin(a) * 5.5, WOODL); }
    rect(wx - 1, wy, 2, CASTLE - wy, WOODD);
    // masts
    for (const [x, t] of [[MAST.mizzen, 26], [MAST.main, 4], [MAST.fore, 14]]) { rect(x - 1, t, 3, (x < 34 ? CASTLE : DECK) - t, '#6a4028'); rect(x - 1, t, 1, (x < 34 ? CASTLE : DECK) - t, '#8a5a34'); }
    // crow's nest
    rect(MAST.main - 5, 16, 11, 4, WOODD); rect(MAST.main - 5, 16, 11, 1, WOODL);
    // rigging: shrouds from masts down to the rails, ratlines
    for (const [x, t, base] of [[MAST.main, 8, DECK - 3], [MAST.fore, 18, DECK - 3], [MAST.mizzen, 28, CASTLE - 3]]) {
      for (const s of [-1, 1]) { line(x, t, x + s * 12, base, '#3a2a20'); }
      for (let k = 0.3; k < 1; k += 0.12) { const y = lerp(t, base, k); line(x - 12 * k, y, x + 12 * k, y, '#4a3a2a'); }
    }
    line(MAST.main, 4, MAST.fore, 14, '#3a2a20'); line(MAST.fore, 14, 150, DECK - 20, '#3a2a20'); line(MAST.main, 4, MAST.mizzen, 26, '#3a2a20');
    // yards (sails drawn live so they billow)
    for (const [x, y, hw] of [[MAST.main, 12, 20], [MAST.main, 36, 23], [MAST.fore, 20, 17], [MAST.fore, 42, 19]]) rect(x - hw, y, hw * 2 + 1, 2, '#5a3a24');
  });
  // sail frames (billow cycle)
  sailFrames = [0, 1, 2].map(f => { const c = mk(w, h); withCtx(c, () => drawSails(f)); return c; });
}
function drawSails(f) {
  const [S, SD, SS] = SAIL_SETS[SAIL], b = [2.5, 3.5, 3][f];
  const square = (x, y0, y1, hw0, hw1) => {
    for (let y = y0; y <= y1; y++) {
      const k = (y - y0) / (y1 - y0), hw = lerp(hw0, hw1, k), bulge = Math.sin(k * Math.PI) * b;
      for (let xx = -hw; xx <= hw; xx++) {
        const t = xx / hw;
        let c = t > 0.3 + Math.sin(k * Math.PI) * 0.2 ? SD : S;
        if (SAIL === 'striped' && Math.floor((xx + hw) / 4) % 2) c = t > 0.35 ? '#a8342c' : SS;
        if (Math.abs(xx - hw * 0.1) < 0.6 && k > 0.1 && k < 0.9) c = SD;
        ctx.fillStyle = c; ctx.fillRect(Math.round(x + xx + bulge * (1 - Math.abs(t))), y, 1, 1);
      }
      ctx.fillStyle = INK; ctx.fillRect(Math.round(x - hw + bulge * 0), y, 1, 1); ctx.fillRect(Math.round(x + hw + bulge * 0), y, 1, 1);
    }
    for (let xx = -hw1; xx <= hw1; xx++) px(x + xx + Math.sin(Math.PI) * 0, y1 + 1, INK);
  };
  square(MAST.main, 14, 33, 19, 21); square(MAST.main, 38, 60, 22, 25);
  square(MAST.fore, 22, 39, 16, 18); square(MAST.fore, 44, 62, 18, 20);
  // skull on the main course

  buildShip();
  scene.stars = Array.from({ length: Math.round(W * HOR / 60) }, () => ({ x: randi(0, W - 1), y: randi(0, HOR - 10), ph: rand(0, TAU) }));
  scene.clouds = Array.from({ length: 6 }, () => ({ x: rand(-20, W + 20), y: rand(H * 0.05, H * 0.3), puffs: Array.from({ length: randi(3, 5) }, (_, i) => [i * 7 + rand(-2, 2), rand(-1.5, 1.5), rand(3, 5)]) }));
  scene.gulls = Array.from({ length: 4 }, () => ({ x: rand(0, W), y: rand(H * 0.1, H * 0.35), vx: rand(-8, 8), ph: rand(0, 10) }));
  scene.far = Array.from({ length: 2 }, (_, i) => ({ x: rand(0, W) + i * W * 0.6, w: rand(20, 60), h: rand(3, 8) }));
  world.parts = []; world.popups = []; world.shots = []; world.fx = [];
  world.baseSwell = SEA === 'calm' ? 0.5 : SEA === 'rough' ? 1.9 : rand(0.7, 1.4);
  world.swell = world.swellT = world.baseSwell;
  makeCrew();
  director.cur = null; director.cool = FORCE ? 3 : 6;
  for (let i = 0; i < 90; i++) update(1 / 30);
}
addEventListener('resize', resize);
resize();
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  if (now - last < 1000 / FPS - 1) return;
  const dt = Math.min(0.1, (now - last) / 1000) * TIME_SCALE;
  last = now;
  try { const steps = Math.ceil(dt / 0.05); for (let i = 0; i < steps; i++) update(dt / steps); render(); } catch (e) { console.error(e); }
}
requestAnimationFrame(frame);
</script>
