<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Pixel Meadow Wallpaper</title>
<script type="application/json" id="wallpaper-settings">
{
 "about": "Settings panel for the Backgrounds app. Each param is one #key=value option of this page.",
 "name": "Meadow",
 "description": "Cute animals on a sunny meadow.",
 "params": [
  {"key": "pixels", "label": "Pixel size", "type": "range", "min": 100, "max": 400, "step": 10, "default": 240, "help": "Rows of big pixels on screen. Smaller = chunkier, bigger characters."},
  {"key": "event", "label": "Repeat one event", "type": "select", "group": "testing", "default": "", "options": [["", "Off (normal)"], ["ducks", "ducks"], ["fox", "fox"], ["apples", "apples"], ["rain", "rain"], ["butterflies", "butterflies"], ["race", "race"], ["nap", "nap"], ["flock", "flock"], ["night", "night"], ["unicorn", "unicorn"], ["ufo", "ufo"], ["balloon", "balloon"], ["bison", "bison"], ["all", "all"]], "help": "Test mode: keeps repeating one event. 'all' cycles through every event."},
  {"key": "speed", "label": "Time speed", "type": "range", "min": 0.25, "max": 10, "step": 0.25, "default": 1, "group": "testing", "help": "Runs time faster (for testing)."},
  {"key": "debug", "label": "Debug overlay", "type": "toggle", "default": false, "group": "testing"}
 ]
}
</script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #88c8f0; }
  canvas { width: 100vw; height: 100vh; display: block; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* =====================================================================
   PIXEL MEADOW — a living, cozy retro wallpaper
   Options (add to the end of the address):
     #pixels=240        vertical resolution in big pixels (smaller = chunkier)
     #event=rain        test mode: repeat one event (or "all" to cycle through every event)
     #speed=3           run time faster (for testing)
     #debug             show the current event name
   Events: ducks fox apples rain butterflies race nap flock
   Rare:   night unicorn ufo balloon bison
   ===================================================================== */
const params = new URLSearchParams(location.hash.slice(1));
const ROWS = parseInt(params.get('pixels')) || 240;
const FORCE = params.get('event');
const TIME_SCALE = parseFloat(params.get('speed')) || 1;
const DEBUG = params.has('debug');
const FPS = 30;

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, HY, GY0, GY1;   // HY = horizon, GY0..GY1 = walkable meadow depth range

// ---------------------------------------------------------------- utils
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const chance = p => Math.random() < p;
const coin = () => (Math.random() < 0.5 ? 1 : -1);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
function weighted(obj) {
  const e = Object.entries(obj).filter(([, w]) => w > 0);
  let r = Math.random() * e.reduce((a, [, w]) => a + w, 0);
  for (const [k, w] of e) if ((r -= w) < 0) return k;
  return e[0][0];
}
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v + 0.5) / 16);
const bayer = (x, y) => BAYER[((y & 3) * 4) + (x & 3)];
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
const hexRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const rgbStr = a => `rgb(${a[0] | 0},${a[1] | 0},${a[2] | 0})`;
function mixHex(a, b, t) { const A = hexRgb(a), B = hexRgb(b); return rgbStr(A.map((v, i) => v + (B[i] - v) * t)); }
function px(x, y, c) { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), 1, 1); }
function rect(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), w, h); }

const PERM = Array.from({ length: 512 }, () => Math.random());
const h2 = (x, y) => PERM[((x * 73856093) ^ (y * 19349663)) & 511];
function noise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = h2(xi, yi), b = h2(xi + 1, yi), c = h2(xi, yi + 1), d = h2(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}

// ---------------------------------------------------------------- world state
const world = {
  t: 0, ents: [], parts: [], fx: [],
  wind: 0.3, windBase: 0.3, gust: 0,
  dark: 0, gloom: 0, rain: 0, rainbow: 0, flash: 0,
};
function addPart(x, y, vx, vy, life, col, o = {}) {
  if (world.parts.length > 1200) world.parts.splice(0, 150);
  world.parts.push({
    x, y, vx, vy, life, max: life, col,
    drag: o.drag ?? 1, grav: o.grav ?? 0, floor: o.floor ?? null, bounce: o.bounce ?? 0,
    size: o.size || 1, fade: o.fade ?? true, wind: o.wind ?? 0, flutter: o.flutter ?? 0, glow: o.glow ?? false, ph: rand(0, 6.28),
  });
}
function addFx(f) { f.t = f.t ?? 0; f.layer = f.layer || 'front'; world.fx.push(f); return f; }

// ---------------------------------------------------------------- scenery
const scene = { sky: null, land: null, pond: null, tree: null, burrows: [], flowers: [], clouds: [], sun: { x: 0, y: 0 }, nightStars: [], nearTop: [] };

function buildSky() {
  const s = mk(W, H), c = s.getContext('2d'), img = c.createImageData(W, H), d = img.data;
  const top = hexRgb('#5aaeee'), mid = hexRgb('#9ad4fb'), bot = hexRgb('#e6f7ff');
  for (let y = 0; y < H; y++) {
    const t = clamp(y / (HY + 4), 0, 1);
    for (let x = 0; x < W; x++) {
      const q = clamp(Math.floor(t * 8 + bayer(x, y) - 0.5), 0, 8) / 8;
      const col = q < 0.65 ? top.map((v, i) => lerp(v, mid[i], q / 0.65)) : mid.map((v, i) => lerp(v, bot[i], (q - 0.65) / 0.35));
      const o = (y * W + x) * 4;
      d[o] = col[0]; d[o + 1] = col[1]; d[o + 2] = col[2]; d[o + 3] = 255;
    }
  }
  c.putImageData(img, 0, 0);
  scene.sky = s;
  scene.nightStars = Array.from({ length: Math.round(W * HY / 180) }, () => ({ x: randi(0, W), y: randi(0, HY - 8), tw: rand(0.5, 3), ph: rand(0, 6.28), big: chance(0.08) }));
}

const ridge = (x, base, amp, f, seed) => base + Math.sin(x * f + seed) * amp + (noise(x * f * 3 + seed, seed) - 0.5) * amp * 1.4;
const inPond = (x, y, pad = 0) => {
  const P = scene.pond; if (!P) return false;
  const dx = (x - P.x) / (P.rx + pad), dy = (y - P.y) / (P.ry + pad * 0.6);
  return dx * dx + dy * dy <= 1;
};

function buildLand() {
  const s = mk(W, H), c = s.getContext('2d'), img = c.createImageData(W, H), d = img.data;
  const set = (x, y, col) => { if (x < 0 || y < 0 || x >= W || y >= H) return; const o = (y * W + x) * 4; d[o] = col[0]; d[o + 1] = col[1]; d[o + 2] = col[2]; d[o + 3] = 255; };
  const far = ['#b6dfb2', '#a7d6a3'].map(hexRgb);
  const midc = ['#92cd82', '#85c476', '#79ba6b'].map(hexRgb);
  const near = ['#7fc865', '#75bf5c', '#6bb654', '#62ad4d', '#59a446'].map(hexRgb);
  const s1 = rand(0, 50), s2 = rand(0, 50), s3 = rand(0, 50);
  const farTop = [], midTop = [];
  for (let x = 0; x < W; x++) {
    const yf = Math.round(ridge(x, HY - 18, 7, 0.016, s1));
    const ym = Math.round(ridge(x, HY - 5, 5, 0.028, s2));
    const yn = Math.round(ridge(x, HY + 8, 2.5, 0.045, s3));
    farTop[x] = yf; midTop[x] = ym; scene.nearTop[x] = yn;
    for (let y = yf; y < ym; y++) set(x, y, far[bayer(x, y) < (y - yf) / (ym - yf + 1) ? 1 : 0]);
    for (let y = ym; y < yn; y++) set(x, y, midc[clamp(Math.floor(((y - ym) / (yn - ym + 1)) * 3 + bayer(x, y) - 0.5), 0, 2)]);
    for (let y = yn; y < H; y++) set(x, y, near[clamp(Math.floor(((y - yn) / (H - yn)) * 5 + bayer(x, y) - 0.5), 0, 4)]);
  }
  // meadow flecks + tiny grass marks
  const light = hexRgb('#97da79'), dark = hexRgb('#4c943f');
  for (let i = 0; i < (W * H) / 30; i++) {
    const x = randi(0, W - 1), y = randi(scene.nearTop[x] + 1, H - 1);
    if (chance(0.5)) set(x, y, light);
    else { set(x, y, dark); if (y > HY + 30 && chance(0.5)) { set(x - 1, y - 1, dark); set(x + 1, y - 1, dark); } }
  }
  c.putImageData(img, 0, 0);

  // lollipop trees and bushes along the far/mid hills
  for (let i = 0; i < W / 22; i++) {
    const x = randi(4, W - 4), onFar = chance(0.5), top = onFar ? farTop[x] : midTop[x];
    const r = onFar ? randi(2, 3) : randi(3, 4), cy = top + (onFar ? 1 : 2) - r;
    c.fillStyle = onFar ? '#8cc08a' : '#6ba85c';
    c.fillRect(x, cy + r - 1, 1, onFar ? 2 : 3);
    for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
      if (dx * dx + dy * dy > r * r + 1) continue;
      c.fillStyle = (dx + dy) < -r * 0.5 ? (onFar ? '#b0dca8' : '#8fd070') : (dx + dy) > r * 0.4 ? (onFar ? '#88bd86' : '#4f9a48') : (onFar ? '#9ccf98' : '#66b458');
      c.fillRect(x + dx, cy + dy, 1, 1);
    }
  }

  buildPond(c);
  buildBurrows(c);
  buildTree(c);
  // little mushrooms
  for (let i = 0; i < 4; i++) {
    const x = randi(8, W - 8), y = randi(GY0 + 10, H - 6);
    if (inPond(x, y, 6)) continue;
    c.fillStyle = '#f4ead8'; c.fillRect(x, y - 1, 1, 2);
    c.fillStyle = '#e8483a'; c.fillRect(x - 1, y - 2, 3, 1); c.fillRect(x, y - 3, 1, 1);
    c.fillStyle = '#ffffff'; c.fillRect(x - 1, y - 2, 1, 1);
  }
  scene.land = s;
}

function buildPond(c) {
  const P = scene.pond = {
    x: Math.round(W * rand(0.42, 0.68)), y: Math.round(lerp(GY0, GY1, rand(0.3, 0.5))),
    rx: Math.round(W * 0.085), ry: Math.round(H * 0.045), pads: [],
  };
  for (let dy = -P.ry - 2; dy <= P.ry + 2; dy++) for (let dx = -P.rx - 2; dx <= P.rx + 2; dx++) {
    const e1 = (dx * dx) / ((P.rx + 1.6) ** 2) + (dy * dy) / ((P.ry + 1.3) ** 2);
    if (e1 > 1) continue;
    const e2 = (dx * dx) / (P.rx ** 2) + (dy * dy) / (P.ry ** 2);
    let col;
    if (e2 > 1) col = dy < 0 ? '#5a9a48' : '#d9c68e';
    else if (dy < -P.ry * 0.5 + bayer(dx + 40, dy + 40) * 2) col = '#4a9ad2';
    else if (dy > P.ry * 0.45 && bayer(dx + 40, dy + 40) < 0.4) col = '#86d0f2';
    else col = '#62b6e6';
    c.fillStyle = col; c.fillRect(P.x + dx, P.y + dy, 1, 1);
  }
  for (let i = 0; i < 3; i++) {
    const a = rand(0, 6.28), X = Math.round(P.x + Math.cos(a) * P.rx * 0.6), Y = Math.round(P.y + Math.sin(a) * P.ry * 0.5);
    c.fillStyle = '#4f9a3a'; c.fillRect(X - 1, Y, 3, 1); c.fillRect(X, Y - 1, 2, 1);
    if (chance(0.6)) { c.fillStyle = '#ffa6cc'; c.fillRect(X, Y - 1, 1, 1); }
    P.pads.push({ x: X, y: Y });
  }
  for (const side of [-1, 1]) {
    const bx = P.x + side * (P.rx - 1);
    for (let k = 0; k < 3; k++) {
      const X = bx + side * k * 2, hgt = randi(4, 7), Y = P.y + randi(-1, 2);
      c.fillStyle = '#5a9a3a'; c.fillRect(X, Y - hgt, 1, hgt);
      if (chance(0.7)) { c.fillStyle = '#7a4a2a'; c.fillRect(X, Y - hgt - 2, 1, 2); }
    }
  }
}

function buildBurrows(c) {
  scene.burrows = [];
  let tries = 0;
  while (scene.burrows.length < 4 && tries++ < 200) {
    const x = randi(20, W - 20), y = randi(GY0 + 6, GY1 - 10);
    if (inPond(x, y, 16)) continue;
    if (scene.burrows.some(b => Math.hypot(b.x - x, (b.y - y) * 2) < 40)) continue;
    scene.burrows.push({ x, y, busy: false });
  }
  for (const b of scene.burrows) {
    for (let dy = -3; dy <= 1; dy++) for (let dx = -7; dx <= 7; dx++) {
      if ((dx * dx) / 49 + (dy * dy) / 9 > 1) continue;
      c.fillStyle = dy < -1 ? '#d4ab74' : dy < 1 ? '#b88c5a' : '#9a7048';
      c.fillRect(b.x + dx, b.y + dy, 1, 1);
    }
    c.fillStyle = '#3b2618'; c.fillRect(b.x - 3, b.y - 1, 7, 2); c.fillRect(b.x - 2, b.y - 2, 5, 1);
    c.fillStyle = '#5a3c24'; c.fillRect(b.x - 3, b.y - 1, 7, 1);
    c.fillStyle = '#3b2618'; c.fillRect(b.x - 2, b.y - 1, 5, 1);
  }
}

function buildTree(c) {
  const side = scene.pond.x > W / 2 ? -1 : 1;
  const T = scene.tree = { x: Math.round(side < 0 ? W * rand(0.1, 0.18) : W * rand(0.82, 0.9)), y: Math.round(GY0 + 4), apples: [], branch: null };
  const s = H / 240;
  for (let y = Math.round(T.y - 26 * s); y <= T.y; y++) {
    const base = T.y - y < 3 ? 1 : 0;
    for (let dx = -2 - base; dx <= 2 + base; dx++) {
      c.fillStyle = dx <= -2 ? '#a8764a' : dx >= 1 ? '#6a4226' : '#8a5a34';
      c.fillRect(T.x + dx, y, 1, 1);
    }
  }
  const blobs = [[0, -34, 14], [-11, -28, 10], [11, -27, 11], [-6, -42, 9], [7, -41, 9], [0, -24, 9]].map(([x, y, r]) => [x * s, y * s, r * s]);
  const cy0 = T.y, R = Math.ceil(26 * s);
  for (let dy = -Math.ceil(54 * s); dy <= 0; dy++) for (let dx = -R; dx <= R; dx++) {
    let inside = null;
    for (const [bx, by, br] of blobs) {
      const q = ((dx - bx) ** 2 + (dy - by) ** 2) / (br * br);
      if (q <= 1 && (!inside || q < inside.q)) inside = { q, bx, by, br };
    }
    if (!inside) continue;
    const l = ((dx - inside.bx) + (dy - inside.by)) / inside.br + bayer(dx + 64, dy + 64) * 0.5;
    c.fillStyle = l < -0.55 ? '#94d86c' : l < 0.35 ? '#64b452' : l < 0.9 ? '#4e9a44' : '#3f8438';
    c.fillRect(T.x + dx, cy0 + dy, 1, 1);
  }
  for (let i = 0; i < 7; i++) {
    const [bx, by, br] = pick(blobs), a = rand(0.2, 2.9), r = rand(0.3, 0.8) * br;
    T.apples.push({ x: Math.round(T.x + bx + Math.cos(a) * r), y: Math.round(cy0 + by + Math.sin(a) * r * 0.6), on: true, regrow: 0 });
  }
  T.branch = { x: T.x + Math.round(side * 9 * s), y: Math.round(T.y - 30 * s) };   // where birds and owls perch
  T.top = Math.round(T.y - 54 * s);
}

// ---------------------------------------------------------------- flowers and grass (swaying, depth-sorted)
const FLOWER_TYPES = { grass: 7, daisy: 2, tulip: 1.3, bell: 1.2, dandelion: 1, clover: 1 };
const TULIPS = ['#ff6a8a', '#ffb13a', '#ff4a5a', '#c77dff'];
function buildFlowers() {
  scene.flowers = [];
  const n = Math.round((W * (H - HY)) / 120);
  for (let i = 0; i < n; i++) {
    const x = rand(0, W), top = scene.nearTop[Math.floor(x)] + 2;
    const y = Math.round(top + Math.pow(Math.random(), 0.9) * (H - top));
    if (inPond(x, y, 3)) continue;
    if (scene.burrows.some(b => Math.abs(b.x - x) < 8 && Math.abs(b.y - y) < 4)) continue;
    const type = weighted(FLOWER_TYPES);
    scene.flowers.push({
      x, y, type, phase: rand(0, 6.28), h: randi(2, 4) + (y > H * 0.85 ? 1 : 0),
      col: type === 'tulip' ? pick(TULIPS) : null, eaten: 0, puff: type === 'dandelion' && chance(0.4), bloom: 1,
    });
  }
  scene.flowers.sort((a, b) => a.y - b.y);
}
function drawFlower(f) {
  const X = Math.round(f.x), Y = Math.round(f.y);
  if (f.eaten > 0) { px(X, Y, '#4f9a42'); return; }
  const sway = Math.round(Math.sin(world.t * 1.7 + f.phase + f.x * 0.05) * (0.3 + world.wind * 1.4) * (f.h / 3));
  if (f.type === 'grass') {
    px(X, Y, '#4f9a42'); px(X - 1, Y - 1, '#5aa84a'); px(X + 1, Y - 1, '#5aa84a'); px(X + sway, Y - 2, '#6cbc55');
    if (f.h > 3) px(X + sway, Y - 3, '#7fcc62');
    return;
  }
  const hgt = Math.max(1, Math.round(f.h * f.bloom));
  for (let i = 0; i < hgt; i++) px(X + Math.round((sway * i) / hgt), Y - i, '#4f9a42');
  if (f.bloom < 0.6) return;
  const hx = X + sway, hy = Y - hgt;
  switch (f.type) {
    case 'daisy':
      px(hx - 1, hy, '#ffffff'); px(hx + 1, hy, '#ffffff'); px(hx, hy - 1, '#ffffff'); px(hx, hy + 1, '#f0f0f0'); px(hx, hy, '#ffcf30');
      break;
    case 'tulip':
      px(hx - 1, hy - 1, f.col); px(hx + 1, hy - 1, f.col); px(hx - 1, hy, f.col); px(hx, hy, f.col); px(hx + 1, hy, f.col); px(hx, hy - 1, mixHex(f.col.length === 7 ? f.col : '#ff6a8a', '#ffffff', 0.35));
      break;
    case 'bell':
      px(hx, hy, '#8ea6ff'); px(hx + 1, hy + 1, '#6f88f0'); px(hx - 1, hy + 1, '#6f88f0');
      break;
    case 'dandelion':
      if (f.puff) { px(hx, hy - 1, '#ffffff'); px(hx - 1, hy, '#f2f2f2'); px(hx + 1, hy, '#f2f2f2'); px(hx, hy, '#e0e0e0'); px(hx, hy + 1, '#f2f2f2'); }
      else { px(hx, hy, '#ffd23a'); px(hx + 1, hy, '#ffbf1a'); px(hx, hy - 1, '#ffe066'); }
      break;
    case 'clover':
      px(hx, hy, '#ff9ec4'); px(hx + 1, hy, '#ff7fb0'); px(hx, hy - 1, '#ffc0da');
      break;
  }
}
function nearestFlower(x, y, maxD = 1e9, filter = f => f.type !== 'grass' && f.eaten <= 0 && f.bloom >= 1) {
  let best = null, bd = maxD;
  for (const f of scene.flowers) {
    if (!filter(f)) continue;
    const d = Math.hypot(f.x - x, (f.y - y) * 1.5);
    if (d < bd) { bd = d; best = f; }
  }
  return best;
}

// ---------------------------------------------------------------- clouds, sun, sky extras
function makeCloud(size) {
  const w = size * 5, h = size * 2 + 3, white = mk(w, h), gray = mk(w, h);
  const blobs = [];
  for (let i = 0; i < 4; i++) blobs.push([size * (1 + i * 1.05) + rand(-1, 1), h - size * rand(0.6, 1.1) - 1, size * rand(0.7, 1.15)]);
  for (const [cv, hi, lo] of [[white, '#ffffff', '#dbeaf6'], [gray, '#b9c2cf', '#8e99a8']]) {
    const c = cv.getContext('2d');
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      if (y >= h - 1) continue;
      let ins = false;
      for (const [bx, by, br] of blobs) if ((x - bx) ** 2 + (y - by) ** 2 <= br * br) { ins = true; break; }
      if (!ins) continue;
      c.fillStyle = y > h * 0.62 + bayer(x, y) * 2 - 1 ? lo : hi;
      c.fillRect(x, y, 1, 1);
    }
  }
  return { white, gray, w, h };
}
function buildClouds() {
  scene.clouds = [];
  const n = randi(4, 6);
  for (let i = 0; i < n; i++) {
    const size = randi(4, 8);
    scene.clouds.push({ ...makeCloud(size), x: rand(-20, W), y: rand(4, HY - 30), speed: rand(1.2, 3) * (size / 6) });
  }
}
function drawSky() {
  ctx.drawImage(scene.sky, 0, 0);
  const d = world.dark;
  if (d > 0.3) {
    const a = clamp((d - 0.3) / 0.5, 0, 1);
    for (const s of scene.nightStars) {
      const on = Math.sin(world.t * s.tw + s.ph);
      if (bayer(s.x, s.y) > a * (0.6 + on * 0.4)) continue;
      px(s.x, s.y, s.big ? '#fff8d0' : '#ffffff');
      if (s.big && on > 0.5) { px(s.x - 1, s.y, '#c8d8ff'); px(s.x + 1, s.y, '#c8d8ff'); px(s.x, s.y - 1, '#c8d8ff'); px(s.x, s.y + 1, '#c8d8ff'); }
    }
  }
  // sun sets as night falls; moon rises opposite
  const S = scene.sun, sunY = S.y + d * (HY + 10), R = 8;
  if (sunY < HY + R) {
    for (let dy = -R - 3; dy <= R + 3; dy++) for (let dx = -R - 3; dx <= R + 3; dx++) {

  pdog: makeSet(prairieDog, { stand: {}, blink: { blink: 1 }, chirp: { chirp: 1 } }, 6, 16),
  duck: makeSet(duck, { swim: {}, a: { step: 1 }, b: { step: 2 } }, 7, 11),

// ---------------------------------------------------------------- creatures
class Critter {

    this.vx = 0; this.vy = 0; this.vz = 0; this.grav = o.grav ?? 260;

    this.flyer = o.flyer ?? false; this.clip = null; this.age = rand(0, 5); this.dead = false;
    this.brain = null; this.life = null; this.emotes = []; this.tags = {}; this.landed = true; this.extraDraw = null;
    world.ents.push(this);
  }
  act(gen) { this.brain = gen; return this; }
  resume() { if (this.life) this.brain = this.life(); return this; }
  update(dt) {
    this.age += dt;

      let r;

      if (r.done) this.brain = null;
    }

      this.vz -= this.grav * dt; this.z += this.vz * dt;
      if (this.z <= 0) { this.z = 0; this.vz = 0; this.landed = true; }
    }

  emote(name, dur = 1.6) { if (!this.emotes.some(e => e.name === name && e.t < 0.5)) this.emotes.push({ name, t: 0, dur }); }
  spr() { return this.set[this.frame] || Object.values(this.set)[0]; }
  draw() {
    const s = this.spr();
    if (this.shadow && this.clip === null && this.layer === 'ground') {
      const w = Math.max(3, Math.round(s.w * 0.55 - this.z * 0.12));
      ctx.globalAlpha = 0.2; rect(this.x - w / 2, this.y + 1, w, 1, '#14331a'); ctx.globalAlpha = 1;

    if (this.extraDraw) this.extraDraw(this, s);
    for (const e of this.emotes) {
      const k = e.t / e.dur;

      drawSpr(ICONS[e.name], this.x + this.facing * 3, this.y - this.z - s.ay - 1 - Math.min(1, k * 3) * 4, 1);
    }
  }
}

// ---- movement helpers (generators)
function* idleBlink(c, secs, base, blink) {
  let t = 0, nb = rand(0.8, 2.5);
  while (t < secs) {
    const dt = yield; t += dt; nb -= dt;
    c.frame = nb < 0 && blink ? blink : base;
    if (nb < -0.15) nb = rand(1.5, 4);
  }
  c.frame = base;
}
function* anim(c, frames, fps, secs) {
  let t = 0;
  while (t < secs) { c.frame = frames[Math.floor(t * fps) % frames.length]; t += yield; }
}
function* walkTo(c, tx, ty, speed, frames, fps = 6) {
  for (let guard = 0; guard < 2000; guard++) {
    const dx = tx - c.x, dy = ty - c.y, d = Math.hypot(dx, dy);
    if (d < 1) break;
    if (Math.abs(dx) > 0.5) c.facing = Math.sign(dx);
    c.vx = (dx / d) * speed; c.vy = (dy / d) * speed;
    c.frame = frames[Math.floor(c.age * fps) % frames.length];
    const dt = yield;
    if (Math.hypot(tx - c.x, ty - c.y) < speed * dt) { c.x = tx; c.y = ty; break; }
  }
  c.vx = c.vy = 0;
}
function* hopTo(c, tx, ty, o = {}) {
  const len = o.len ?? 12, vz = o.vz ?? 50, air = (2 * vz) / c.grav;
  for (let guard = 0; guard < 200; guard++) {
    const dx = tx - c.x, dy = ty - c.y, d = Math.hypot(dx, dy);
    if (d < 1.5) break;
    const step = Math.min(d, len);
    if (Math.abs(dx) > 0.5) c.facing = Math.sign(dx);
    c.vx = ((dx / d) * step) / air; c.vy = ((dy / d) * step) / air;
    c.vz = vz; c.landed = false; c.frame = o.hop || 'hop';
    yield* until(() => c.landed, 3);
    c.vx = c.vy = 0; c.frame = o.sit || 'sit';
    yield* wait(o.pause ?? rand(0.06, 0.22));
  }
}
const hopper = (c, x, y) => hopTo(c, x, y);
const fastHopper = (c, x, y) => hopTo(c, x, y, { len: 18, vz: 60, pause: 0.03 });
function crossesPond(x0, y0, x1, y1) {
  for (let i = 1; i < 12; i++) { const u = i / 12; if (inPond(lerp(x0, x1, u), lerp(y0, y1, u), 8)) return true; }
  return false;
}
function* travel(c, tx, ty, mover) {
  if (crossesPond(c.x, c.y, tx, ty)) {
    const P = scene.pond, s = Math.sign(c.x - P.x) || 1;
    const below = ty + c.y > 2 * P.y && P.y + P.ry + 9 < GY1;
    const wy = below ? P.y + P.ry + 9 : Math.max(GY0, P.y - P.ry - 7);
    yield* mover(c, P.x + s * P.rx * 0.8, wy);
    yield* mover(c, P.x - s * P.rx * 0.8, wy);
  }
  yield* mover(c, tx, ty);
}
function groundSpot(pad = 10) {
  for (let i = 0; i < 40; i++) {
    const x = rand(pad, W - pad), y = rand(GY0 + 4, GY1);
    if (!inPond(x, y, 10)) return { x, y };
  }
  return { x: W / 2, y: GY1 - 4 };
}
const critters = kind => world.ents.filter(e => e.kind === kind && !e.dead);

// ---- burrows: peeking in and out
function setPeek(c, b, k) {
  const s = c.spr(), vis = Math.round((s.ay + 1) * clamp(k, 0, 1));
  c.x = b.x; c.y = b.y; c.clip = vis; c.z = vis - s.ay - 1;
}
function* popUp(c, b, dur = 0.35) {
  let t = 0;
  while (t < dur) { setPeek(c, b, t / dur); t += yield; }
  setPeek(c, b, 1); c.clip = null; c.z = 0;
}
function* popDown(c, b, dur = 0.3) {
  let t = 0;
  while (t < dur) { setPeek(c, b, 1 - t / dur); t += yield; }
  setPeek(c, b, 0);
}
function freeBurrow(x, y) {
  let best = null, bd = 1e9;
  for (const b of scene.burrows) { if (b.busy) continue; const d = Math.hypot(b.x - x, b.y - y); if (d < bd) { bd = d; best = b; } }
  return best;
}
// A bunny (or anyone) dives into a burrow and waits until tags.hide is cleared
function* hideInBurrow(c) {
  const b = freeBurrow(c.x, c.y);
  if (!b) { c.frame = 'sleep'; yield* until(() => !c.tags.hide, 60); return; }
  b.busy = c;
  yield* travel(c, b.x, b.y + 0.5, fastHopper);
  c.shadow = false;
  yield* popDown(c, b, 0.25);
  yield* until(() => !c.tags.hide, 90);
  yield* wait(rand(0, 1.2));
  yield* popUp(c, b, 0.3);
  c.shadow = true; b.busy = false;
  const p = { x: clamp(c.x + rand(-30, 30), 10, W - 10), y: clamp(c.y + rand(4, 14), GY0 + 4, GY1) };
  if (!inPond(p.x, p.y, 8)) yield* hopTo(c, p.x, p.y);
}

// ---- bunny
function* bunnyLife(c) {
  for (;;) {
    if (c.tags.hide) { yield* hideInBurrow(c); continue; }
    const choice = weighted({ wander: 4, nibble: 3, flop: 1, look: 1.5, nap: world.dark > 0.5 ? 6 : 0.6, friend: 1.2, binky: 0.7 });
    if (choice === 'wander') {
      const tx = clamp(c.x + rand(-80, 80), 10, W - 10), ty = clamp(c.y + rand(-25, 25), GY0 + 4, GY1);
      if (inPond(tx, ty, 10)) { yield; continue; }
      yield* travel(c, tx, ty, hopper);
    } else if (choice === 'nibble') {
      const f = nearestFlower(c.x, c.y, 90);
      if (!f) { yield* idleBlink(c, 1, 'sit', 'blink'); continue; }
      const side = Math.sign(c.x - f.x) || 1;
      yield* travel(c, f.x + side * 6, f.y + 0.5, hopper);
      if (f.eaten > 0) continue;
      c.facing = -side;
      yield* anim(c, ['eat', 'chew'], 5, rand(1.5, 3));
      f.eaten = rand(25, 45);
      if (chance(0.4)) c.emote('heart');
      c.frame = 'sit';
    } else if (choice === 'flop') {
      yield* idleBlink(c, rand(2, 4), 'flop', null);
    } else if (choice === 'look') {
      for (let i = 0; i < randi(1, 3); i++) { yield* idleBlink(c, rand(0.8, 1.8), 'sit', 'blink'); c.facing *= -1; }
    } else if (choice === 'nap') {
      c.frame = 'sleep';
      let t = 0; const dur = rand(4, 8);
      while (t < dur && !c.tags.hide) { if (Math.floor(t / 1.6) !== Math.floor((t + 1 / 30) / 1.6)) c.emote('z', 1.4); t += yield; }
    } else if (choice === 'friend') {
      const other = critters('bunny').find(o => o !== c && Math.abs(o.x - c.x) < 120 && o.z === 0 && o.clip === null);
      if (!other) continue;
      const side = Math.sign(c.x - other.x) || 1;
      yield* travel(c, other.x + side * 12, other.y, hopper);
      c.facing = -side;
      if (Math.abs(c.x - other.x) < 20) { other.facing = side; c.emote('heart', 2); yield* wait(0.4); other.emote('heart', 2); }
      yield* idleBlink(c, 2, 'sit', 'blink');
    } else if (choice === 'binky') {   // happy bunny jump-twist
      c.emote('sparkle', 1.2);
      for (let i = 0; i < 2; i++) {
        c.vz = 75; c.landed = false; c.frame = 'hop';
        yield* wait(0.2); c.facing *= -1;
        yield* until(() => c.landed, 2); c.frame = 'sit';
        yield* wait(0.15);
      }
    }
    yield;
  }
}
function spawnBunny(x, y) {
  const c = new Critter('bunny', { set: pick(SPR.bunny), x, y, facing: coin() });
  c.life = () => bunnyLife(c);
  return c.resume();
}

// ---- prairie dogs
function* pdogLife(c, b) {
  c.shadow = false;
  setPeek(c, b, 0);
  for (;;) {
    yield* wait(rand(2, 10));
    if (c.tags.stayDown || (b.busy && b.busy !== c)) continue;
    b.busy = c;
    yield* popUp(c, b);
    for (let i = randi(1, 3); i > 0 && !c.tags.stayDown; i--) {
      yield* idleBlink(c, rand(0.8, 2), 'stand', 'blink');
      c.facing *= -1;
      if (chance(0.35)) { c.emote('note', 1.2); yield* anim(c, ['chirp', 'stand'], 6, 0.7); }
    }
    yield* popDown(c, b);
    b.busy = false;
  }
}

// ---- ducks swimming in circles on the pond

function rippleDraw(c, s) {

// ---- butterflies & bees (small ambient flyers)
const BUTTERFLY_COLS = [['#ffb13a', '#ff7a1a'], ['#8ad4ff', '#4a9aff'], ['#ffc6ea', '#ff7ac8'], ['#fff29a', '#ffd23a'], ['#d6b8ff', '#9a6aff']];
class Butterfly {
  constructor(x, y, o = {}) {
    Object.assign(this, { x, y, layer: 'air', dead: false, col: pick(BUTTERFLY_COLS), perch: null, rest: 0, ph: rand(0, 6.28), speed: rand(14, 22), leaving: false, tx: x, ty: y, swarm: null }, o);
    world.ents.push(this);
  }
  pickTarget() {
    const f = nearestFlower(this.x + rand(-80, 80), this.y + rand(-30, 30), 200);
    if (f) { this.perch = f; this.tx = f.x; this.ty = f.y - f.h - 1; }
    else { this.tx = rand(0, W); this.ty = rand(GY0 - 30, GY1); }
  }
  update(dt) {

    this.vy = lerp(this.vy || 0, (dy / (d || 1)) * this.speed, k);
    this.x += (this.vx + world.wind * 6) * dt;
    this.y += (this.vy + Math.sin(this.ph * 7) * 14) * dt;
    if (this.leaving && (this.x < -15 || this.x > W + 15)) this.dead = true;
  }

    const X = Math.round(this.x), Y = Math.round(this.y), open = this.rest > 0 ? Math.sin(this.ph * 2) > 0.6 : Math.sin(this.ph * 22) > 0;
    const [c1, c2] = this.col;
    if (open) { px(X - 1, Y - 1, c1); px(X + 1, Y - 1, c1); px(X - 1, Y, c2); px(X + 1, Y, c2); }
    else { px(X, Y - 2, c1); px(X, Y - 1, c2); }
    px(X, Y, '#3a2a2a');
  }
}
class Bee {
  constructor(x, y) {

  }
  pick() { this.home = nearestFlower(this.x + rand(-60, 60), this.y + rand(-20, 20), 150) || { x: rand(0, W), y: rand(GY0, GY1), h: 2 }; this.t = rand(2, 5); }

    this.ph += dt; this.t -= dt;

    const ty = this.leaving ? this.y : this.home.y - this.home.h - 3 + Math.sin(this.ph * 5) * 3;
    this.x += (tx - this.x) * Math.min(1, dt * 1.5) + rand(-0.4, 0.4);
    this.y += (ty - this.y) * Math.min(1, dt * 1.5) + rand(-0.4, 0.4);
    if (this.leaving && (this.x < -5 || this.x > W + 5)) this.dead = true;
  }
  draw() {

// ---- birds: fly across, sometimes stop on the tree
function* birdLife(c, o = {}) {
  const dir = o.dir ?? coin(), T = scene.tree;
  c.facing = dir; c.x = dir > 0 ? -8 : W + 8; c.y = o.y ?? rand(10, HY - 10);
  const perch = o.perch ?? chance(0.35);
  const flap = () => { c.frame = Math.floor(c.age * 9) % 2 ? 'up' : 'down'; };
  if (perch) {
    const px0 = T.branch.x + randi(-6, 6), py0 = T.branch.y + randi(-3, 3);
    for (let g = 0; g < 1500; g++) {
      const dx = px0 - c.x, dy = py0 - c.y, d = Math.hypot(dx, dy);
      if (d < 2) break;
      c.facing = Math.sign(dx) || c.facing;
      c.x += (dx / d) * 40 * (yield); c.y += (dy / d) * 40 * (1 / 30) + Math.sin(c.age * 5) * 0.3;
      flap();
    }
    c.x = px0; c.y = py0; c.frame = 'perch';
    let t = 0; const dur = rand(3, 8);
    while (t < dur && !c.tags.flee) { if (chance(0.01)) { c.facing *= -1; } if (chance(0.006)) c.emote('note', 1.2); t += yield; }
  }
  const out = coin();
  for (let g = 0; g < 1500; g++) {
    const dt = yield;
    c.facing = perch ? out : dir;
    c.x += c.facing * 45 * dt; c.y += (Math.sin(c.age * 3) * 8 - (perch ? 10 : 0)) * dt;
    flap();
    if (c.x < -12 || c.x > W + 12) break;
  }
  c.dead = true;
}
function spawnBird(o = {}) {
  const c = new Critter('bird', { set: pick(SPR.bird), layer: 'air', flyer: true, shadow: false });
  c.act(birdLife(c, o));
  return c;
}

// ---- wanderers: hedgehog or turtle strolling across
function* strollLife(c) {
  const dir = coin(), speed = c.kind === 'turtle' ? 5 : 9, y = rand(GY0 + 8, GY1 - 2);
  c.x = dir > 0 ? -10 : W + 10; c.y = y; c.facing = dir;
  const end = dir > 0 ? W + 12 : -12;
  for (let g = 0; g < 20000; g++) {
    // hedgehogs curl up if a bunny lands next to them
    if (c.kind === 'hedgehog' && critters('bunny').some(b => b.z > 2 && Math.abs(b.x - c.x) < 14 && Math.abs(b.y - c.y) < 8)) {
      c.vx = 0; c.frame = 'ball'; c.emote('bang', 1);
      yield* wait(2.5);
    }
    c.vx = dir * speed; c.facing = dir;
    c.frame = Math.floor(c.age * 4) % 2 ? 'a' : 'b';
    if (inPond(c.x + dir * 8, c.y, 6)) c.y += (c.y < scene.pond.y ? -1 : 1) * 12 * (1 / 30);
    if (chance(0.004)) { c.vx = 0; c.frame = 'a'; c.emote(chance(0.5) ? 'heart' : 'note'); yield* wait(rand(1, 2.5)); }
    yield;
    if ((dir > 0 && c.x > end) || (dir < 0 && c.x < end)) break;
  }
  c.dead = true;
}

// ---- ambient director
const amb = { birdT: rand(3, 8), walkT: rand(12, 25), family: null };
function ambientTick(dt) {
  if (amb.family) amb.family.fam.update(dt);
  const calm = world.rain < 0.2 && world.dark < 0.5;
  const flyers = world.ents.filter(e => e instanceof Butterfly && !e.leaving && !e.swarm);
  if (calm && flyers.length < 5 && chance(dt * 0.4)) new Butterfly(chance(0.5) ? -5 : W + 5, rand(GY0 - 20, GY1)).pickTarget();
  if (!calm) flyers.forEach(b => { b.leaving = true; b.perch = null; b.rest = 0; });
  const bees = world.ents.filter(e => e instanceof Bee && !e.leaving);
  if (calm && bees.length < 2 && chance(dt * 0.3)) new Bee(chance(0.5) ? -3 : W + 3, rand(GY0, GY1));
  if (!calm) bees.forEach(b => (b.leaving = true));
  if ((amb.birdT -= dt) <= 0) {
    amb.birdT = rand(8, 18);
    if (calm) { spawnBird(); if (chance(0.3)) setTimeoutish(() => spawnBird(), 0.4); }
  }
  if ((amb.walkT -= dt) <= 0) {
    amb.walkT = rand(30, 60);
    if (calm && !director.cur && !critters('hedgehog').length && !critters('turtle').length) {
      const c = new Critter(chance(0.6) ? 'hedgehog' : 'turtle');
      c.act(strollLife(c));
    }
  }
}
// tiny scheduler that runs on world time (so it respects #speed and test stepping)
function setTimeoutish(fn, secs) { addFx({ dur: secs, layer: 'none', draw() {}, done: fn }); }

function populate() {
  for (let i = 0; i < 3; i++) { const p = groundSpot(20); spawnBunny(p.x, p.y); }
  scene.burrows.forEach((b, i) => {
    if (i === scene.burrows.length - 1) return;   // leave one burrow free for bunnies
    const c = new Critter('pdog', { frame: 'stand', facing: coin() });
    c.act(pdogLife(c, b)); c.life = () => pdogLife(c, b);
  });
  amb.family = spawnDuckFamily();
  for (let i = 0; i < 4; i++) new Butterfly(rand(0, W), rand(GY0 - 10, GY1)).pickTarget();
  new Bee(rand(0, W), rand(GY0, GY1));
}

// ---------------------------------------------------------------- event helpers
const walker = (speed, frames = ['a', 'b'], fps = 6) => (c, x, y) => walkTo(c, x, y, speed, frames, fps);
const freeBunnies = () => critters('bunny').filter(b => b.clip === null && !b.tags.hide && !b.tags.busy);
function alarm(on) {
  for (const b of critters('bunny')) {
    if (on && !b.tags.hide && !b.tags.busy) { b.tags.hide = true; b.emote('bang', 1); b.resume(); }
    if (!on) b.tags.hide = false;
  }
  for (const p of critters('pdog')) p.tags.stayDown = on;
  for (const b of world.ents) if (b.kind === 'bird') b.tags.flee = on;
}
function confetti(x, y, n = 40) {
  for (let i = 0; i < n; i++) {
    const a = rand(-2.8, -0.3), sp = rand(25, 60);
    addPart(x, y, Math.cos(a) * sp, Math.sin(a) * sp, rand(2, 3.5), pick(['#ff5a8a', '#ffd23a', '#6ad66a', '#4ab0ff', '#c77dff', '#ffffff']),
      { drag: 0.3, grav: 30, flutter: 8, floor: y + rand(4, 14) });
  }
}
function laneY() {   // a horizontal lane across the meadow that misses the pond
  const P = scene.pond, below = P.y + P.ry + 12, above = P.y - P.ry - 9;
  return below < GY1 - 4 ? rand(below, GY1 - 2) : Math.max(GY0 + 6, above);
}

// ---------------------------------------------------------------- COMMON EVENTS
// Duck parade: mama leads a line of ducklings across; one gets distracted and has to catch up
function* ducks() {
  const dir = coin(), y0 = laneY(), speed = 15;
  const mama = new Critter('duck', { frame: 'a', x: dir > 0 ? -10 : W + 10, y: y0, facing: dir });
  const kids = [];
  for (let i = 0; i < randi(4, 6); i++) kids.push(new Critter('duckling', { frame: 'a', x: mama.x - dir * (11 + i * 8), y: y0, facing: dir }));
  const lagger = kids[kids.length - 1];
  let stopped = 0, quacked = false, lagPhase = 0, lagT = 0;
  for (let g = 0; g < 9000; g++) {
    const dt = yield;
    if (!quacked && Math.abs(mama.x - W / 2) < 8) {
      quacked = true; stopped = 2.2; mama.emote('note', 2);
      kids.forEach((k, i) => setTimeoutish(() => { if (k.clip === null && k.landed && k !== lagger) { k.vz = 40; k.landed = false; } }, 0.4 + i * 0.15));
    }
    if (stopped > 0) { stopped -= dt; mama.frame = 'a'; }
    else { mama.x += dir * speed * dt; mama.frame = Math.floor(world.t * 6) % 2 ? 'a' : 'b'; }
    mama.y = y0 + Math.sin(mama.x * 0.03) * 3;
    kids.forEach((k, i) => {
      const lead = i === 0 ? mama : kids[i - 1], dx = lead.x - k.x, dy = lead.y - k.y, d = Math.hypot(dx, dy);
      let sp = speed * 1.15;
      if (k === lagger) {
        if (lagPhase === 0 && (dir > 0 ? k.x > W * 0.3 : k.x < W * 0.7)) { lagPhase = 1; lagT = 2.8; k.emote('sparkle', 2); }
        if (lagPhase === 1) { lagT -= dt; k.frame = 'a'; k.facing = -dir; if (lagT <= 0) { lagPhase = 2; k.emote('bang', 1); } return; }
        if (lagPhase === 2) { sp = speed * 3; if (k.landed && chance(0.15)) { k.vz = 30; k.landed = false; } if (d < 10) { lagPhase = 3; k.emote('heart', 1.6); } }
      }
      if (d > 8) {
        k.x += (dx / d) * sp * dt; k.y += (dy / d) * sp * dt;
        k.facing = Math.sign(dx) || k.facing; k.frame = Math.floor(world.t * 8 + i) % 2 ? 'a' : 'b';
      } else k.frame = 'a';
    });
    if ([mama, ...kids].every(k => (dir > 0 ? k.x > W + 10 : k.x < -10))) break;
  }
  [mama, ...kids].forEach(k => (k.dead = true));
}

// Fox visit: fox spots a bunny, everyone dives into burrows, a prairie dog startles the fox, fox naps then leaves
function* fox() {
  const dir = coin(), mover = walker(22, ['a', 'b'], 8);
  const f = new Critter('fox', { frame: 'a', x: dir > 0 ? -14 : W + 14, y: rand(GY0 + 10, GY1 - 4), facing: dir });
  yield* travel(f, dir > 0 ? W * 0.28 : W * 0.72, f.y, mover);
  f.frame = 'sit';
  yield* wait(1.2);
  const target = freeBunnies().sort((a, b) => Math.abs(a.x - f.x) - Math.abs(b.x - f.x))[0];
  if (target) {
    f.facing = Math.sign(target.x - f.x) || f.facing; f.emote('bang', 1.2);
    yield* wait(0.6);
    alarm(true);
    f.frame = 'pounce'; f.vz = 45; f.landed = false;
    let t = 0;
    while (t < 6 && target.clip !== 0) {
      const dt = yield; t += dt;
      const dx = target.x - f.x, dy = target.y - f.y, d = Math.hypot(dx, dy);
      if (d > 14) { f.facing = Math.sign(dx) || f.facing; f.x += (dx / d) * 30 * dt; f.y += (dy / d) * 30 * dt; }
      if (f.landed) f.frame = Math.floor(world.t * 10) % 2 ? 'a' : 'b';
    }
    const b = scene.burrows.slice().sort((a, c) => Math.hypot(a.x - f.x, a.y - f.y) - Math.hypot(c.x - f.x, c.y - f.y))[0];
    if (b) yield* travel(f, b.x - f.facing * 12, b.y, mover);
    f.frame = 'sit'; f.emote('q', 2);
    yield* wait(2);
    const pd = critters('pdog').find(p => p.clip === 0);
    if (pd) {
      const burrow = scene.burrows.find(bb => bb.x === pd.x && bb.y === pd.y);
      if (burrow && !burrow.busy) {
        pd.brain = null; burrow.busy = pd;
        yield* popUp(pd, burrow);
        pd.facing = Math.sign(f.x - pd.x) || 1;
        pd.emote('note', 1.5);
        yield* anim(pd, ['chirp', 'stand'], 8, 1);
        f.emote('bang', 1); f.vz = 70; f.landed = false; f.facing = Math.sign(pd.x - f.x) || f.facing;
        yield* until(() => f.landed, 2);
        yield* popDown(pd, burrow);
        burrow.busy = false; pd.resume();
      }
    }
  }
  f.frame = 'sleep';
  for (let i = 0; i < 4; i++) { f.emote('z', 1.4); yield* wait(1.5); }
  f.frame = 'sit';
  yield* wait(0.8);
  const out = f.x < W / 2 ? -1 : 1;
  yield* travel(f, out > 0 ? W + 16 : -16, f.y, mover);
  f.dead = true;
  yield* wait(1.5);
  alarm(false);
}

// Windy day: a gust shakes apples loose, they bounce and roll, a hedgehog and bunny come to snack
class Apple {
  constructor(x, z, groundY) { Object.assign(this, { x, y: groundY, z, vx: rand(-6, 6), vz: 0, layer: 'ground', dead: false, bites: 0, rest: false }); world.ents.push(this); }
  update(dt) {
    if (this.rest) return;
    this.vz -= 220 * dt; this.z += this.vz * dt; this.x += this.vx * dt;
    if (this.z <= 0) {
      this.z = 0;
      if (Math.abs(this.vz) > 20) { this.vz *= -0.45; this.vx += rand(-10, 10); addPart(this.x, this.y, rand(-8, 8), -10, 0.4, '#7fc865', { grav: 60 }); }
      else { this.vz = 0; this.vx *= 0.92; if (Math.abs(this.vx) < 0.5) this.rest = true; }
    }
    this.x = clamp(this.x, 2, W - 2);
  }
  draw() {
    const X = Math.round(this.x), Y = Math.round(this.y - this.z);
    ctx.globalAlpha = 0.2; rect(X - 1, this.y + 1, 3, 1, '#14331a'); ctx.globalAlpha = 1;
    if (this.bites >= 3) return;
    rect(X, Y - 1, 2, 2, '#e8403a'); px(X, Y - 2, '#6a4226'); px(X, Y - 1, '#ff7a6a');
    if (this.bites >= 1) px(X + 1, Y - 1, '#fff2d0');
    if (this.bites >= 2) px(X + 1, Y, '#fff2d0');
  }
}
function* apples() {
  world.gust = 1.3;
  const T = scene.tree;
  for (const f of scene.flowers) if (f.puff && chance(0.7)) {
    f.puff = false;
    for (let i = 0; i < 4; i++) addPart(f.x, f.y - f.h - 1, rand(8, 20), rand(-12, -4), rand(3, 5), '#ffffff', { drag: 0.6, grav: 2, wind: 1, flutter: 10 });
  }
  for (let i = 0; i < 30; i++) addPart(T.x + rand(-22, 22), T.top + rand(8, 40), rand(10, 25), rand(-6, 6), rand(2, 4), pick(['#64b452', '#94d86c', '#4e9a44']), { drag: 0.7, grav: 15, wind: 1, flutter: 12 });
  const dropped = [];
  for (const a of T.apples) if (a.on && chance(0.6) && dropped.length < 4) {
    a.on = false; a.regrow = rand(60, 120);
    yield* wait(rand(0.2, 0.7));
    const gy = T.y + rand(2, 14);

  }

  if (!dropped.length) return;
  const hog = new Critter('hedgehog', { frame: 'a' });

  hog.x = dir > 0 ? -10 : W + 10; hog.y = dropped[0].y; hog.facing = dir;
  const muncher = freeBunnies()[0];
  if (muncher) { muncher.tags.busy = true; muncher.brain = null; }
  const eat = function* (c, a, frames, walkFn) {
    yield* travel(c, a.x - (Math.sign(a.x - c.x) || 1) * 7, a.y, walkFn);
    c.facing = Math.sign(a.x - c.x) || c.facing;
    for (let i = 0; i < 3; i++) { yield* anim(c, frames, 5, 0.9); a.bites++; }
    a.dead = true; c.emote('heart', 1.8);
  };
  const jobs = [eat(hog, dropped[0], ['a', 'b'], walker(9))];
  if (muncher && dropped[1]) jobs.push(eat(muncher, dropped[1], ['eat', 'chew'], hopper));
  let active = jobs.length;
  hog.act(jobs[0]);
  if (jobs[1]) muncher.act(jobs[1]);
  yield* until(() => !hog.brain && (!muncher || !jobs[1] || !muncher.brain), 60);
  if (muncher) { muncher.tags.busy = false; muncher.resume(); }
  yield* wait(1);
  hog.act((function* () { yield* walkTo(hog, dir > 0 ? W + 12 : -12, hog.y, 9, ['a', 'b'], 4); hog.dead = true; })());
  dropped.forEach(a => { if (!a.dead) setTimeoutish(() => (a.dead = true), 30); });
  void active;
}

// Rain shower: clouds darken, everyone hides, frogs come out to play, then a rainbow
function* rain() {
  const P = scene.pond, puddles = [], drops = [];
  for (let i = 0; i < 3; i++) { const p = groundSpot(20); puddles.push({ x: p.x, y: p.y, r: 0, max: rand(5, 9) }); }
  addFx({
    layer: 'ground', dur: 1e9, puddles, draw(f) {
      for (const p of puddles) {
        const r = Math.round(p.r); if (r < 1) continue;
        for (let dx = -r; dx <= r; dx++) {
          const hh = Math.round(Math.sqrt(1 - (dx * dx) / (r * r)) * r * 0.35);
          rect(p.x + dx, p.y - hh, 1, hh * 2 + 1, dx < -r * 0.3 ? '#8ecff0' : '#6cb8e4');
        }
      }
      if (world.rain < 0.05 && puddles.every(p => p.r < 0.5) && f.t > 5) f.dur = 0;
    },
  });
  addFx({
    layer: 'front', dur: 1e9, draw(f) {
      ctx.fillStyle = '#d4ecff';
      for (const d of drops) { ctx.fillRect(Math.round(d.x), Math.round(d.y), 1, 2); ctx.fillRect(Math.round(d.x) - 1, Math.round(d.y) + 2, 1, 1); }
      if (world.rain < 0.02 && !drops.length && f.t > 5) f.dur = 0;
    },
  });
  const stepRain = dt => {
    const n = world.rain * W * 0.03;
    for (let i = 0; i < n; i++) drops.push({ x: rand(-10, W + 30), y: rand(-20, HY * 0.5), vy: rand(150, 190), floor: rand(HY + 6, H) });
    for (const d of drops) {
      d.y += d.vy * dt; d.x -= (20 + world.wind * 20) * dt;
      if (d.y >= d.floor) {
        d.dead = true;
        if (inPond(d.x, d.y)) { if (chance(0.3)) addFx({ layer: 'ground', dur: 0.5, x: d.x, y: d.y, draw(f) { const r = 1 + Math.round(f.t * 6); ctx.globalAlpha = 1 - f.t * 2; rect(f.x - r, f.y, 1, 1, '#d4ecff'); rect(f.x + r, f.y, 1, 1, '#d4ecff'); ctx.globalAlpha = 1; } }); }
        else if (chance(0.4)) { addPart(d.x, d.y, -8, -18, 0.25, '#d4ecff', { grav: 150, fade: false }); addPart(d.x, d.y, 8, -18, 0.25, '#d4ecff', { grav: 150, fade: false }); }
      }
    }
    for (let i = drops.length - 1; i >= 0; i--) if (drops[i].dead) drops.splice(i, 1);
    for (const p of puddles) p.r = world.rain > 0.5 ? Math.min(p.max, p.r + dt * 0.6) : Math.max(0, p.r - dt * 0.25);
  };
  let t = 0;
  // clouds gather
  while (t < 4) { const dt = yield; t += dt; world.gloom = t / 4; world.windBase = 0.3 + t * 0.1; stepRain(dt); }
  alarm(true);
  amb.family?.mama.emote('note', 2);
  // frogs appear
  const frogs = [];
  for (let i = 0; i < randi(2, 3); i++) {
    const a = rand(0, 6.28), fr = new Critter('frog', { frame: 'sit', x: P.x + Math.cos(a) * (P.rx + 4), y: P.y + Math.sin(a) * (P.ry + 3), facing: coin() });
    fr.z = 0; fr.vz = 60; fr.landed = false; fr.grav = 300;
    fr.act((function* () {
      for (;;) {
        const target = chance(0.5) && puddles.length ? pick(puddles) : groundSpot(20);
        const tx = clamp(target.x + rand(-4, 4), 8, W - 8), ty = target.y;
        yield* travel(fr, clamp(fr.x + clamp(tx - fr.x, -50, 50), 8, W - 8), clamp(fr.y + clamp(ty - fr.y, -20, 20), GY0 + 4, GY1), (c, x, y) => hopTo(c, x, y, { hop: 'jump', sit: 'sit', len: 14, vz: 60, pause: rand(0.3, 0.9) }));
        if (chance(0.6)) { fr.emote('note', 1.2); yield* anim(fr, ['croak', 'sit'], 4, 1.5); }
        yield* wait(rand(0.3, 1));
      }
    })());
    frogs.push(fr);
    yield* wait(0.5);
  }
  t = 0;
  const dur = rand(16, 24);
  while (t < dur) { const dt = yield; t += dt; world.rain = Math.min(1, t / 2); stepRain(dt); if (chance(dt * 0.3)) pick(frogs).emote('heart', 1.4); }
  // clearing up
  t = 0;
  while (t < 4) { const dt = yield; t += dt; world.rain = Math.max(0, 1 - t / 2.5); world.gloom = Math.max(0, 1 - t / 4); world.windBase = 0.3 + (1 - t / 4) * 0.4; stepRain(dt); }
  world.rain = 0; world.gloom = 0; world.windBase = 0.3;
  // frogs hop home
  for (const fr of frogs) fr.act((function* () {
    const a = Math.atan2(fr.y - P.y, fr.x - P.x);
    yield* travel(fr, P.x + Math.cos(a) * (P.rx - 3), P.y + Math.sin(a) * (P.ry - 2), (c, x, y) => hopTo(c, x, y, { hop: 'jump', sit: 'sit', len: 16, vz: 60, pause: 0.2 }));
    fr.dead = true;
    for (let i = 0; i < 6; i++) addPart(fr.x, fr.y, rand(-15, 15), rand(-30, -10), 0.5, '#d4ecff', { grav: 150 });
  })());
  alarm(false);
  t = 0;
  while (t < 3) { const dt = yield; t += dt; world.rainbow = t / 3; stepRain(dt); }
  if (chance(0.3)) yield* unicorn();
  else yield* wait(10);
  t = 0;
  while (t < 4) { const dt = yield; t += dt; world.rainbow = Math.max(0, 1 - t / 4); stepRain(dt); }
  world.rainbow = 0;
  yield* until(() => frogs.every(f => f.dead), 15);
  frogs.forEach(f => (f.dead = true));
}

// Butterfly bloom: a patch of flowers blooms in a wave and a swirl of butterflies arrives; one lands on a bunny's head
function* butterflies() {
  const c = groundSpot(40);
  for (const f of scene.flowers) {
    const d = Math.hypot(f.x - c.x, (f.y - c.y) * 1.6);
    if (d < 45) { f.eaten = 0; f.bloom = -d / 30; if (f.type === 'grass' && chance(0.4)) { f.type = pick(['daisy', 'tulip', 'clover', 'bell']); f.col = pick(TULIPS); } }

    if (bun && !landed && t > 5 && bun.clip === null && !bun.tags.hide) {
      landed = flock[0]; landed.swarm = { x: bun.x, y: bun.y, r: 0, i: 0 }; landed.speed = 20;
      bun.tags.busy = true; bun.brain = null; bun.frame = 'sit';
    }
    if (landed && bun) {
      landed.swarm.x = bun.x + bun.facing * 2; landed.swarm.y = bun.y - bun.z - 15;
      if (Math.hypot(landed.x - landed.swarm.x, landed.y - landed.swarm.y) < 2 && chance(dt * 0.8)) { bun.emote('heart', 1.5); bun.frame = chance(0.5) ? 'blink' : 'sit'; }
    }

    try { director.cur.next(0); } catch (e) { console.error(name, e); director.cur = null; }
  }
}

// ---------------------------------------------------------------- main loop
function update(dt) {
  world.t += dt;
  world.gust = Math.max(0, world.gust - dt * 0.25);
  world.wind = world.windBase + Math.sin(world.t * 0.23) * 0.15 + world.gust;
  for (const cl of scene.clouds) {
    cl.x += cl.speed * (0.6 + world.wind) * dt;
    if (cl.x > W + 4) { cl.x = -cl.w - rand(0, 40); cl.y = rand(4, HY - 30); }
  }
  for (const f of scene.flowers) {
    if (f.eaten > 0) { f.eaten -= dt; if (f.eaten <= 0) f.bloom = 0; }
    else if (f.bloom < 1) f.bloom = Math.min(1, f.bloom + dt * 0.5);
  }
  runDirector(dt);
  ambientTick(dt);
  for (const e of [...world.ents]) e.update(dt);
  for (const p of world.parts) {
    p.life -= dt;
    if (p.drag !== 1) { const k = Math.pow(p.drag, dt); p.vx *= k; p.vy *= k; }
    p.vy += p.grav * dt;
    p.x += (p.vx + p.wind * world.wind * 20 + (p.flutter ? Math.sin(world.t * 4 + p.ph) * p.flutter : 0)) * dt;
    p.y += p.vy * dt;
    if (p.floor !== null && p.y > p.floor) {
      p.y = p.floor;
      if (p.bounce > 0 && Math.abs(p.vy) > 8) { p.vy *= -p.bounce; p.vx *= 0.7; } else { p.vy = 0; p.vx *= 0.8; }
    }
  }
  for (const f of world.fx) f.t += dt;
  world.ents = world.ents.filter(e => !e.dead);
  world.parts = world.parts.filter(p => p.life > 0);
  const finished = world.fx.filter(f => f.t > f.dur && f.done);
  world.fx = world.fx.filter(f => f.t <= f.dur);
  for (const f of finished) f.done();
  world.flash = Math.max(0, world.flash - dt * 1.5);
}
function drawParts(glow) {
  for (const p of world.parts) {
    if (p.glow !== glow) continue;
    const k = p.life / p.max, X = Math.round(p.x), Y = Math.round(p.y);
    if (p.fade && k < 0.4 && bayer(X, Y) > k * 2.5) continue;
    ctx.fillStyle = Array.isArray(p.col) ? p.col[Math.min(p.col.length - 1, Math.floor((1 - k) * p.col.length))] : p.col;
    ctx.fillRect(X, Y, p.size, p.size);
  }
}
function drawFx(layer) { for (const f of world.fx) if (f.layer === layer && f.t >= 0) f.draw(f); }
function render(dt) {
  drawSky();
  drawFx('sky');
  for (const e of world.ents) if (e.layer === 'sky') e.draw();
  ctx.drawImage(scene.land, 0, 0);
  drawTreeApples(dt);
  drawPondShimmer();
  drawFx('ground');
  const list = world.ents.filter(e => e.layer === 'ground').sort((a, b) => a.y - b.y);
  const F = scene.flowers;
  let i = 0;
  for (const e of list) {
    while (i < F.length && F[i].y <= e.y) drawFlower(F[i++]);
    e.draw();
  }
  while (i < F.length) drawFlower(F[i++]);
  for (const e of world.ents) if (e.layer === 'air') e.draw();
  drawParts(false);
  drawFx('front');
  drawLighting();
  for (const e of world.ents) if (e.layer === 'glow') e.draw();
  drawParts(true);
  drawFx('glow');
  if (DEBUG) {
    ctx.fillStyle = '#000'; ctx.font = '8px monospace';
    ctx.fillText(`${director.name || '-'}  ents:${world.ents.length} parts:${world.parts.length}`, 3, 9);
  }
}
function resize() {
  H = ROWS;
  W = Math.round((ROWS * innerWidth) / innerHeight);
  HY = Math.round(H * 0.46);
  GY0 = Math.round(H * 0.56);
  GY1 = H - 6;
  canvas.width = W; canvas.height = H;
  ctx.imageSmoothingEnabled = false;
  scene.sun = { x: Math.round(W * rand(0.3, 0.7)), y: Math.round(HY * 0.3) };
  world.ents = []; world.parts = []; world.fx = [];
  buildSky(); buildLand(); buildFlowers(); buildClouds();
  populate();
}
addEventListener('resize', resize);
resize();

let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  if (now - last < 1000 / FPS - 1) return;
  const dt = Math.min(0.1, (now - last) / 1000) * TIME_SCALE;
  last = now;
  try { update(dt); render(dt); } catch (e) { console.error(e); }
}
requestAnimationFrame(frame);
</script>
</body>
</html>
