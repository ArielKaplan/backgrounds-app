  {"key": "lon", "label": "Longitude", "type": "number", "min": -180, "max": 180, "step": 0.01, "default": "", "placeholder": "auto (IP lookup)"},

  {"key": "theme", "label": "Room theme", "type": "select", "default": "", "options": [["", "Random"], ["warm", "warm"], ["sage", "sage"], ["dusk", "dusk"], ["blue", "blue"]]},

};

  get(k) { try { const v = localStorage.getItem('cozy-room:' + k); return v ? JSON.parse(v) : null; } catch (e) { return null; } },

}

{

  // candles in a blackout
  if (world.candles > 0) for (const [cx, cy] of [[L.desk.x0 + 30, d.y], [L.win.x0 + 10, L.sillY], [L.books.x1 + 10, FY - 1]]) {
    rect(cx, cy - 5, 2, 5, '#f4efe2'); const fl = 0.8 + Math.sin(t * 13 + cx) * 0.2;
    ctx.globalAlpha = world.candles; px(cx, cy - 6, '#ffd27a'); px(cx + (Math.sin(t * 9 + cx) > 0 ? 1 : 0), cy - 7, '#ff9a3a'); ctx.globalAlpha = 1;
    (world.glows || (world.glows = [])).push([cx + 1, cy - 6, 26, '#ffb060', 0.55 * world.candles * fl]);
  }
  // spilled coffee
  if (world.puddle) { const p = world.puddle; p.w = Math.min(9, p.w + 0.05); rect(p.x - p.w / 2, FY, p.w, 1, '#5a3a24'); }
}
function drawWxIcon(x, y, on) {
  const sw = world.sw, c = on ? '#6ff0d0' : '#1a2a2a';
  if (sw.thunder > 0.5) { px(x + 1, y, c); px(x, y + 1, c); px(x + 1, y + 2, c); px(x, y + 3, c); return; }
  if (sw.snow > 0.3) { px(x, y, c); px(x + 2, y, c); px(x + 1, y + 1, c); px(x, y + 2, c); px(x + 2, y + 2, c); return; }
  if (sw.rain > 0.2) { px(x, y + 1, c); px(x + 1, y, c); px(x + 2, y + 1, c); px(x, y + 3, c); px(x + 2, y + 4, c); return; }
  if (sw.cloud > 0.6) { rect(x, y + 2, 4, 2, c); px(x + 1, y + 1, c); px(x + 2, y + 1, c); return; }
  rect(x + 1, y + 1, 2, 2, c); px(x + 1, y - 1 + 0, c); px(x + 1, y + 4, c); px(x - 1, y + 2, c); px(x + 3, y + 1, c);
}

// ---------------------------------------------------------------- lighting
function drawLighting(A, t) {
  const sw = world.sw, alt = A.sun.alt;
  let day = smooth(-7, 12, alt) * (1 - sw.dark * 0.8);
  world.lightK = day;
  // lamps come on when it's dim (unless the power is out)
  world.lamp = clamp(world.lamp + (day < 0.55 && world.power ? 1 : -1) * 0.02, 0, 1);
  world.fairy = clamp(world.fairy + (day < 0.65 && world.power ? 1 : -1) * 0.02, 0, 1);
  const g = L.glass;
  // sun patch on the floor (clear skies only)
  world.sunPatch = alt > 2 ? clamp((1 - sw.cloud * 1.1) * smooth(2, 15, alt), 0, 1) : 0;
  const morning = A.sun.az < 180;
  world.sunX = L.midX + (morning ? 1 : -1) * (30 + (1 - Math.min(alt, 50) / 50) * 50);
  if (world.sunPatch > 0.02) {
    const skew = (morning ? 1 : -1) * (0.9 + (1 - Math.min(alt, 50) / 50) * 1.6);
    const w = g.x1 - g.x0, top = WALLB + 6, bottom = FY + 4, warm = alt < 12;
    ctx.save();
    ctx.globalAlpha = 0.28 * world.sunPatch;
    ctx.fillStyle = warm ? '#ffd8a0' : '#fff6d8';
    const fx0 = L.books.x1 + 1, fx1 = L.desk.x0 - 1;   // open floor only
    for (let y = top; y < bottom; y++) {
      const off = (y - top) * skew + (morning ? 10 : -10) + (world.sunX - L.midX) * 0.6;
      const x0 = g.x0 + off, x1 = Math.min(x0 + w, fx1);
      for (let x = Math.max(Math.round(x0), fx0); x < x1; x++) { const lx = x - x0; if (Math.abs(lx - w / 2) < 1.5) continue; if (bayer(x, y) < 0.9) ctx.fillRect(x, y, 1, 1); }
    }
    ctx.restore();
  }
  // darkness (the window keeps its own light)
  const dusk = clamp(1 - Math.abs(alt - 1) / 7, 0, 1) * (1 - sw.cloud * 0.7);
  const dark = 1 - day;
  if (dark > 0.02 || dusk > 0.02) {
    const col = mixRgb(mixRgb([255, 255, 255], [255, 205, 170], dusk * 0.6), world.power ? [58, 60, 104] : [36, 36, 70], clamp(dark * 1.05, 0, 1));
    ctx.save();
    ctx.globalCompositeOperation = 'multiply';
    ctx.fillStyle = rgbStr(col);
    ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.rect(g.x1, g.y0, -(g.x1 - g.x0), g.y1 - g.y0); ctx.fill('evenodd');
    ctx.restore();
  }
  // glows
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const glow = (x, y, r, col, a) => { if (a <= 0.01) return; const gr = ctx.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, col); gr.addColorStop(1, 'rgba(0,0,0,0)'); ctx.globalAlpha = a; ctx.fillStyle = gr; ctx.fillRect(x - r, y - r, r * 2, r * 2); };
  const d = L.desk;
  if (world.lamp > 0.02) {
    glow(L.lampX - 6, d.y - 12, 34, '#ffc070', world.lamp * 0.55 * dark);
    // light cone onto the desk
    ctx.globalAlpha = world.lamp * 0.22 * dark; ctx.fillStyle = '#ffd890';
    ctx.beginPath(); ctx.moveTo(L.lampX - 10, d.y - 15); ctx.lineTo(L.lampX - 3, d.y - 15); ctx.lineTo(L.lampX + 4, d.y); ctx.lineTo(L.lampX - 22, d.y); ctx.fill();
  }
  if (world.power) glow(L.mon.x, L.mon.y - 18, 28, '#7aa8ff', 0.3 * dark);
  // the window glows into the room a little
  const [st, sb] = skyColors(A.sun.alt, sw);
  glow(L.midX, L.midY + 10, (g.x1 - g.x0) * 0.9, rgbStr(sb), 0.12 + 0.1 * (1 - dark));
  for (const [x, y, r, c, a] of world.glows || []) glow(x, y, r, c, a * dark);
  world.glows = [];
  for (const e of world.ents) if (e.glow && e.on) glow(e.x, e.y, 6, '#ff3040', 0.5);
  if (world.flash > 0.02) { ctx.globalAlpha = world.flash * 0.35; ctx.fillStyle = '#c8d4ff'; ctx.fillRect(0, 0, W, H); }
  ctx.restore();
}

// ---------------------------------------------------------------- main loop
function update(dt) {
  world.t += dt;
  if (TIME_FORCE) clock.sim += dt * (TIME_SCALE > 1 ? 30 : 1);
  if (wx.src === 'sim' || OFFLINE) simWeather();
  const tgt = targetSW(), k = 1 - Math.exp(-dt / 12);
  for (const key of Object.keys(tgt)) world.sw[key] = lerp(world.sw[key], tgt[key], key === 'thunder' ? 1 : k);
  // thunder: flashes + distant bolts
  if (world.sw.thunder > 0.5 && chance(dt / 14)) { world.flash = 1; if (chance(0.6)) out.bolt = makeBolt(); later(() => shake(), rand(0.8, 2.5)); if (chance(0.08) && !director.cur) { director.cur = evBlackout(); director.name = 'blackout'; } }
  world.flash = Math.max(0, world.flash - dt * 2.5);
  world.shake = Math.max(0, (world.shake || 0) - dt);
  world.music = Math.max(0, world.music - dt);
  world.fishHide = Math.max(0, (world.fishHide || 0) - dt);
  if (world.mug) world.mug.hot = Math.max(0, world.mug.hot - dt * 0.2);
  updateOutside(dt);
  runDirector(dt);
  for (const e of world.ents) if (!e.dead) e.update(dt);
  for (const p of world.parts) {
    p.life -= dt; if (p.drag !== 1) { const kd = Math.pow(p.drag, dt); p.vx *= kd; p.vy *= kd; }
    p.vy += p.grav * dt; p.x += (p.vx + (p.flutter ? Math.sin(world.t * 3 + p.ph) * p.flutter : 0)) * dt; p.y += p.vy * dt;
    if (p.floor !== null && p.y > p.floor) { p.y = p.floor; p.vy = 0; p.vx *= 0.7; }
  }
  for (const f of world.fx) f.t += dt;
  const done = world.fx.filter(f => f.t > f.dur && f.done);
  world.ents = world.ents.filter(e => !e.dead);
  world.parts = world.parts.filter(p => p.life > 0);
  world.fx = world.fx.filter(f => f.t <= f.dur);
  for (const f of done) f.done();
}
function drawParts(outside) {
  for (const p of world.parts) {
    if (p.outside !== outside) continue;
    const k = p.life / p.max;
    if (k < 0.3 && bayer(Math.round(p.x), Math.round(p.y)) > k * 3) continue;
    if (p.note) { const G = EMOTES.note; for (let y = 0; y < 5; y++) for (let x = 0; x < 4; x++) if (G[y][x] === 'X') px(p.x + x, p.y + y, p.col); continue; }
    px(p.x, p.y, p.col);
  }
}
function render() {
  const A = astro(nowDate().getTime(), wx.lat, wx.lon);
  ctx.save();
  if (world.shake > 0) ctx.translate(Math.round(Math.sin(world.t * 60) * world.shake * 4), 0);
  drawOutside(A);
  ctx.save(); const g = L.glass; ctx.beginPath(); ctx.rect(g.x0, g.y0, g.x1 - g.x0, g.y1 - g.y0); ctx.clip(); drawParts(true); ctx.restore();
  ctx.drawImage(scene.room, 0, 0);
  drawProps(world.t);
  const cat = theCat();
  const inside = world.ents.filter(e => !e.outside);
  for (const e of inside) if (!(e instanceof Cat)) e.draw();
  if (cat) { cat.draw(); if (cat.inBox) cat.inBox.drawFront(); }
  drawParts(false);
  drawEmotes();
  drawLighting(A, world.t);
  ctx.restore();
  if (HUD) {
    const where = (wx.city || '').toUpperCase().slice(0, 16), cond = (WX_FORCE || WMO[weatherCode()] || '').toUpperCase();
    const tt = `${Math.round(IMPERIAL ? wxTemp() * 9 / 5 + 32 : wxTemp())}${IMPERIAL ? 'F' : 'C'}`;
    const src = WX_FORCE ? 'SET' : wx.src === 'live' ? 'LIVE' : wx.src === 'cache' ? 'CACHED' : 'SIMULATED';
    ctx.globalAlpha = 0.55;
    text(`${where ? where + ' ' : ''}${tt} ${cond} · ${src}`.replace('·', '-'), 3, H - 7, '#f4ead8', '#00000080');
    ctx.globalAlpha = 1;
  }
  if (DEBUG) text(`${director.name || '-'} R${world.sw.rain.toFixed(1)} S${world.sw.snow.toFixed(1)} C${world.sw.cloud.toFixed(1)} ALT${Math.round(A.sun.alt)}`, 3, 3, '#ffffff', '#000000');
}
function populate() {
  world.ents = [];
  const c = new Cat({ x: L.bed.x, y: FY, plat: L.floorP, pose: 'sleep' });
  world.ents.push(c);
}
function resize() {
  H = ROWS; W = Math.round((ROWS * innerWidth) / innerHeight);
  canvas.width = W; canvas.height = H;
  ctx.imageSmoothingEnabled = false;
  layout();
  SPR = { mug: mugSpr(pick(['#e8e4dc', '#e8b04a', '#6aa8c8', '#d86a6a'])), yarn: yarnSpr(pick(['#e86a8a', '#6aa8e8', '#f0c050'])), ufo: ufoSpr(), balloon: balloonSpr(), box: boxSpr(false), boxFront: boxSpr(true) };
  // cat-in-box: a head sprite that sits inside
  world.mug = { x: L.mugX, y: L.desk.y, on: true, hot: 0 };
  world.parts = []; world.fx = []; world.puddle = null;
  director.cur = null; director.name = ''; director.cool = 10;
  buildRoom(); buildOutside(); out.skyCache = null; out.frost = null;
  populate();
}
addEventListener('resize', resize);
resize();

let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  if (now - last < 1000 / FPS - 1) return;
  const dt = Math.min(0.1, (now - last) / 1000) * TIME_SCALE;
  last = now;
  try { update(dt); render(); } catch (e) { console.error(e); }
}
requestAnimationFrame(frame);
</script>
</body>
</html>
