// ---------------------------------------------------------------- buildings per block (deterministic)
const ROOFS = {
  uptown: ['#8a5a4a', '#a0664a', '#9a8070', '#7a6a64', '#8c7258', '#a88a6a'],
  midtown: ['#8a94a4', '#6a7a8c', '#a8b0b8', '#5a6474', '#9aa4ac', '#788494'],
  downtown: ['#9a5a44', '#7a6a60', '#8a8a88', '#a07a5a', '#6a6a70'],
  financial: ['#7a8494', '#5a6a7a', '#c8ccd4', '#8a96a8', '#4e5a6a'],
};
const HEIGHTS = { uptown: [4, 9], midtown: [16, 60], downtown: [6, 34], financial: [26, 72] };
const blockCache = new Map();
function blockBuildings(c, r) {

  if (isConstruction(c, r)) { out.construction = { x: x0, y: y0, w, h: dep }; blockCache.set(key, out); return out; }
  if (LANDMARKS[key]) { out.lots.push(LANDMARKS[key](x0, y0, w, dep)); blockCache.set(key, out); return out; }

  while (x < x0 + w - 3) {

    if (x + lw > x0 + w - 4) lw = x0 + w - x;
    const tall = Math.round(h0 + Math.pow(R(), d === 'uptown' ? 1 : 1.6) * (h1 - h0));
    if (d !== 'uptown' && R() < 0.35 && lw > 12) {

      out.lots.push({ x, y: y0, w: lw, h: split, ht: tall, col: pick2(R, ROOFS[d]), R: R() });
      out.lots.push({ x, y: y0 + split, w: lw, h: dep - split, ht: Math.round(tall * (0.4 + R() * 0.6)), col: pick2(R, ROOFS[d]), R: R() });

    x += lw;
  }
  for (const L of out.lots) makeTiers(L, d);
  if (d === 'uptown' || d === 'downtown') {
    for (let k = 0; k < (d === 'uptown' ? 5 : 2); k++) {
      const side = Math.floor(R() * 2);

const parkData = { paths: [], trees: [], lake: null, lawn: null, fields: [], fountain: null, lamps: [] };
function buildParkData() {

// ---------------------------------------------------------------- static chunk rendering
const CH = 256, chunks = new Map(), chunkLights = new Map();
const COL = {
  road: '#4a4a52', road2: '#46464e', lane: '#8a8a82', cross: '#d8d8d0', walk: '#b4b0a8', walk2: '#aaa69e', curb: '#8a8680',
  water: '#2a5a8a', water2: '#2f6494', grass: '#6aa84a', grass2: '#5e9c42', path: '#d8c8a0', sand: '#c8a878',

function getChunk(cx, cy) {

    R(LAND_W, by, WX1 - LAND_W + 60, SW + 6, '#6a6a70'); R(LAND_W, by, WX1 - LAND_W + 60, 1, '#9a9aa0'); R(LAND_W, by + SW + 5, WX1 - LAND_W + 60, 1, '#3a3a40');

    for (let x = LAND_W + 4; x < WX1 + 60; x += 12) { lights.push({ x, y: by, c: '#ffe8a0', r: 3 }); lights.push({ x, y: by + SW + 5, c: '#ffe8a0', r: 3 }); } }

    for (let k = 3; k < BW; k += 4) R(x + k, y + 2, 1, 1, COL.walk2), R(x + k, y + BH - 3, 1, 1, COL.walk2);
    if (inPlaza(c, r)) { R(x + 2, y + 2, BW - 4, BH - 4, '#b88a82'); for (let yy = y + 2; yy < y + BH - 2; yy += 3) for (let xx = x + 2; xx < x + BW - 2; xx += 3) if ((xx + yy) % 2) R(xx, yy, 1, 1, '#a87a72'); }
  }

const COMMON = { taxi: 3, fire: 1.2, performer: 2, pigeons: 2, delivery: 1.8, dogs: 1.6, foodtruck: 1.4, picnic: 1.5, ferry: 1.5, helicopter: 1.2 };

const ALL_EVENTS = Object.keys(EVENTS);
const FEASIBLE = {

  picnic: parkVisible, ferry: () => riverVisible('w') || riverVisible('e'), helicopter: () => true,

};
const director = { cur: null, name: '', cool: 6, last: '', idx: 0, runT: 0 };
function runDirector(dt) {

    const L = chunkLights.get(cx + ',' + cy); if (!L) continue;
    for (const l of L) {
      if (l.x < v.x0 - 10 || l.x > v.x1 + 10 || l.y < v.y0 - 10 || l.y > v.y1 + 10) continue;
      if (world.lightsOut && !l.blink) continue;
      if (l.blink && Math.floor(world.t + l.x) % 2) continue;
      ctx.fillStyle = l.c;
      if (l.r > 3) {
        ctx.globalAlpha = a * (l.street ? 0.045 : 0.07); ctx.beginPath(); ctx.arc(l.x, l.y, l.r * 0.6, 0, 6.283); ctx.fill();
      }
      ctx.globalAlpha = a * 0.9; ctx.fillRect(Math.round(l.x), Math.round(l.y), 1, 1);
    }
  }
  drawTrafficLights(a);
  drawCarLights(a);
  drawBuildingLights(a);
  drawFx('nightglow');
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}
function drawHUD() {
  const k = cam.labelT;
  if (k < 6) {
    const s = cam.label, x = 5, y = VH - 10;
    if (k < 5 || Math.floor(k * 10) % 2) text(s, x, y, '#ffffff', '#1a1a22');
  }
  if (DEBUG) text(`${director.name || '-'} cars:${cars.length} peds:${peds.length} s:${Math.round(cam.s)}/${Math.round(cam.total)}`, 4, 3, '#7aff7a');
}
// The canvas is drawn a couple of pixels larger than the screen and nudged with a sub-pixel CSS
// transform every display frame, so the pan glides smoothly instead of stepping one pixel at a time.
const M = 2, renderOrigin = { x: 0, y: 0 };
let SCX = 1, SCY = 1;
function resize() {
  VH = ROWS;
  VW = Math.round((ROWS * innerWidth) / innerHeight);
  canvas.width = VW + 2 * M; canvas.height = VH + 2 * M;
  SCX = innerWidth / VW; SCY = innerHeight / VH;
  canvas.style.width = ((VW + 2 * M) * SCX) + 'px';
  canvas.style.height = ((VH + 2 * M) * SCY) + 'px';
  ctx.imageSmoothingEnabled = false;
}
function init() {
  buildParkData();
  buildRoute();
  cam.s = clamp(START_AT, 0, 1) * cam.total;
  resize();
  updateCamera(0);
  initLife();
}
addEventListener('resize', resize);
init();

let last = performance.now(), lastCam = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  // camera moves every display frame (60fps+); the city simulates and redraws at 30fps
  const cdt = Math.min(0.1, (now - lastCam) / 1000) * TIME_SCALE;
  lastCam = now;
  updateCamera(cdt);
  if (now - last >= 1000 / FPS - 1) {
    const dt = Math.min(0.1, (now - last) / 1000) * TIME_SCALE;
    last = now;
    try { update(dt); render(); } catch (e) { console.error(e); }
  }
  const fx = clamp(cam.x - VW / 2 - renderOrigin.x, -M + 0.05, M - 0.05), fy = clamp(cam.y - VH / 2 - renderOrigin.y, -M + 0.05, M - 0.05);
  canvas.style.transform = `translate(${(-(M + fx) * SCX).toFixed(2)}px, ${(-(M + fy) * SCY).toFixed(2)}px)`;
}
requestAnimationFrame(frame);
</script>
